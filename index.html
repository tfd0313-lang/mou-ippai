/* キャラの画像は1人ぶんで約470KB。全員を1ファイルに抱えると読み込みが
   実用的でなくなるため、遊ぶレベルのぶんだけ art/<id>.json から取りに行く。
   単一ファイル版(Artifact用)は ART.scene に全部入っており、その場合は
   取りに行かずそのまま使う。 */
const sceneData = Object.assign({}, ART.scene||{});
const sceneLoading = {};
const sceneFailed = {};   // 失敗を覚える。覚えないと入るたびに5秒待たされる
function ensureScene(chId){
  if(!SCENE_IDS.includes(chId) || sceneData[chId]) return Promise.resolve();
  if(sceneLoading[chId]) return sceneLoading[chId];
  sceneLoading[chId] = fetch('art/'+chId+'.json')
    .then(r=>r.ok?r.json():null)
    .then(d=>{
      if(!d){ sceneFailed[chId]=true; delete sceneLoading[chId]; return; }
      sceneFailed[chId]=false;
      sceneData[chId]=d;
      // 画像の実体化まで待つ。待たずに描画へ入ると舞台が真っ暗になる
      sceneImgs[chId]={};
      return Promise.all(Object.keys(d.imgs).map(k=>new Promise(res=>{
        const im=new Image(); im.onload=im.onerror=()=>res(); im.src=d.imgs[k];
        sceneImgs[chId][k]=im;
      })));
    })
    .catch(()=>{ sceneFailed[chId]=true; delete sceneLoading[chId]; });
    // 失敗してもSVGのキャラで遊べる。次にこのキャラへ入ったとき取り直す
  return sceneLoading[chId];
}
/* 次のレベルを先に取っておく。結果表示中に読み終わるので待ち時間が消える */
function prefetchScene(n){ const l=LEVELS[clamp(n,1,LEVELS.length)-1]; if(l) ensureScene(l.ch); }
function setChara(chId){
  const sc=sceneData[chId];
  curScene = sc || null;
  el.game.classList.toggle('scene', !!sc);
  if(sc && !sceneImgs[chId]){
    sceneImgs[chId]={};
    for(const k in sc.imgs){ const im=new Image(); im.src=sc.imgs[k]; sceneImgs[chId][k]=im; }
  }
  G.sceneCh = sc ? chId : null;
  G.sceneFace = 'neutral';
  const art=ART.chars[chId];
  curPhoto = art || null;
  // 絵があるキャラなのに、まだ読み込めていない状態。ここで仮のSVGキャラを出すと
  // 導入の暗幕ごしに透けて、本物の絵と入れ替わるところが見えてしまう。
  // 読み終わるまで何も出さない
  scenePending = !sc && SCENE_IDS.includes(chId) && !sceneFailed[chId];
  Object.values(charaEls).forEach(s=>s.classList.remove('on'));
  curChara=charaEls[chId];
  if(curScene || scenePending){
    photoEl.classList.remove('on');
    el.charaArea.classList.remove('has-photo');
  } else if(art){                // バスト写真のキャラ
    photoEl.classList.add('on');
    el.charaArea.classList.add('has-photo');
  } else {
    photoEl.classList.remove('on');
    el.charaArea.classList.remove('has-photo');
    curChara.classList.add('on');
  }
}
/* 未生成の表情は意味の近いものへ落とす */
const FACE_FALLBACK={angry:'shock',drunk:'happy',low:'meh',meh:'neutral',
                     shock:'neutral',happy:'neutral',tele:'neutral',watch:'neutral'};
function resolveFace(imgs,f){
  let k=f, guard=0;
  while(!imgs[k] && FACE_FALLBACK[k] && guard++<5) k=FACE_FALLBACK[k];
  return imgs[k]?k:'neutral';
}
function setFace(f){
  if(curScene){ G.sceneFace = resolveFace(curScene.imgs, f); return; }
  if(curPhoto){
    const src=curPhoto[f]||curPhoto.neutral;
    photoEl.style.backgroundImage=`url("${src}")`;
    return;
  }
  curChara.setAttribute('data-face',f);
}
function bubble(text){
  if(!text){ el.bubble.classList.remove('on'); return; }
  el.bubble.textContent=text; el.bubble.classList.add('on');
}
/* 泡の注文があるレベルだけ、注いでいる間の泡量を見せる(§11.2 泡のルールを教える) */
function setupFoamChip(){
  const o=foamOrder(G.lvl);
  el.foamChip.classList.add('on');   // 泡の仕組みを学べるよう全レベルで表示
  const zone=el.foamBar.querySelector('.zone');
  // 目盛りは0起点。許容の下限を左端にすると、注ぎはじめは泡が下限に
  // 届いていないので針が左端に張りついたままになり、壊れて見える
  const a1=o.accept[1];
  const pos=r=>clamp(r/a1,0,1)*100;
  zone.style.left=pos(o.ideal[0])+'%';
  zone.style.width=(pos(o.ideal[1])-pos(o.ideal[0]))+'%';
  el.foamBar.querySelector('i').style.left='0%';
  el.foamWord.textContent='—';
  el.foamChip.classList.remove('good','bad');
}
function updateFoamChip(R,trend){
  if(!el.foamChip.classList.contains('on')) return;
  const o=foamOrder(G.lvl);
  el.foamBar.querySelector('i').style.left=(clamp(R/o.accept[1],0,1)*100)+'%';
  const w=foamLabel(R,G.lvl);
  el.foamWord.textContent=w+(trend>0?'↑':trend<0?'↓':'');
  el.foamChip.classList.toggle('good',w==='ちょうど');
  el.foamChip.classList.toggle('bad',w!=='ちょうど');
}
let noticeT=0;
function notice(text,sec=1.8){ el.notice.textContent=text; el.notice.classList.add('on'); noticeT=sec; }

/* ---------- ラウンド進行 ---------- */
const G = {
  phase:'home', t:0, sim:newSim(1), lvl:LEVELS[0], selLevel:1, retry:false,
  res:null, judged:false, reactionSkippable:false, resultShown:false,
  hz:null, glassOff:{x:0,y:0,rot:0},
};
function setPhase(p){ G.phase=p; G.t=0; }
function levelOf(n){ return LEVELS[clamp(n,1,LEVELS.length)-1]; }

/* 偽予兆(酔っ払いLV15): 肩だけ動く。グラス当たり判定は動かさない */
function newFakeState(lvl){
  if(!lvl.fake) return null;
  const [a,b]=lvl.fake.at;
  return {at:a+Math.random()*(b-a), dur:lvl.fake.dur, state:'idle', t:0};
}
function newHazardState(lvl){
  if(!lvl.hazard) return null;
  const h=lvl.hazard;
  return {cfg:h, state:'idle', t:0,
    trigF: h.trig[0]+Math.random()*(h.trig[1]-h.trig[0])};   // ラウンド開始時に確定 §10.4
}
/* 同じ場所の何レベル目かを返す(別紙3.1のレベル差分に使う) */
function stageOf(lvl){
  const bg=BGS[lvl.ch];
  const same=LEVELS.filter(l=>BGS[l.ch]===bg).map(l=>l.lv).sort((a,b)=>a-b);
  return same.indexOf(lvl.lv)+1;   // 1,2,3
}
function startLevel(n, retry){
  const lvl=levelOf(n);
  G.lvl=lvl; G.sim=newSim(GLASSES[lvl.glass].cap);
  G.res=null; G.judged=false; G.retry=!!retry; G.resultShown=false;
  G.hz=newHazardState(lvl); G.glassOff={x:0,y:0,rot:0};
  G.fake=newFakeState(lvl);
  Input.enabled=false; Input.resetRound();
  el.result.classList.remove('on'); el.telemark.classList.remove('on');
  el.waitBar.classList.remove('on');
  el.pourBtn.disabled=true;
  bubble(null);
  ensureScene(lvl.ch);
  setChara(lvl.ch); setFace('neutral');
  if(retry && scenePending){
    // リトライは導入画面(読み込み待ち)を通らない。待ちのままだと何も
    // 描かれずに注ぎだけ始まってしまうので、仮のSVGキャラで再開する
    scenePending=false;
    curChara.classList.add('on');
  }
  // 演出動作(胴体のみ)。判定へは影響しない。
  // setCharaより前にやると curChara がまだ前のレベルのキャラを指していて、
  // 揺れが前のキャラに付いたまま残る(初回に揺れない・別レベルで揺れ続ける)
  Object.values(charaEls).forEach(e=>e.classList.remove('decor-sway'));
  photoEl.classList.remove('decor-sway');
  if(lvl.decorSway){
    const swayTarget = curPhoto ? photoEl : curChara;
    swayTarget.classList.add('decor-sway');
    swayTarget.style.setProperty('--sway-amp', (lvl.decorSway/3)+'px');
    swayTarget.style.setProperty('--sway-dur', (lvl.sway?lvl.sway.period:2.6)+'s');
  }
  (curPhoto?photoEl:curChara).classList.remove('tele');
  el.game.dataset.bg=BGS[lvl.ch];
  el.game.dataset.stage=stageOf(lvl);   // 1:通常 2:照明を落とす 3:環境演出を足す
  const bgArt = curScene ? null : ART.bgs[BGS[lvl.ch]];
  el.game.style.backgroundImage = bgArt ? `linear-gradient(180deg,rgba(10,7,4,.15) 0%,rgba(10,7,4,.35) 60%,rgba(10,7,4,.86) 100%), url("${bgArt}")` : '';
  el.game.style.backgroundSize = bgArt ? 'cover' : '';
  el.game.style.backgroundPosition = bgArt ? 'center 30%' : '';
  setupFoamChip();
  updateHud();
  show('game');
  if(!retry){
    el.introLv.textContent='LEVEL '+lvl.lv;
    el.introName.textContent=CHARS[lvl.ch].name;
    const st=stageOf(lvl);
    const stName=['','はじめまして','いつもの席','本気の一杯'][st]||'';
    el.introPlace.textContent='★'.repeat(CHARS[lvl.ch].stars)+'　'+CHARS[lvl.ch].place+'　—　'+stName;
    // 何が難しくなったのかを言葉で見せる。速さと泡の要求は画面から読み取れない
    const io_=foamOrder(lvl);
    el.introInfo.innerHTML=
      `満杯まで <b>${lvl.fillSec}秒</b>　猶予 <b>${graceOf(lvl).toFixed(1)}秒</b>　`+
      `泡 <b>${io_.label==='指定なし'?'自由':Math.round(io_.ideal[0]*100)+'〜'+Math.round(io_.ideal[1]*100)+'%'}</b>　`+
      (lvl.hazard?`邪魔 <b>${lvl.hazard.name}</b>`:'邪魔 <b>なし</b>');
    el.intro.classList.add('on');
    setPhase('intro');                       // 新レベルは0.8秒の導入 §11.1
  } else {
    setPhase('entrance');
  }
}
function show(name){
  el.home.classList.toggle('on',name==='home');
  el.game.classList.toggle('on',name==='game');
  if(name==='home') requestAnimationFrame(()=>{ el.home.scrollTop=0; });
}
function updateHud(){
  const c=CHARS[G.lvl.ch];
  el.hud.innerHTML=`LEVEL <b>${G.lvl.lv}</b>　${c.name} <span style="color:#E8A13C">${'★'.repeat(c.stars)}</span>`;
}
let lvBtns=null;      // レベル番号ボタンの実体。作り直さず使い回す
function updateHome(){
  const d=Save.data;
  el.homeBest.innerHTML=
    `到達 LEVEL <b>${Math.min(d.highestCleared+1,18)}</b>　`+
    `最高スコア ボタン <b>${d.best.button}</b>／傾け <b>${d.best.tilt}</b><br>`+
    `PERFECT累計 <b>${d.totalPerfect}</b>`;
  // 選び直しただけなら選択の付け替えで済ませる。
  // 以前は毎タップで18個を作り直しており、押した要素ごと消えるため
  // 押した手応えが出ず、反応が遅く感じていた
  if(lvBtns){ refreshLevels(); return; }
  lvBtns={};
  el.levels.innerHTML='';
  // 検証用ビルドは全レベル解放(SPEC 25)。人物ごとに行を分けて誰の面か分かるようにする
  const groups=[];
  LEVELS.forEach(l=>{
    const last=groups[groups.length-1];
    if(last && BGS[last.ch]===BGS[l.ch]) last.lv.push(l.lv);
    else groups.push({ch:l.ch, lv:[l.lv]});
  });
  groups.forEach(g=>{
    const row=document.createElement('div'); row.className='lvrow';
    const names=g.lv.map(n=>CHARS[levelOf(n).ch].name).join('・');
    const art=g.lv.some(n=>ART.chars[levelOf(n).ch])?' 🎨':'';
    const tag=document.createElement('span');
    tag.className='lvname';
    tag.textContent='★'.repeat(CHARS[g.ch].stars)+' '+names+art;
    row.appendChild(tag);
    const btns=document.createElement('div'); btns.className='lvbtns';
    g.lv.forEach(i=>{
      const b=document.createElement('button');
      b.textContent=i;
      if(i<=Save.data.highestCleared) b.classList.add('clear');
      if(i===G.selLevel) b.classList.add('sel');
      b.addEventListener('click',()=>{ G.selLevel=i; Snd.ui(); refreshLevels(); });
      lvBtns[i]=b;
      btns.appendChild(b);
    });
    row.appendChild(btns);
    el.levels.appendChild(row);
  });
  refreshLevels();
}
/* 選択状態とクリア印だけを付け替える */
function refreshLevels(){
  updateLvPick();
  if(!lvBtns) return;
  for(const k in lvBtns){
    const i=+k, b=lvBtns[k];
    b.classList.toggle('sel', i===G.selLevel);
    b.classList.toggle('clear', i<=Save.data.highestCleared);
  }
  el.startBtn.textContent=`LEVEL ${G.selLevel} へ`;
}
/* 1行のレベル選択。18個を並べると画面が埋まって背景の絵が出せない */
function updateLvPick(){
  const n=clamp(G.selLevel,1,LEVELS.length);
  const l=levelOf(n), c=CHARS[l.ch];
  el.lvNow.innerHTML=`LEVEL ${l.lv}<b>${c.name}</b><i>${'★'.repeat(c.stars)}　${c.place}</i>`;
  el.lvPrev.disabled = n<=1;
  el.lvNext.disabled = n>=LEVELS.length;
  el.startBtn.textContent=`LEVEL ${n} へ`;
}

/* 攻略動作の更新 §10.5 / 別紙§6 */
/* 安全なグラス揺れ: 見た目と当たり判定を一緒に動かすが、ストリームは常に開口内
   (取り込み率100%を保つ) */
function safeSwayOffset(now){
  const sw=G.lvl.sway;
  if(!sw) return {x:0,rot:0};
  const sc=CW/390, t=now/1000;
  return {
    x: Math.sin(t*Math.PI*2/sw.period)*sw.amp*sc,
    rot: sw.rot ? Math.sin(t*Math.PI*2/(sw.period*1.3))*sw.rot : 0,
  };
}
/* 偽予兆: 予兆マークも出さず、当たり判定も動かさない。肩の動きだけで惑わせる */
function fakeUpdate(dt){
  const fk=G.fake, s=G.sim;
  if(!fk||fk.state==='done') return;
  const F=(s.L+s.P)/s.C;
  if(fk.state==='idle'){
    if(s.Q>0 && F>=fk.at){ fk.state='play'; fk.t=0; setFace('tele'); Snd.blip(900,0.05,'sine',0.05); }
    return;
  }
  fk.t+=dt;
  if(fk.t>=fk.dur){ fk.state='done'; if(G.hz&&G.hz.state==='idle') setFace('watch'); }
}
function hazardUpdate(dt){
  const hz=G.hz, s=G.sim;
  if(!hz||hz.state==='done'||hz.state==='cancelled') { G.curIntake=1; return; }
  const F=(s.L+s.P)/s.C;
  hz.t+=dt;
  switch(hz.state){
    case 'idle':{
      G.curIntake=1;
      if(s.Q<=0) break;                                    // StopGrace中は開始しない
      const pred=F+effFillRate(s)*CFG.RESPONSE_BUDGET;
      const overMax = hz.cfg.maxTrig!=null && F>hz.cfg.maxTrig;  // 例:酔っ払いは90%超で新規開始しない
      const wantStart = overMax ? false : (hz.cfg.safe
        ? F>=hz.trigF                                       // 安全動作は目標充填率のみ
        : (F>=hz.trigF || pred>=CFG.PERFECT_F) && F>=CFG.MIN_F); // 下限クランプ §10.5
      if(wantStart){
        hz.state='tel'; hz.t=0;
        if(hz.cfg.safe){
          (curPhoto?photoEl:curChara).classList.add('tele');          // 体は動くが危険ではない=印は出さない
        } else {
          el.telemark.classList.add('on');
          (curPhoto?photoEl:curChara).classList.add('tele');
          setFace('tele'); Snd.tele();
        }
      }
      break;
    }
    case 'tel':{
      G.curIntake=1;                                        // 予兆中は判定を動かさない
      if(s.Q<=0 && !hz.cfg.safe){                           // 予兆中に止めた→キャンセル
        hz.state='cancelled';
        el.telemark.classList.remove('on');
        (curPhoto?photoEl:curChara).classList.remove('tele');
        setFace('watch');
        break;
      }
      if(hz.t>=hz.cfg.tel){
        hz.state='hazard'; hz.t=0;
        el.telemark.classList.remove('on');
        (curPhoto?photoEl:curChara).classList.remove('tele');
        // 写真のキャラは妨害中も「よそ見ポーズ」の画像を出し続ける。
        // watch(SVG用の目線)へ戻すと素の顔になり、なぜ入らないのか見えない
        if(!hz.cfg.safe) setFace(curScene?'tele':'watch');
      }
      break;
    }
    case 'hazard':{
      const MOVE=0.35, HOLD=0.45, BACK=0.30;
      let frac;
      if(hz.t<MOVE) frac=smoothstep(hz.t/MOVE);
      else if(hz.t<MOVE+HOLD) frac=1;
      else if(hz.t<MOVE+HOLD+BACK) frac=1-smoothstep((hz.t-MOVE-HOLD)/BACK);
      else { frac=0; hz.state='done'; setFace('watch'); }
      const m=hz.cfg.mag*frac, sc=CW/390;
      G.glassOff={x:0,y:0,rot:0};
      if(hz.cfg.type==='shift') G.glassOff.x=m*sc;
      else if(hz.cfg.type==='lower') G.glassOff.y=m*sc;
      else if(hz.cfg.type==='rotate') G.glassOff.rot=m;
      else if(hz.cfg.type==='shiftrot'){ G.glassOff.x=m*sc; G.glassOff.rot=(hz.cfg.rot||0)*frac; }
      G.curIntake=lerp(1,hz.cfg.intake,frac);
      break;
    }
    default: G.curIntake=1;
  }
  if(hz.state==='done'||hz.state==='cancelled'){ G.glassOff={x:0,y:0,rot:0}; G.curIntake=1; }
}

function update(dt){
  const s=G.sim, lvl=G.lvl;
  const Qmax=s.C/(lvl.fillSec*CFG.FILL_FACTOR);
  if(noticeT>0){ noticeT-=dt; if(noticeT<=0) el.notice.classList.remove('on'); }

  switch(G.phase){
    case 'intro':{
      // 画像の読み込みが終わるまで導入表示のまま待つ(上限5秒)。
      // 間に合わなければSVGのキャラのまま進める
      const ready = !SCENE_IDS.includes(lvl.ch) || sceneData[lvl.ch] || sceneFailed[lvl.ch] || G.t>=5;
      if(G.t>=0.8 && ready){
        if(sceneData[lvl.ch] && !curScene){ setChara(lvl.ch); setFace('neutral'); }
        else if(scenePending){
          // 5秒待っても届かなかった。真っ暗のままでは遊べないので、
          // ここだけは仮のSVGキャラを出して先へ進める
          setChara(lvl.ch); scenePending=false; setFace('neutral');
          curChara.classList.add('on');
        }
        el.intro.classList.remove('on'); setPhase('entrance');
      }
      break;
    }
    case 'entrance':{
      const dur=G.retry?0.4:0.8;
      if(G.t>=dur){
        setPhase('call');
        const c=CHARS[lvl.ch];
        const call=(lvl.order==='foamy'&&c.callFoamy)?c.callFoamy:c.call;
        bubble(call); setFace('call'); Snd.call(); Voice.speak(call,c);
      }
      break;
    }
    case 'call':{
      if(Input.mode==='tilt'&&!Input.useSwipe){
        const t=Input.tilt; t.baseBuf.push(t.ang);
        if(t.baseBuf.length>36) t.baseBuf.shift();
      }
      if(G.t>=1.1){ bubble(null); setFace('watch'); setPhase('armDelay'); }
      break;
    }
    case 'armDelay':{
      if(G.t>=0.15){
        if(Input.mode==='tilt'&&!Input.useSwipe){
          const b=Input.tilt.baseBuf.slice(-20).sort((x,y)=>x-y);
          Input.tilt.base = b.length ? b[b.length>>1] : Input.tilt.ang;
        }
        Input.enabled=true;
        el.pourBtn.disabled=false;
        if(!Save.data.foamTipSeen){
          Save.data.foamTipSeen=true; Save.save();
          notice(Input.mode==='button'
            ? '強く注ぐと泡が増える。泡が多すぎたら手を離して待てば泡が落ち着き、注ぎ足せる'
            : '深く傾けると泡が増える。泡が多すぎたら戻して待てば泡が落ち着き、注ぎ足せる',4.2);
        } else if(Input.mode==='tilt'&&Input.useSwipe&&!Save.data.swipeTipSeen){
          Save.data.swipeTipSeen=true; Save.save();
          notice('画面を左右にドラッグ。遠くまで動かすほど強く注げる',2.8);
        }
        setPhase('play');
      }
      break;
    }
    case 'play':{
      if(Input.btnHeld) Input.holdT+=dt;
      else Input.holdT=Math.max(0,Input.holdT-dt/CFG.FLOW_DECAY*CFG.HOLD_RAMP);
      if(Input.mode==='tilt'&&!Input.useSwipe){
        const t=Input.tilt;
        const dead=t.everGot?(performance.now()-t.lastEvt>3500):(G.t>2.5);
        if(dead){
          Input.useSwipe=true;
          el.tiltMsg.textContent='画面を左右にドラッグして傾ける';
          notice('傾きセンサーに届かないため、スワイプ操作に切り替えました。画面を左右にドラッグ！',2.8);
        }
      }
      s.target=Input.flow(Qmax);
      fakeUpdate(dt);
      hazardUpdate(dt);
      simStep(s,dt,{Qmax,foamMult:lvl.foamMult,intake:G.curIntake??1});
      const nf=clamp(s.Q/Qmax,0,1), fill=clamp((s.L+s.P)/s.C,0,1);
      const foamR=s.P/Math.max(s.L+s.P,1e-9);
      Snd.pour(nf,fill,foamR,dt);
      // メーターの数字は溜まった比率なので、傾きを変えてもすぐには動かない。
      // 「いまの注ぎ方だと泡がどちらへ向かうか」を矢印で足して、手応えを返す
      let ftr=0;
      if(s.Q>0){
        const fr=clamp(lerp(CFG.FOAM_LO,CFG.FOAM_HI,Math.pow(nf,CFG.FOAM_EXP))*lvl.foamMult,0,0.6);
        const fi=fr*CFG.FOAM_EXPANSION/((1-fr)+fr*CFG.FOAM_EXPANSION);
        ftr = fi>foamR+0.015?1 : fi<foamR-0.015?-1 : 0;
      } else if(s.poured && s.P>0.004*s.C) ftr=-1;   // 待ち中は泡が崩れて減っていく
      updateFoamChip(foamR,ftr);
      // 手を止めている間は「まだ注ぎ足せる」ことと残り時間を見せる
      if(s.poured && s.Q<=0){
        el.waitBar.classList.add('on');
        el.waitFill.style.transform='scaleX('+clamp(1-s.zeroT/graceOf(G.lvl),0,1)+')';
      } else {
        el.waitBar.classList.remove('on');
      }
      if(s.Q>0&&!s._vibed){
        s._vibed=true; vibe(20);
        // コツのお知らせがグラスの真上に被ったままだと、肝心の縁が見えない。
        // 注ぎはじめた瞬間に畳む
        if(noticeT>0.35) noticeT=0.35;
      }
      if(s.out){
        Input.enabled=false; el.pourBtn.disabled=true;
        s.target=0; s.Q=0; Snd.silence(); Snd.thud(); vibe(60);
        setFace('shock');
        el.waitBar.classList.remove('on');
        el.telemark.classList.remove('on'); (curPhoto?photoEl:curChara).classList.remove('tele');
        setPhase('ovfShow');
        break;
      }
      if(s.poured&&s.zeroT>=graceOf(G.lvl)){
        Input.enabled=false; el.pourBtn.disabled=true;
        el.waitBar.classList.remove('on');
        Snd.silence();
        setPhase('settle');
      }
      break;
    }
    case 'settle':{
      hazardUpdate(dt);
      simStep(s,dt,{Qmax,foamMult:lvl.foamMult,intake:1});
      Snd.settleFizz(s.P/Math.max(s.L+s.P,1e-9),dt);
      if(s.zeroT>=CFG.SETTLE) finishJudge();
      break;
    }
    case 'ovfShow':{
      simStep(s,dt,{Qmax,foamMult:lvl.foamMult,intake:1});
      if(G.t>=0.6) finishJudge();
      break;
    }
    case 'reaction':{
      const R=VERDICT[G.res.v];
      if(!G._lineShown&&G.t>=R.lineDelay){
        G._lineShown=true;
        const line=pickLine(lvl.ch,G.res.v);
        bubble(line); Voice.speak(line,CHARS[lvl.ch]);
      }
      G.reactionSkippable=G.t>=0.5;
      if(G.t>=R.dur+R.lineDelay) showResult();
      break;
    }
  }
}

function finishJudge(){
  el.foamChip.classList.remove('on');
  el.waitBar.classList.remove('on');
  const res=judge(G.sim,G.lvl);
  G.res=res; G._lineShown=false;
  const R=VERDICT[res.v];
  setFace(R.face);
  if(R.snd==='perfect'){ Snd.perfect(); vibe([25,60,25]); }
  applyRecord(res);
  setPhase('reaction');
}
function applyRecord(res){
  const d=Save.data, ok=VERDICT[res.v].ok, n=G.lvl.lv;
  G._newBest=false;
  if(ok){
    d.totalSuccess++;
    if(res.v==='PERFECT') d.totalPerfect++;
    if(n>d.highestCleared) d.highestCleared=n;             // SAFE以上で解放 §15.1
    const key='L'+n;
    if(!d.bestByLevel[key]||res.score>d.bestByLevel[key]){ d.bestByLevel[key]=res.score; }
    const mode=Input.mode==='button'?'button':'tilt';
    if(res.score>d.best[mode]){ d.best[mode]=res.score; G._newBest=true; }
  }
  Save.save();
}
function showResult(){
  prefetchScene(G.lvl.lv+1);   // 次のレベルの画像を先に取っておく
  if(G.resultShown) return;
  G.resultShown=true;
  const res=G.res, R=VERDICT[res.v], n=G.lvl.lv;
  el.clearTag.textContent=`LEVEL ${n} CLEAR`;
  el.clearTag.classList.toggle('on',R.ok);
  el.result.classList.toggle('ok',R.ok);
  el.verdict.textContent=R.word;
  el.verdict.className=R.cls;
  el.resMeta.innerHTML=`注いだ量 <b>${(res.F*100).toFixed(1)}%</b>　泡 <b>${foamLabel(res.R,G.lvl)}</b>`;
  // 何点がどこから来たかを毎回見せる。量が75点ぶんある=「縁ぎりぎりまで注ぐ
  // ゲームだ」という説明そのものになる
  el.resScore.innerHTML = res.parts
    ? `スコア <b>${res.score}</b><span id="resParts">量 ${res.parts.q}/75　泡 ${res.parts.f}/20　こぼさず ${res.parts.sp}/5</span>`
    : `スコア <b>0</b><span id="resParts">あふれ・大こぼし・86%未満は0点</span>`;
  el.newBest.classList.toggle('on',!!G._newBest);
  if(R.ok&&n<18){
    el.nextBtn.style.display='';
    el.nextBtn.textContent=`つぎへ　LEVEL ${n+1}`;
    el.retryBtn.classList.add('sub');
  } else if(R.ok&&n>=18){
    el.nextBtn.style.display='none';
    el.retryBtn.classList.add('sub');
    el.clearTag.textContent='通常編クリア！ ここから先はEX「無理杯」(次回実装)';
  } else {
    el.nextBtn.style.display='none';
    el.retryBtn.classList.remove('sub');
  }
  el.result.classList.add('on');
  setPhase('result');
}

/* ---------- 描画 ---------- */
const ctx=el.cv.getContext('2d');
let CW=0,CH=0,DPR=1;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  const r=el.cv.getBoundingClientRect();
  CW=r.width; CH=r.height;
  el.cv.width=Math.round(CW*DPR); el.cv.height=Math.round(CH*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize',resize);

const bubblesFx=[], drips=[];
/* グラス内側の半幅(高さ位置tで補間: t=0が上端,1が底) */
function innerHalfW(g,gw,t){
  const topHW=(gw/2)-gw*0.09;
  return lerp(topHW, topHW*g.taper, t);
}
/* 瓶ビール。注ぎ口をグラスの真上に固定し、流量が増えるほど深く傾ける。
   位置は「注ぎ口ありき」で決めるので、常にグラスへ注いでいる画になる */
function bottleGeom(gcx, rimY, nf){
  const sc=Math.max(0.6, Math.min(1.3, CW/390));
  // 手に持った瓶。胴を長くして握り手ごと画面外へ逃がす。
  // (平面的な指を描くと写真の人物の横で一番安っぽく見えるため、描かない)
  const BW=54*sc, BH=250*sc, NECK=42*sc;
  const R=BH/2+NECK;                                  // 中心→注ぎ口の距離
  const ang=-(1.02 + nf*1.16);                        // 未注ぎ:立て気味 / 全開:注ぎ角
  const dir={x:Math.sin(ang), y:-Math.cos(ang)};      // 注ぎ口の向き
  const spout={x:gcx + 22*sc, y:rimY - 26*sc};        // グラスの縁の少し上(やや右)
  return {sc,BW,BH,NECK,ang,R,dir,spout,
          px:spout.x - R*dir.x, py:spout.y - R*dir.y};
}
function bottleSpout(gcx, rimY, nf){ return bottleGeom(gcx,rimY,nf).spout; }
/* 瓶のシルエットを1本のパスで引く。角丸四角の組み合わせだと
   肩の折れ目が出て、写真の人物の横で作り物に見えるため。 */
/* Geminiで作った瓶の画像。注ぎ口を基準に置いて回す */
const bottleImg=(()=>{ const d=ART.props&&ART.props.bottle; if(!d) return null;
  const im=new Image(); im.src=d.src; im.__d=d; return im; })();
function drawBottle(gcx, rimY, nf, now){
  const g=bottleGeom(gcx,rimY,nf);
  const {sc,BH,NECK}=g;
  const im=bottleImg;
  if(!im||!im.complete||!im.naturalWidth) return;   // 読み込み前は描かない
  const d=im.__d;
  const L=270*sc;                       // 画面に出す瓶の長さ(口から底まで)
  const k=L/(d.w-d.mouth[0]);           // 画像の口から右端までを L に合わせる
  ctx.save();
  ctx.translate(g.px,g.py); ctx.rotate(g.ang);
  ctx.translate(0,-g.R);                // 注ぎ口の位置へ
  ctx.rotate(Math.PI/2);                // 画像の左右方向(口→底)を瓶の軸に合わせる
  // 舞台に落ち影を入れて浮かないようにする
  ctx.save();
  ctx.globalAlpha=.32; ctx.filter='blur(6px)';
  ctx.drawImage(im, -d.mouth[0]*k+6*sc, -d.mouth[1]*k+8*sc, d.w*k, d.h*k);
  ctx.restore();
  ctx.drawImage(im, -d.mouth[0]*k, -d.mouth[1]*k, d.w*k, d.h*k);
  ctx.restore();
}
/* センサーが生きているか、いま何度かを画面に出す。
   ?tilt=1 を付けると内部の値もそのまま見える(不具合の切り分け用) */
const TILTDBG=/[?&]tilt=1/.test(location.search);
function tiltReadout(a){
  if(Input.useSwipe) return;
  const t=Input.tilt;
  if(TILTDBG){
    const d=t.base===null?0:(t.ang-t.base);
    el.tiltMsg.textContent=
      `got${t.everGot?1:0} sw${Input.useSwipe?1:0} base${t.base===null?'-':t.base.toFixed(0)} `+
      `ang${t.ang.toFixed(0)} d${d.toFixed(0)} dir${t.dir} a${(d*(t.dir||1)).toFixed(0)} p${t.pouring?1:0}`;
    return;
  }
  el.tiltMsg.textContent = t.everGot
    ? `傾き ${a.toFixed(0)}° / ${CFG.TILT.START}°で注ぎ始め`
    : 'センサー待ち…';
}
function renderScene(now){
  const s=G.sim, sc=curScene, img=sceneImgs[G.sceneCh]&&sceneImgs[G.sceneCh][G.sceneFace];
  if(!img||!img.complete||!img.naturalWidth){ return; }
  const iw=img.naturalWidth, ih=img.naturalHeight;
  // 結果の表情はカメラを少し寄せて大きく見せる(オーバーな顔を見せ切る)
  const bigFace=(G.phase==='reaction'||G.phase==='result')&&
                ['happy','shock','angry','drunk','low','meh'].includes(G.sceneFace);
  const zoom = bigFace ? Math.min(1.16, 1+ (G.phase==='reaction'? Math.min(G.t,0.5)*0.32 : 0.16)) : 1;
  // 画面ぴったりに収めると、相手が動いたぶんだけ端に地の色の帯が出る。
  // 動く幅ぶんだけ大きめに敷いておき、はみ出しの範囲内で動かす
  const MARGIN=26*(CW/390);
  const k=Math.max((CW+2*MARGIN)/iw, (CH+2*MARGIN)/ih)*zoom;
  const dw=iw*k, dh=ih*k, dx=(CW-dw)/2, dy=(CH-dh)/2;
  const sway=safeSwayOffset(now);
  // 写真は妨害では動かさない。相手の動きはポーズ画像(腕時計・スマホなど)と
  // ！マークで既に見えていて、写真ごと滑らせると画面が揺れたようにしか
  // 見えない(オーナー指摘)。注ぎ損ねは下のストリーム描画で、ビールが
  // グラスの外へ垂れることで見せる。動くのは常時の安全揺れ(sway)だけ
  const lim=(v,m)=>clamp(v,-m,m);                // はみ出しを超えて動かすと端が空く
  const mx=lim(sway.x, -dx), my=0;

  // 相手が動く=シーン全体が動く(グラス当たり判定も一緒に動く)
  ctx.save();
  ctx.translate(mx, my);
  ctx.drawImage(img,dx,dy,dw,dh);

  // グラス内側(台形)を画像座標→画面座標へ
  const gl=sc.glass;
  const X=u=>dx+u*dw, Y=v=>dy+v*dh;
  const topY=Y(gl.topY), botY=Y(gl.botY);
  // 樽形のグラス(胴が膨らむタイプ)は台形で近似すると中ほどで壁から離れ、
  // 中身が長方形の板に見える。bulge を持つキャラだけ中央をふくらませる。
  // bulge が無い(=0)ときは従来どおりの台形になる
  const bulge=(gl.bulge||0)*dw;
  const hwAt=y=>{
    const t=(y-topY)/(botY-topY);
    const b=bulge*Math.sin(Math.PI*clamp(t,0,1));
    const L=X(gl.topL)+(X(gl.botL)-X(gl.topL))*t-b;
    const R=X(gl.topR)+(X(gl.botR)-X(gl.topR))*t+b;
    return {L,R,C:(L+R)/2};
  };
  // 縁を上から覗き込む構図では、液面は水平な直線ではなく楕円に見える。
  // 直線で描くと満杯でも楕円の中央止まりに見え、奥側にグラスが残って
  // 「まだ入る」と読めてしまう。ギリギリのラインが分からない原因はこれ。
  const rimRy=(gl.ry||0)*dh;                       // 縁の楕円の縦半径(画面px)
  const ryAt=y=>{ const w=hwAt(y); const w0=hwAt(topY);
    return rimRy * ((w.R-w.L)/Math.max(w0.R-w0.L,1e-6)); };
  /* 液面を楕円の「奥側の弧」で描く。手前側の縁より高い位置が液面の上端になる */
  const surface=(y,dir)=>{ const w=hwAt(y), ry=ryAt(y);
    ctx.ellipse(w.C, y, Math.max((w.R-w.L)/2,0.1), Math.max(ry,0.1), 0,
                dir>0?Math.PI:0, dir>0?Math.PI*2:Math.PI); };
  /* 壁に沿って上下する辺。bulge が 0 なら制御点が中点に来るので直線になる */
  const sideTo=(y0,y1,side)=>{
    const ym=(y0+y1)/2, p0=hwAt(y0), p1=hwAt(y1), pm=hwAt(ym);
    const x0=side>0?p0.R:p0.L, x1=side>0?p1.R:p1.L, xm=side>0?pm.R:pm.L;
    ctx.quadraticCurveTo(2*xm-(x0+x1)/2, ym, x1, y1);
  };
  const fillL=clamp(s.L/s.C,0,1), fillP=clamp(s.P/s.C,0,1);
  const innerH=botY-topY;
  const yL=botY-innerH*fillL;
  const yP=yL-innerH*fillP;
  const wob=Math.sin(now/140)*(s.Q>0?2:0.5);

  // 中身を切り抜く範囲。上端は縁の楕円の「奥側の弧」にする。
  // まっすぐな線で切ると、満杯手前で液面の弧が縁で切り落とされ、
  // 最後の数%を注いでも液面が動かなく見える(ギリギリが読めない原因)
  const clipGlass=()=>{ctx.beginPath();
    surface(topY,+1);
    sideTo(topY,botY,+1);
    ctx.lineTo(X(gl.botL),botY);   // 底はそのまま。手前の弧まで通すと器の外へはみ出す
    sideTo(botY,topY,-1);
    ctx.closePath();};

  // ビール(半透明: 指がグラス前面に写っていても透けて馴染む)
  if(fillL>0.004){
    ctx.save(); clipGlass(); ctx.clip();
    const grad=ctx.createLinearGradient(0,yL,0,botY);
    grad.addColorStop(0,'rgba(244,176,66,0.72)'); grad.addColorStop(1,'rgba(178,106,20,0.78)');
    ctx.fillStyle=grad;
    const ys=Math.min(yL+wob,botY);
    ctx.beginPath();
    surface(ys,+1);                    // 液面: 奥側の弧(上を通る)
    sideTo(ys,botY,+1);                // 右の壁
    surface(botY,-1);                  // 底: 手前側の弧(下を通る)
    sideTo(botY,ys,-1);                // 左の壁
    ctx.closePath(); ctx.fill();
    // 上昇する気泡
    ctx.fillStyle='rgba(255,235,190,0.5)';
    for(let i=bubblesFx.length-1;i>=0;i--){
      const bb=bubblesFx[i]; bb.y-=bb.v/60;
      if(bb.y<yL+2){ bubblesFx.splice(i,1); continue; }
      ctx.beginPath();ctx.arc(bb.x,bb.y,bb.r,0,Math.PI*2);ctx.fill();
    }
    if(Math.random()<0.35&&(botY-yL)>12){
      const w0=hwAt(botY);
      bubblesFx.push({x:w0.C+(Math.random()*2-1)*(w0.R-w0.L)*0.4,y:botY-3,r:0.8+Math.random()*1.4,v:12+Math.random()*20});
    }
    ctx.restore();
  }
  // 泡
  if(fillP>0.004){
    ctx.save(); clipGlass(); ctx.clip();
    ctx.fillStyle='rgba(248,241,225,0.95)';
    const yTop=Math.max(yP,topY);
    ctx.beginPath();
    surface(yTop,+1);                  // 泡の上面
    sideTo(yTop,yL,+1);
    surface(yL,-1);                    // 泡とビールの境目
    sideTo(yL,yTop,-1);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  const F=(s.L+s.P)/s.C;
  // 満点の高さそのものを線で出す。縁を見下ろす角度で描かれた絵では、
  // 液面の楕円と縁の楕円が重なってしまい、あとどれだけ入るかが読めない。
  // 縁を基準にさせず、狙う高さを直接見せる
  if(!s.out && (G.phase==='play'||G.phase==='settle')){
    const yT=botY-innerH*CFG.PERFECT_F;
    const w=hwAt(yT), rx=Math.max((w.R-w.L)/2,0.1), ry=Math.max(ryAt(yT),0.1);
    const near=clamp((F-0.5)/0.45,0,1);
    ctx.save();
    ctx.setLineDash([7,5]);
    // 泡の上でも沈まないよう、暗い線を下に敷いてから明るい線を重ねる
    ctx.lineWidth=3.4; ctx.strokeStyle=`rgba(18,11,5,${0.28+0.34*near})`;
    ctx.beginPath(); ctx.ellipse(w.C,yT,rx,ry,0,Math.PI,Math.PI*2); ctx.stroke();
    ctx.lineWidth=1.7; ctx.strokeStyle=`rgba(255,252,244,${0.42+0.48*near})`;
    ctx.beginPath(); ctx.ellipse(w.C,yT,rx,ry,0,Math.PI,Math.PI*2); ctx.stroke();
    // 両端の小さな目印。泡が線に重なっても高さが読めるようにする
    ctx.setLineDash([]); ctx.lineWidth=2.2;
    ctx.beginPath();
    ctx.moveTo(w.L-7,yT); ctx.lineTo(w.L+1,yT);
    ctx.moveTo(w.R-1,yT); ctx.lineTo(w.R+7,yT);
    ctx.stroke();
    ctx.restore();
  }
  // 縁の線。あふれる境目なので、常にうっすら出しておく
  if(!s.out){
    const near=clamp((F-0.55)/0.40,0,1);
    const hot=F>=0.95;
    ctx.strokeStyle = hot ? `rgba(255,200,90,${0.5+0.3*Math.sin(now/120)})`
                          : `rgba(255,230,180,${0.14+0.30*near})`;
    ctx.lineWidth = hot ? 2.5 : 1.8;
    const w0=hwAt(topY);
    ctx.beginPath();
    ctx.ellipse(w0.C, topY, Math.max((w0.R-w0.L)/2,0.1), Math.max(rimRy,0.1), 0, 0, Math.PI*2);
    ctx.stroke();
  }
  // 溢れ: 縁から外側へ垂れる
  if(s.ovf>0){
    ctx.fillStyle='rgba(248,241,225,0.9)';
    ctx.beginPath();
    ctx.ellipse((X(gl.topL)+X(gl.topR))/2, topY-1, (X(gl.topR)-X(gl.topL))*0.52,
                Math.max(rimRy,3), 0, 0, Math.PI*2);
    ctx.fill();
    if(G.phase==='ovfShow'&&Math.random()<0.5)
      drips.push({x:Math.random()<0.5?X(gl.topL)+2:X(gl.topR)-2, y:topY, v:0});
  }
  if(drips.length){
    ctx.fillStyle='rgba(244,196,110,0.85)';
    for(let i=drips.length-1;i>=0;i--){
      const d=drips[i]; d.v+=180/60; d.y+=d.v/60;
      if(d.y>botY+40){ drips.splice(i,1); continue; }
      ctx.beginPath();ctx.ellipse(d.x,d.y,2.4,4.5,0,0,Math.PI*2);ctx.fill();
    }
  }
  ctx.restore();   // シーン移動ここまで

  // プレイヤーが持つ瓶ビール。注ぐほど深く傾き、口からストリームが出る
  const Qmax=s.C/(G.lvl.fillSec*CFG.FILL_FACTOR);
  const nf=clamp(s.Q/Qmax,0,1);
  const gl2=sc.glass;
  const gcx=(X(gl2.topL)+X(gl2.topR))/2 + sway.x;   // 揺れのみ追従
  const rimY=topY+my;
  drawBottle(gcx, rimY, nf, now);
  if(nf>0.02){
    const targetY=Math.min(yL-(yL-yP), yL)+my;
    const missing=1-(G.curIntake??1);
    const landY = missing>0.05 ? CH*0.92 : Math.max(targetY, rimY+4);
    // 相手が気を取られている間(取り込み率が落ちている間)は、注いだ分が
    // グラスの右外へ流れて卓にこぼれる。写真を動かさずに「入っていない」を見せる
    const lx = missing>0.05 ? hwAt(botY).R + 14*(CW/390) : gcx;
    const sw=2+nf*7;
    const sp=bottleSpout(gcx, rimY, nf);
    ctx.fillStyle='rgba(240,169,60,0.92)';
    ctx.beginPath();
    ctx.moveTo(sp.x-sw*0.45, sp.y);
    ctx.quadraticCurveTo(lx-sw/2, (sp.y+landY)*0.5, lx-sw/2, landY);
    ctx.lineTo(lx+sw/2, landY);
    ctx.quadraticCurveTo(lx+sw/2+nf*2, (sp.y+landY)*0.5, sp.x+sw*0.55, sp.y);
    if(missing>0.05){   // 卓の上のはね
      ctx.closePath(); ctx.fill();
      ctx.beginPath();
      ctx.ellipse(lx, landY, sw*2.2+Math.sin(now/90)*1.5, 3, 0, 0, Math.PI*2);
    }
    ctx.closePath(); ctx.fill();
    if(missing>0.05&&Math.random()<0.6)
      drips.push({x:gcx+(Math.random()*2-1)*8, y:CH*0.9, v:20});
  }

  if(Input.mode==='tilt'){
    const a=Input.useSwipe?Math.abs(Input.swipe.ang):
      (Input.tilt.base===null?0:Math.abs(Input.tilt.ang-Input.tilt.base));
    el.tiltFill.style.width=(clamp((a-CFG.TILT.START)/(CFG.TILT.MAX-CFG.TILT.START),0,1)*100)+'%';
    tiltReadout(a);
  }
  if(DEBUG){
    el.debug.textContent=`LV ${G.lvl.lv} ${G.lvl.ch} [scene] ph ${G.phase}\nF ${(F*100).toFixed(2)}% intake ${(G.curIntake??1).toFixed(2)}`;
  }
}
function render(now){
  ctx.clearRect(0,0,CW,CH);
  const s=G.sim, lvl=G.lvl, g=GLASSES[lvl.glass];
  if(!el.game.classList.contains('on')||CW===0) return;
  if(curScene){ renderScene(now); return; }
  // 絵の読み込み待ち。仮のグラスを描くと、本物の絵に変わる瞬間が目に入る
  if(scenePending) return;

  const bg=el.game.dataset.bg;
  const tableY=CH*0.86;
  ctx.fillStyle=TABLE_COLOR[bg]||'#31251A'; ctx.fillRect(0,tableY,CW,CH-tableY);
  ctx.fillStyle='rgba(255,255,255,0.06)'; ctx.fillRect(0,tableY,CW,4);
  ctx.strokeStyle='rgba(0,0,0,0.22)'; ctx.lineWidth=1;
  for(let i=1;i<=3;i++){
    const y=tableY+(CH-tableY)*i/4;
    ctx.beginPath(); ctx.moveTo(0,y); ctx.quadraticCurveTo(CW/2,y+3,CW,y); ctx.stroke();
  }
  const wl=s.W/s.C;
  if(wl>0.0005){
    const stage=wl>=0.015?3:wl>=0.006?2:1;
    ctx.fillStyle='rgba(20,12,4,0.55)';
    ctx.beginPath();
    ctx.ellipse(CW/2,tableY+10,CW*0.12*stage,7+stage*3,0,0,Math.PI*2);
    ctx.fill();
  }

  const gw=CW*g.wFrac, gh=CH*g.hFrac;
  const homeX=CW/2, off=G.glassOff;
  const gx=homeX-gw/2, gy=tableY-gh;

  const sway=safeSwayOffset(now);
  const sx0=off.x+sway.x, srot=off.rot+sway.rot;
  ctx.save();
  ctx.translate(homeX+sx0, tableY+off.y);
  ctx.rotate(srot*Math.PI/180);
  ctx.translate(-homeX,-tableY);

  if(g.handle){
    ctx.strokeStyle='rgba(214,228,238,0.5)'; ctx.lineWidth=10; ctx.lineJoin='round';
    ctx.beginPath();
    ctx.moveTo(gx+gw-4,gy+gh*0.22);
    ctx.bezierCurveTo(gx+gw+gw*0.34,gy+gh*0.24,gx+gw+gw*0.34,gy+gh*0.62,gx+gw-4,gy+gh*0.66);
    ctx.stroke();
  }
  /* グラス輪郭(台形) */
  const topY=gy, botY=tableY-gh*0.02;
  const hwTop=gw/2, hwBot=gw/2*((g.taper+0.15)/1.15);
  const glassPath=()=>{
    ctx.beginPath();
    ctx.moveTo(homeX-hwTop,topY); ctx.lineTo(homeX-hwBot,botY);
    ctx.lineTo(homeX+hwBot,botY); ctx.lineTo(homeX+hwTop,topY);
    ctx.closePath();
  };
  glassPath(); ctx.fillStyle='rgba(210,226,238,0.11)'; ctx.fill();

  const innerTop=topY+gh*0.03, innerBot=botY-gh*0.02, innerH=innerBot-innerTop;
  const fillL=clamp(s.L/s.C,0,1), fillP=clamp(s.P/s.C,0,1);
  const hL=innerH*fillL, hP=innerH*fillP;
  const yL=innerBot-hL;
  const wob=Math.sin(now/140)*(s.Q>0?2.2:0.6);
  const hwAt=y=>innerHalfW(g,gw,(y-innerTop)/innerH);

  if(hL>0.5){
    const grad=ctx.createLinearGradient(0,yL,0,innerBot);
    grad.addColorStop(0,'#F0A93C'); grad.addColorStop(1,'#B96F14');
    ctx.fillStyle=grad;
    ctx.beginPath();
    ctx.moveTo(homeX-hwAt(innerBot),innerBot);
    ctx.lineTo(homeX-hwAt(yL),yL+wob);
    ctx.quadraticCurveTo(homeX,yL-wob,homeX+hwAt(yL),yL+wob);
    ctx.lineTo(homeX+hwAt(innerBot),innerBot);
    ctx.closePath(); ctx.fill();
    if(Math.random()<0.3&&hL>10)
      bubblesFx.push({x:homeX+(Math.random()*2-1)*hwAt(innerBot)*0.85,y:innerBot-2,r:1+Math.random()*1.6,v:14+Math.random()*22});
  }
  ctx.save();
  glassPath(); ctx.clip();
  ctx.fillStyle='rgba(255,235,190,0.5)';
  for(let i=bubblesFx.length-1;i>=0;i--){
    const b=bubblesFx[i]; b.y-=b.v/60;
    if(b.y<yL+2){ bubblesFx.splice(i,1); continue; }
    ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();

  if(hP>0.5){
    const yP=yL-hP;
    ctx.fillStyle='#F6EEDC';
    ctx.beginPath();
    ctx.moveTo(homeX-hwAt(yL),yL+1);
    ctx.lineTo(homeX-hwAt(yP),yP+3);
    const n=6;
    for(let i=0;i<=n;i++){
      const x=homeX-hwAt(yP)+hwAt(yP)*2*i/n;
      const y=yP+Math.sin(now/300+i*1.7)*1.6+(i%2?2:0);
      ctx.lineTo(x,y);
    }
    ctx.lineTo(homeX+hwAt(yL),yL+1);
    ctx.closePath(); ctx.fill();
  }

  const glassGrad=ctx.createLinearGradient(gx,0,gx+gw,0);
  glassGrad.addColorStop(0,'rgba(226,238,246,0.20)');
  glassGrad.addColorStop(0.12,'rgba(226,238,246,0.03)');
  glassGrad.addColorStop(0.85,'rgba(226,238,246,0.03)');
  glassGrad.addColorStop(1,'rgba(226,238,246,0.22)');
  glassPath(); ctx.fillStyle=glassGrad; ctx.fill();
  if(g.frosted){                                   // 冷気で曇ったグラス
    glassPath(); ctx.fillStyle='rgba(226,238,246,0.30)'; ctx.fill();
    ctx.save(); glassPath(); ctx.clip();
    ctx.fillStyle='rgba(255,255,255,0.16)';
    for(let i=0;i<26;i++){
      const fx=homeX-gw/2+((i*37)%gw), fy=topY+((i*53)%gh);
      ctx.beginPath(); ctx.arc(fx,fy,1.6+((i*7)%3),0,Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }
  glassPath(); ctx.strokeStyle='rgba(226,238,246,0.55)'; ctx.lineWidth=2.5; ctx.stroke();

  const F=(s.L+s.P)/s.C;
  if(F>=0.95&&!s.out){
    ctx.strokeStyle=`rgba(232,161,60,${0.35+0.3*Math.sin(now/120)})`;
    ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(homeX-hwTop,topY);ctx.lineTo(homeX+hwTop,topY);ctx.stroke();
  }
  ctx.restore();   // グラス移動ここまで(ストリームは動かない)

  /* ビール容器+ストリーム(常に元のグラス位置を狙う→動かされると外れる) */
  const Qmax=s.C/(lvl.fillSec*CFG.FILL_FACTOR);
  const nf=clamp(s.Q/Qmax,0,1);
  const px=homeX, py=CH*0.02;
  ctx.save();
  ctx.translate(px+gw*0.55,py+18);
  ctx.rotate(-0.35-nf*0.5);
  ctx.fillStyle='#8A5A28'; ctx.fillRect(-14,-16,52,30);
  ctx.fillStyle='#6E4419'; ctx.fillRect(-30,-9,18,14);
  ctx.restore();
  if(nf>0.02){
    const sw=2+nf*7;
    const sx=px+gw*0.55-30, sy=py+22;
    const missing=1-(G.curIntake??1);
    const aimX=homeX+sway.x;                       // 安全揺れには注ぎ手が追従する
    const targetY=missing>0.05 ? tableY-4 : Math.min(yL-hP,innerBot)-2+off.y;
    ctx.fillStyle='rgba(240,169,60,0.92)';
    ctx.beginPath();
    ctx.moveTo(sx-sw/2,sy);
    ctx.quadraticCurveTo(aimX-sw/2-6,(sy+targetY)/2,aimX-sw/2,targetY);
    ctx.lineTo(aimX+sw/2,targetY);
    ctx.quadraticCurveTo(aimX+sw/2-6+wob*0.5,(sy+targetY)/2,sx+sw/2,sy);
    ctx.closePath(); ctx.fill();
    if(missing>0.05&&Math.random()<0.6)
      drips.push({x:homeX+(Math.random()*2-1)*8,y:tableY-6,v:20});
  }

  if(s.ovf>0&&G.phase==='ovfShow'&&Math.random()<0.5)
    drips.push({x:homeX+(Math.random()<0.5?-gw*0.4:gw*0.4)+off.x,y:tableY-gh+off.y,v:0});
  if(drips.length){
    ctx.fillStyle='#F6EEDC';
    for(let i=drips.length-1;i>=0;i--){
      const d=drips[i]; d.v+=180/60; d.y+=d.v/60;
      if(d.y>tableY+6){ drips.splice(i,1); continue; }
      ctx.beginPath();ctx.ellipse(d.x,d.y,3,5,0,0,Math.PI*2);ctx.fill();
    }
  }

  if(Input.mode==='tilt'){
    const a=Input.useSwipe?Math.abs(Input.swipe.ang):
      (Input.tilt.base===null?0:Math.abs(Input.tilt.ang-Input.tilt.base));
    el.tiltFill.style.width=(clamp((a-CFG.TILT.START)/(CFG.TILT.MAX-CFG.TILT.START),0,1)*100)+'%';
    tiltReadout(a);
  }

  if(DEBUG){
    el.debug.textContent=
`LV ${lvl.lv} ${lvl.ch}  ph ${G.phase}
F  ${(F*100).toFixed(2)}%
L ${(s.L*100).toFixed(1)} P ${(s.P*100).toFixed(1)} W ${(s.W*100).toFixed(2)}
Q ${s.Q.toFixed(3)} R ${(s.P/Math.max(s.L+s.P,1e-9)*100).toFixed(1)}%
hz ${G.hz?G.hz.state+' trig'+(G.hz.trigF*100).toFixed(0):'-'}
intake ${(G.curIntake??1).toFixed(2)} zero ${s.zeroT.toFixed(2)}`;
  }
}

/* ---------- メインループ ---------- */
let last=performance.now(), acc=0;
function frame(now){
  let dt=(now-last)/1000; last=now;
  dt=Math.min(dt,0.25);
  acc+=dt;
  while(acc>=CFG.TICK){ G.t+=CFG.TICK; update(CFG.TICK); acc-=CFG.TICK; }
  render(now);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------- イベント ---------- */
function armAudio(){ Snd.init(); Snd.resume(); }
document.addEventListener('pointerdown',armAudio,{passive:true});

el.pourBtn.addEventListener('pointerdown',e=>{
  e.preventDefault();
  if(el.pourBtn.disabled) return;
  el.pourBtn.setPointerCapture(e.pointerId);
  el.pourBtn.classList.add('down');
  Input.btnHeld=true;
});
const releasePour=()=>{ Input.btnHeld=false; el.pourBtn.classList.remove('down'); };
el.pourBtn.addEventListener('pointerup',releasePour);
el.pourBtn.addEventListener('pointercancel',releasePour);
window.addEventListener('blur',releasePour);
document.addEventListener('visibilitychange',()=>{ if(document.hidden) releasePour(); });
window.addEventListener('keydown',e=>{ if(e.code==='Space'&&!e.repeat&&!el.pourBtn.disabled){Input.btnHeld=true;el.pourBtn.classList.add('down');} });
window.addEventListener('keyup',e=>{ if(e.code==='Space') releasePour(); });

/* ドラッグで傾け(センサーが使えない環境の代替)。画面のどこを掴んでもよい */
el.game.addEventListener('pointerdown',e=>{
  if(Input.mode!=='tilt'||!Input.useSwipe) return;
  if(e.target===el.pourBtn) return;
  Input.swipe.active=true; Input.swipe.startX=e.clientX;
  try{ el.game.setPointerCapture(e.pointerId); }catch(_){}
});
el.game.addEventListener('pointermove',e=>{
  if(!Input.swipe.active) return;
  // 画面幅の約4割ドラッグで最大流量に届く
  const span=Math.max(140, el.game.clientWidth*0.42);
  Input.swipe.ang=clamp((e.clientX-Input.swipe.startX)/span*CFG.TILT.MAX,-CFG.TILT.MAX,CFG.TILT.MAX);
});
const endSwipe=()=>{ Input.swipe.active=false; Input.swipe.ang=0; };
el.game.addEventListener('pointerup',endSwipe);
el.game.addEventListener('pointercancel',endSwipe);
el.game.addEventListener('pointerleave',endSwipe);

el.game.addEventListener('pointerdown',()=>{
  if(G.phase==='reaction'&&G.reactionSkippable) showResult();
});

function setMode(m,silent){
  Input.mode=m;
  el.modeBtnBtn.classList.toggle('on',m==='button');
  el.modeTiltBtn.classList.toggle('on',m==='tilt');
  setTiltLabel();
  if(!silent) Snd.ui();
}
/* 傾けボタンの表示を実際の入力手段に合わせる(嘘の選択肢を見せない) */
function setTiltLabel(){
  el.modeTiltBtn.textContent = Input.useSwipe ? 'ドラッグで注ぐ' : '傾けて注ぐ';
  if(Input.mode==='tilt'&&Input.useSwipe) el.modeHint.textContent='この端末ではセンサーが使えないため、画面を左右にドラッグして注ぎます';
  else if(Input.mode==='tilt') el.modeHint.textContent='✓ 傾けて注ぐモード。瓶を傾けるように、上端を前へ倒してください';
  else el.modeHint.textContent = Input.tilt.everGot
    ? '✓ ボタンモード。傾けて注ぎたいときは右の「傾けて注ぐ」を押してください'
    : '押し続けるほど勢いが増し、泡が多くなります';
}
el.homeBg.style.backgroundImage=`url("${ART.bgs.title||ART.bgs.izakaya}")`;
const stepLevel=d=>{ G.selLevel=clamp(G.selLevel+d,1,LEVELS.length); Snd.ui(); refreshLevels(); };
el.lvPrev.addEventListener('click',()=>stepLevel(-1));
el.lvNext.addEventListener('click',()=>stepLevel(1));
el.modeBtnBtn.addEventListener('click',()=>setMode('button'));

el.modeTiltBtn.addEventListener('click',async()=>{
  setMode('tilt');
  const ok=await Input.requestTilt();
  if(!ok){ Input.useSwipe=true; setTiltLabel(); return; }
  // 初回イベントが来るまで端末によっては1秒以上かかる。届いた時点で確定させ、
  // 2.5秒待っても来なければドラッグへ落とす
  let waited=0;
  const iv=setInterval(()=>{
    waited+=200;
    if(Input.tilt.everGot){ Input.useSwipe=false; setTiltLabel(); clearInterval(iv); }
    else if(waited>=2500){ Input.useSwipe=true; setTiltLabel(); clearInterval(iv); }
  },200);
});
function syncVoiceBtn(){
  el.voiceBtn.classList.toggle('on',!!Save.data.voice);
  el.voiceBtn.textContent=Save.data.voice?'声 ON':'声 OFF';
  el.voiceBtn.setAttribute('aria-pressed',String(!!Save.data.voice));
}
el.voiceBtn.addEventListener('click',()=>{
  Save.data.voice=!Save.data.voice; Save.save(); syncVoiceBtn(); setTiltLabel(); Snd.ui();
  if(Save.data.voice) Voice.speak('もう一杯！',CHARS.papa);
});
// ブラウザによる位置の復元を止める(再訪時にレベル一覧から始まってしまう)
try{ if('scrollRestoration' in history) history.scrollRestoration='manual'; }catch(e){}
addEventListener('load',()=>{ el.home.scrollTop=0; scrollTo(0,0); });
el.home.scrollTop=0;

syncVoiceBtn(); setTiltLabel();

/* 許可の要らない端末(Android等)では読み込み時点でセンサーを購読しておく。
   ボタンを押してから初回イベントを待つ作りだと、WebViewのように配信が遅い
   環境で「センサーなし」と誤判定され、以後ドラッグ操作に固定されていた。
   先に繋いでおけば、傾けを選ぶ時点で既に値が来ている。 */
if(typeof DeviceOrientationEvent!=='undefined' &&
   typeof DeviceOrientationEvent.requestPermission!=='function'){
  Input.startTiltListener();
  // 傾けて注ぐのがこのゲームの主役。センサーが実際に動いている端末では
  // 最初から傾けを選んでおく(以前はボタンが既定で、選び直さないと使えなかった)
  let tries=0;
  const pick=setInterval(()=>{
    if(Input.tilt.everGot){ if(Input.mode!=='tilt') setMode('tilt',true); clearInterval(pick); }
    else if(++tries>=15) clearInterval(pick);   // 3秒待って来なければボタンのまま
    setTiltLabel();
  },200);
}

el.startBtn.addEventListener('click',()=>{
  armAudio(); Snd.ui();
  // 開始前に確定させる。ただしセンサーが生きていれば必ず傾けを使う
  if(Input.mode==='tilt'){
    Input.useSwipe = !(Input.tilt.everGot && performance.now()-Input.tilt.lastEvt<2000);
    if(Input.useSwipe && !Input.tilt.listening) Input.requestTilt();   // 許可がまだなら促す
  }
  el.pourBtn.style.display=Input.mode==='button'?'':'none';
  el.tiltGuide.hidden=Input.mode!=='tilt';
  el.tiltMsg.textContent=Input.useSwipe
    ? '画面を左右にドラッグ → 遠いほど強く注ぐ'
    : 'スマホの上端を前へ倒して注ぐ';
  startLevel(G.selLevel,false);
});
el.nextBtn.addEventListener('click',()=>{ Snd.ui(); G.selLevel=Math.min(G.lvl.lv+1,18); startLevel(G.lvl.lv+1,false); });
el.retryBtn.addEventListener('click',()=>{ Snd.ui(); startLevel(G.lvl.lv,true); });
el.toHome.addEventListener('click',()=>{
  Snd.ui(); el.result.classList.remove('on'); show('home'); setPhase('home');
  // 最初に選ばれているのは常にLEVEL 1。続きの番号を出すと、はじめて開いた人が
  // いきなり社長(LV9)から始めることになる。続きは番号を選び直せばよい
  G.selLevel=1;
  updateHome();
});

const DEBUG=/[?&]debug=1/.test(location.search);
if(DEBUG) el.debug.classList.add('on');
const mLv=location.search.match(/[?&]level=(\d+)/);
if(mLv) G.selLevel=clamp(+mLv[1],1,18);
else G.selLevel=1;

updateHome();
requestAnimationFrame(()=>{ resize(); });
new ResizeObserver(resize).observe(el.cv);
window.MI={G,Input,CFG,Save,judge,score,LEVELS,startLevel,FOAM_ORDERS,CHAR_ART,buildChara,CHARS};
</script>
<!-- /APP -->
</body>
</html>
