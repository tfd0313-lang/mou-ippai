<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>もう一杯！</title>
</head>
<body>
<!-- APP -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* 『もう一杯！』プロトタイプv0.3 — SPEC v1.3 + 対戦相手・レベル・背景仕様書v1.1
   実装範囲: 通常編LEVEL 1〜9(ママ/パパ/上司)、別紙仕様書P0 */
:root{
  --ink:#17120E; --wood:#31251A; --wood-hi:#41321F;
  --amber:#E8A13C; --amber-deep:#B97416;
  --cream:#F6EEDC; --mut:#9C8B74; --red:#C9503C;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--ink); color:var(--cream);
  font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN",sans-serif;
  overflow:hidden; touch-action:none; user-select:none;-webkit-user-select:none;
}
#stage{
  position:fixed;inset:0;margin:auto;
  width:min(100vw,calc(100dvh * .54)); height:100dvh;
  background:var(--ink);
  display:flex;flex-direction:column;
  box-shadow:0 0 0 1px #000;
  overflow:hidden;
}
.screen{position:absolute;inset:0;display:none;flex-direction:column}
.screen.on{display:flex}

/* ---------- ホーム ---------- */
#home{align-items:center;justify-content:flex-start;gap:12px;
  padding:calc(env(safe-area-inset-top,0px) + 16px) 22px calc(env(safe-area-inset-bottom,0px) + 24px);
  text-align:center;overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:
    radial-gradient(46% 20% at 16% 4%, rgba(232,161,60,.16), transparent 70%),
    radial-gradient(46% 20% at 84% 3%, rgba(232,161,60,.11), transparent 70%),
    var(--ink);
}
#heroMug{width:min(34%,140px);flex:0 0 auto;display:block;filter:drop-shadow(0 14px 24px rgba(0,0,0,.55))}
#heroMug .bub{animation:rise 2.6s linear infinite;opacity:0}
#heroMug .bub.b2{animation-delay:.9s}
#heroMug .bub.b3{animation-delay:1.7s}
@keyframes rise{0%{transform:translateY(0);opacity:0}12%{opacity:.85}100%{transform:translateY(-58px);opacity:0}}
#heroMug .steam{animation:foamPuff 3.2s ease-in-out infinite}
@keyframes foamPuff{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
#home h1{
  font-family:"Shippori Mincho B1",serif;font-weight:800;
  font-size:clamp(32px,9.5vw,46px);letter-spacing:.06em;line-height:1.1;text-wrap:balance;
}
#home h1 em{font-style:normal;color:var(--amber)}
#home .sub{color:var(--mut);font-size:13px;letter-spacing:.14em}
.seg{display:flex;border:1px solid var(--wood-hi);border-radius:999px;overflow:hidden;background:var(--wood)}
.seg button{appearance:none;border:0;background:transparent;color:var(--mut);
  font:inherit;font-size:13px;font-weight:500;padding:10px 16px;cursor:pointer}
.seg button.on{background:var(--amber);color:#221503;font-weight:700}
#modeHint{color:var(--mut);font-size:11px;line-height:1.6;max-width:300px;opacity:.85}
#voiceBtn{appearance:none;cursor:pointer;font:inherit;font-size:12px;letter-spacing:.08em;
  color:var(--mut);background:var(--wood);border:1px solid var(--wood-hi);border-radius:999px;padding:8px 16px}
#voiceBtn.on{color:#221503;background:var(--amber);border-color:var(--amber);font-weight:700}
#levels{display:flex;flex-direction:column;gap:5px;width:100%;max-width:320px}
.lvrow{display:flex;align-items:center;gap:8px;justify-content:space-between}
.lvname{color:var(--mut);font-size:11px;letter-spacing:.04em;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;flex:1;text-align:left}
.lvbtns{display:flex;gap:5px;flex:0 0 auto}
#levels .lvbtns button{
  appearance:none;cursor:pointer;width:30px;height:30px;border-radius:8px;
  border:1px solid var(--wood-hi);background:var(--wood);color:var(--mut);
  font:inherit;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;
}
#levels .lvbtns button.sel{background:var(--amber);color:#221503;border-color:var(--amber)}
#levels .lvbtns button.clear{border-color:var(--amber-deep);color:var(--amber)}
#levels .lvbtns button:disabled{opacity:.32;cursor:default}
#startBtn{
  appearance:none;border:0;cursor:pointer;
  font-family:"Shippori Mincho B1",serif;font-weight:800;font-size:20px;letter-spacing:.14em;
  color:#221503;background:linear-gradient(180deg,#F1B054,var(--amber-deep));
  padding:16px 44px;border-radius:14px;
  box-shadow:0 6px 0 #7A4A0C,0 10px 24px rgba(0,0,0,.5);
}
#startBtn:active{transform:translateY(4px);box-shadow:0 2px 0 #7A4A0C}
#homeBest{color:var(--mut);font-size:12px;line-height:1.8;font-variant-numeric:tabular-nums}
#homeBest b{color:var(--cream);font-weight:700}
#ver{color:#5d5142;font-size:10px;letter-spacing:.1em;padding-bottom:4px}

/* ---------- ゲーム(背景3種) ---------- */
#game{background:var(--ink)}
#game[data-bg="dining"]{background:
  radial-gradient(60% 26% at 50% 0%, rgba(240,190,110,.22), transparent 70%),
  radial-gradient(42% 17% at 14% 6%, rgba(232,161,60,.13), transparent 70%),
  linear-gradient(180deg,#241A11 0%, #1B140D 60%, #17120E 100%)}
#game[data-bg="living"]{background:
  radial-gradient(50% 30% at 8% 30%, rgba(90,140,200,.16), transparent 70%),
  radial-gradient(50% 22% at 78% 4%, rgba(232,161,60,.15), transparent 70%),
  linear-gradient(180deg,#20180F 0%, #191209 60%, #15100B 100%)}
#game[data-bg="counter"]{background:
  linear-gradient(180deg, rgba(255,170,80,.10) 0 34%, transparent 34%),
  radial-gradient(40% 16% at 26% 2%, rgba(255,180,90,.22), transparent 70%),
  radial-gradient(40% 16% at 74% 2%, rgba(255,180,90,.18), transparent 70%),
  linear-gradient(180deg,#241809 0%, #1A1108 100%)}
#game[data-bg="robata"]{background:
  radial-gradient(26% 12% at 14% 8%, rgba(220,60,40,.34), transparent 70%),
  radial-gradient(26% 12% at 86% 6%, rgba(220,60,40,.26), transparent 70%),
  radial-gradient(50% 20% at 50% 96%, rgba(255,120,30,.22), transparent 70%),
  linear-gradient(180deg,#150F0A 0%, #241509 100%)}
#game[data-bg="oldrobata"]{background:
  radial-gradient(44% 18% at 50% 98%, rgba(255,110,25,.30), transparent 70%),
  repeating-linear-gradient(0deg, rgba(0,0,0,.14) 0 18px, rgba(255,220,170,.02) 18px 20px),
  linear-gradient(180deg,#1B1409 0%, #241A0C 100%)}
#game[data-bg="robata"]::after,#game[data-bg="oldrobata"]::after{
  content:"";position:absolute;left:0;right:0;bottom:0;height:26%;pointer-events:none;
  background:radial-gradient(60% 100% at 50% 100%, rgba(255,130,30,.16), transparent 70%);
  animation:ember 3.4s ease-in-out infinite;
}
@keyframes ember{0%,100%{opacity:.55}50%{opacity:1}}
#game[data-bg="izakaya"]{background:
  repeating-linear-gradient(90deg, rgba(0,0,0,.16) 0 22px, rgba(255,225,170,.03) 22px 24px),
  radial-gradient(45% 18% at 22% 3%, rgba(255,150,60,.20), transparent 70%),
  radial-gradient(45% 18% at 78% 3%, rgba(255,150,60,.16), transparent 70%),
  linear-gradient(180deg,#1E140C 0%, #170F08 100%)}
#game[data-bg="living"]::before{
  content:"";position:absolute;left:0;top:22%;width:32%;height:26%;pointer-events:none;
  background:radial-gradient(closest-side, rgba(120,170,235,.10), transparent);
  animation:tvFlicker 2.8s steps(6) infinite;
}
@keyframes tvFlicker{0%,100%{opacity:.5}30%{opacity:.9}55%{opacity:.65}80%{opacity:1}}

/* レベル差分(別紙3.1): 背景を作り直さず、照明と環境演出を重ねて段階を作る */
#game::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:1;
  transition:opacity .3s;opacity:0}
#game[data-stage="2"]::after{opacity:1;background:rgba(6,4,2,.30)}
#game[data-stage="3"]::after{opacity:1;
  background:radial-gradient(120% 60% at 50% 110%, rgba(255,150,40,.16), transparent 60%),
             rgba(6,4,2,.42)}
/* 3段階目だけ、立ちのぼる湯気・煙 */
#smoke{position:absolute;inset:0;pointer-events:none;z-index:2;display:none;opacity:.5}
#game[data-stage="3"] #smoke{display:block}
#smoke i{position:absolute;bottom:26%;width:70px;height:70px;border-radius:50%;
  background:radial-gradient(circle, rgba(255,240,220,.30), transparent 65%);
  animation:rise2 7s ease-in infinite}
#smoke i:nth-child(1){left:14%;animation-delay:0s}
#smoke i:nth-child(2){left:46%;animation-delay:2.4s}
#smoke i:nth-child(3){left:74%;animation-delay:4.6s}
@keyframes rise2{0%{transform:translateY(0) scale(.6);opacity:0}
                 25%{opacity:.55}
                 100%{transform:translateY(-190px) scale(1.5);opacity:0}}
/* シーンモード: Gemini画像の人物+グラスがそのまま舞台になる */
#game.scene #charaArea{flex:0 0 0;min-height:0}
#game.scene #bubble{top:14px;right:6%}
#game.scene #telemark{top:42%;bottom:auto;right:14%}
#charaArea{flex:0 0 24%;position:relative;display:flex;align-items:flex-end;justify-content:center}
#charaArea.has-photo{flex:0 0 30%}
/* Gemini生成の人物。表情はbackground-imageの差し替えで切り替える */
.photo-chara{
  position:absolute;left:0;right:0;top:0;bottom:-10%;display:none;
  background-size:auto 100%;background-position:center top;background-repeat:no-repeat;
  -webkit-mask-image:linear-gradient(180deg,#000 0 68%,transparent 100%);
          mask-image:linear-gradient(180deg,#000 0 68%,transparent 100%);
}
.photo-chara.on{display:block}
/* 演出動作: 胴体だけ揺らす。グラス当たり判定は動かさない(SPEC 10.5 DecorativeRoot) */
.chara.decor-sway{animation:decorSway var(--sway-dur,2.6s) ease-in-out infinite alternate}
@keyframes decorSway{from{transform:translateX(calc(var(--sway-amp,10px) * -1)) rotate(-1deg)}
                     to{transform:translateX(var(--sway-amp,10px)) rotate(1deg)}}
.chara{width:min(72%,300px);height:100%;display:none}
.chara.on{display:block}
.chara.tele,.photo-chara.tele{animation:lean .5s ease-in-out infinite alternate}
@keyframes lean{from{transform:translateX(0)}to{transform:translateX(4px)}}
#bubble{
  position:absolute;top:6%;right:3%;max-width:58%;
  background:var(--cream);color:#221503;
  font-weight:700;font-size:clamp(14px,4.2vw,18px);letter-spacing:.03em;line-height:1.4;
  padding:9px 14px;border-radius:15px;border-bottom-left-radius:2px;
  opacity:0;transform:translateY(6px) scale(.92);transform-origin:left bottom;
  transition:opacity .18s ease,transform .18s ease;z-index:3;
}
#bubble.on{opacity:1;transform:none}
#telemark{
  position:absolute;bottom:4%;right:16%;z-index:3;
  font-family:"Shippori Mincho B1",serif;font-weight:800;font-size:30px;color:var(--red);
  text-shadow:0 0 10px rgba(201,80,60,.5);
  opacity:0;transform:scale(.6);transition:opacity .12s,transform .12s;
}
#telemark.on{opacity:1;transform:scale(1)}
/* 泡メーターはグラスの縁に重ならないよう、舞台の外(操作エリア)に置く */
#foamChip{
  flex:0 0 auto;
  display:flex;align-items:center;gap:8px;opacity:0;transition:opacity .18s;
  background:rgba(13,9,5,.82);border:1px solid var(--wood-hi);border-radius:999px;
  padding:6px 14px;font-size:12px;letter-spacing:.08em;color:var(--mut);white-space:nowrap;
}
#foamChip.on{opacity:1}
/* 注ぎを止めている間の「まだ注ぎ足せる」表示 */
#waitBar{
  position:absolute;left:50%;transform:translateX(-50%);
  bottom:calc(26% + 8px);z-index:5;opacity:0;transition:opacity .15s;
  background:rgba(13,9,5,.86);border:1px solid var(--wood-hi);border-radius:999px;
  padding:7px 16px;display:flex;align-items:center;gap:9px;white-space:nowrap;
}
#waitBar.on{opacity:1}
#waitBar span{font-size:12px;letter-spacing:.06em;color:var(--cream)}
#waitBar .track{width:74px;height:5px;border-radius:99px;background:var(--wood);overflow:hidden}
#waitBar .track i{display:block;height:100%;width:100%;background:var(--amber);
  transform-origin:left;transition:transform .06s linear}
#foamChip b{font-weight:700;font-size:13px}
#foamChip.good b{color:var(--amber)}
#foamChip.bad b{color:var(--red)}
#foamBar{width:64px;height:6px;border-radius:99px;background:var(--wood);position:relative;overflow:hidden}
#foamBar .zone{position:absolute;top:0;bottom:0;background:rgba(232,161,60,.34)}
#foamBar i{position:absolute;top:-2px;width:3px;height:10px;border-radius:2px;background:var(--cream)}
#hud{
  position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:12px;z-index:3;
  color:var(--mut);font-size:12px;letter-spacing:.08em;font-variant-numeric:tabular-nums;
}
#hud b{color:var(--amber);font-weight:700}
#cv{flex:1 1 auto;min-height:0;width:100%;display:block}
#controls{flex:0 0 23%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:8px;padding:8px 18px calc(env(safe-area-inset-bottom,0px) + 14px)}
#pourBtn{
  appearance:none;border:0;cursor:pointer;touch-action:none;
  width:100%;max-width:340px;flex:1 1 auto;max-height:106px;min-height:70px;border-radius:18px;
  font-family:"Shippori Mincho B1",serif;font-weight:800;font-size:25px;letter-spacing:.45em;text-indent:.45em;
  color:#221503;background:linear-gradient(180deg,#F1B054,var(--amber-deep));
  box-shadow:0 7px 0 #7A4A0C,0 12px 26px rgba(0,0,0,.5);
}
#pourBtn:active,#pourBtn.down{transform:translateY(5px);box-shadow:0 2px 0 #7A4A0C}
#pourBtn:disabled{filter:grayscale(.7) brightness(.6);transform:none;box-shadow:0 7px 0 #4a3c26}
#tiltGuide{width:100%;max-width:340px;text-align:center;color:var(--mut);
  font-size:13px;letter-spacing:.08em;line-height:1.7}
#tiltGuide .bar{height:8px;border-radius:99px;background:var(--wood);margin-top:9px;overflow:hidden}
#tiltGuide .bar i{display:block;height:100%;width:0%;background:var(--amber)}

/* 表情切替(全キャラ共通) */
.chara [data-f]{display:none}
.chara[data-face="neutral"] [data-f="neutral"],
.chara[data-face="call"]    [data-f="call"],
.chara[data-face="watch"]   [data-f="watch"],
.chara[data-face="tele"]    [data-f="tele"],
.chara[data-face="happy"]   [data-f="happy"],
.chara[data-face="meh"]     [data-f="meh"],
.chara[data-face="shock"]   [data-f="shock"],
.chara[data-face="angry"]   [data-f="angry"],
.chara[data-face="drunk"]   [data-f="drunk"],
.chara[data-face="low"]     [data-f="low"]{display:inline}

/* ---------- レベル導入 ---------- */
#intro{
  position:absolute;inset:0;z-index:6;display:none;flex-direction:column;
  align-items:center;justify-content:center;gap:8px;
  background:rgba(13,9,5,.86);text-align:center;
}
#intro.on{display:flex}
#introLv{color:var(--amber);font-size:14px;letter-spacing:.4em;text-indent:.4em;font-variant-numeric:tabular-nums}
#introName{font-family:"Shippori Mincho B1",serif;font-weight:800;font-size:40px;letter-spacing:.1em}
#introPlace{color:var(--mut);font-size:14px;letter-spacing:.2em}

/* ---------- 結果 ---------- */
#result{
  position:absolute;inset:0;display:none;flex-direction:column;align-items:center;
  justify-content:flex-end;z-index:5;
  background:linear-gradient(180deg,transparent 0%,rgba(10,7,4,.55) 30%,rgba(10,7,4,.93) 62%);
  padding:0 24px calc(env(safe-area-inset-bottom,0px) + 18px);
}
#result.on{display:flex}
#clearTag{color:var(--amber);font-size:13px;letter-spacing:.34em;text-indent:.34em;
  margin-bottom:6px;font-variant-numeric:tabular-nums;display:none}
#clearTag.on{display:block}
#verdict{
  font-family:"Shippori Mincho B1",serif;font-weight:800;
  font-size:clamp(38px,11vw,54px);letter-spacing:.08em;text-align:center;text-wrap:balance;
  animation:stamp .28s cubic-bezier(.2,1.6,.4,1) both;
}
@keyframes stamp{from{opacity:0;transform:scale(1.7) rotate(-4deg)}to{opacity:1;transform:none}}
#verdict.bad{color:var(--red)} #verdict.top{color:var(--amber)}
#resMeta{margin-top:8px;color:var(--mut);font-size:14px;letter-spacing:.06em;text-align:center;
  line-height:1.8;font-variant-numeric:tabular-nums}
#resMeta b{color:var(--cream)}
#resScore{margin-top:4px;font-variant-numeric:tabular-nums;font-size:14px;color:var(--mut);text-align:center}
#resScore b{font-size:28px;color:var(--cream);font-family:"Shippori Mincho B1",serif}
#newBest{color:var(--amber);font-size:12px;letter-spacing:.2em;margin-top:2px;display:none}
#newBest.on{display:block}
#nextBtn,#retryBtn{
  appearance:none;border:0;cursor:pointer;margin-top:16px;
  width:100%;max-width:340px;padding:16px 0;border-radius:16px;
  font-family:"Shippori Mincho B1",serif;font-weight:800;font-size:22px;letter-spacing:.24em;text-indent:.24em;
  color:#221503;background:linear-gradient(180deg,#F1B054,var(--amber-deep));
  box-shadow:0 6px 0 #7A4A0C,0 10px 24px rgba(0,0,0,.5);
}
#nextBtn:active,#retryBtn:active{transform:translateY(4px);box-shadow:0 2px 0 #7A4A0C}
#retryBtn.sub{
  margin-top:12px;padding:11px 0;font-size:16px;color:var(--cream);
  background:var(--wood);box-shadow:none;border:1px solid var(--wood-hi);
}
#toHome{appearance:none;border:0;background:transparent;cursor:pointer;margin-top:12px;
  color:var(--mut);font:inherit;font-size:12px;letter-spacing:.2em;
  text-decoration:underline;text-underline-offset:4px}

#debug{position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);right:8px;display:none;
  background:rgba(0,0,0,.62);border:1px solid var(--wood-hi);border-radius:8px;
  padding:8px 10px;font-size:11px;line-height:1.7;color:#b9e0a2;
  font-family:ui-monospace,monospace;white-space:pre;z-index:9}
#debug.on{display:block}
#notice{position:absolute;left:50%;top:32%;transform:translateX(-50%);
  background:rgba(10,7,4,.92);border:1px solid var(--wood-hi);color:var(--cream);
  font-size:13px;letter-spacing:.04em;padding:10px 16px;border-radius:10px;line-height:1.6;
  opacity:0;pointer-events:none;transition:opacity .2s;max-width:86%;text-align:center;z-index:8}
#notice.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001s!important;transition-duration:.001s!important}}
</style>

<div id="stage">
  <!-- ホーム -->
  <div id="home" class="screen on">
    <svg id="heroMug" viewBox="0 0 220 240" aria-hidden="true">
      <g transform="translate(168,28) rotate(-128)">
        <rect x="-13" y="-46" width="26" height="58" rx="8" fill="#7A4A1E"/>
        <rect x="-6" y="-70" width="12" height="26" rx="5" fill="#5E3714"/>
        <rect x="-13" y="-30" width="26" height="20" fill="#E8DCC8" opacity=".85"/>
      </g>
      <path d="M143 34 q3 30 -13 52 q-8 12 -9 22 l10 0 q4 -12 12 -22 q14 -20 12 -52 Z" fill="#F0A93C" opacity=".92"/>
      <g>
        <path d="M158 96 q34 4 34 34 q0 30 -34 34 l0 -12 q22 -4 22 -22 q0 -18 -22 -22 Z" fill="rgba(214,228,238,.5)"/>
        <rect x="62" y="86" width="96" height="118" rx="10" fill="rgba(210,226,238,.13)"/>
        <rect x="70" y="118" width="80" height="80" rx="6" fill="#C8821D"/>
        <rect x="70" y="118" width="80" height="42" rx="6" fill="#E89E2F"/>
        <g class="steam">
          <ellipse cx="86" cy="112" rx="18" ry="12" fill="#F6EEDC"/>
          <ellipse cx="112" cy="107" rx="22" ry="14" fill="#F6EEDC"/>
          <ellipse cx="138" cy="112" rx="16" ry="11" fill="#F6EEDC"/>
          <ellipse cx="64" cy="119" rx="9" ry="7" fill="#F6EEDC"/>
        </g>
        <circle class="bub" cx="88" cy="192" r="3.4" fill="#FBE7B8"/>
        <circle class="bub b2" cx="112" cy="196" r="2.6" fill="#FBE7B8"/>
        <circle class="bub b3" cx="132" cy="190" r="3" fill="#FBE7B8"/>
        <rect x="66" y="92" width="7" height="106" rx="3.5" fill="rgba(246,238,220,.35)"/>
        <rect x="62" y="86" width="96" height="118" rx="10" fill="none" stroke="rgba(226,238,246,.6)" stroke-width="3"/>
      </g>
    </svg>
    <h1>もう<em>一杯</em>！</h1>
    <div class="sub">傾けて注ぐ、ギリギリゲーム</div>
    <div class="seg" role="group" aria-label="操作方式">
      <button id="modeBtnBtn" class="on">ボタンで注ぐ</button>
      <button id="modeTiltBtn">傾け／スワイプ</button>

</svg>`;
}

/* ---------- 音: 気泡共鳴モデルによる液体音合成 ----------
   液体音の主成分は無数の気泡の減衰チャープ(van den Doel の物理モデル)。
   気泡層 + 低域ゴボゴボ + 高域シュワ + 水位で上がる容器共鳴の4層。 */
const Snd = {
  ctx:null, master:null,
  gStream:null, fStream:null,      // ストリームの乱流
  gCav:null, fCav:null,            // 容器の共鳴(水位で上がる)
  _glugAt:0, _crackAt:0, _bubAt:0,
  init(){
    if(this.ctx) return;
    try{
      const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
      this.ctx=new AC();
      this.master=this.ctx.createGain(); this.master.gain.value=1;
      this.master.connect(this.ctx.destination);
      this.noiseBuf=(()=>{
        const len=this.ctx.sampleRate*2;
        const b=this.ctx.createBuffer(1,len,this.ctx.sampleRate);
        const ch=b.getChannelData(0);
        for(let i=0;i<len;i++) ch[i]=Math.random()*2-1;
        return b;
      })();
      const loopNoise=()=>{
        const s=this.ctx.createBufferSource(); s.buffer=this.noiseBuf; s.loop=true; s.start(); return s;
      };
      // 落下するビールが液面を叩く乱流ノイズ
      this.fStream=this.ctx.createBiquadFilter();
      this.fStream.type='bandpass'; this.fStream.frequency.value=1400; this.fStream.Q.value=0.5;
      this.gStream=this.ctx.createGain(); this.gStream.gain.value=0;
      loopNoise().connect(this.fStream).connect(this.gStream).connect(this.master);
      // グラス内の空気柱共鳴。液面が上がるほど高くなる=満杯が耳で分かる
      this.fCav=this.ctx.createBiquadFilter();
      this.fCav.type='bandpass'; this.fCav.frequency.value=200; this.fCav.Q.value=7;
      this.gCav=this.ctx.createGain(); this.gCav.gain.value=0;
      loopNoise().connect(this.fCav).connect(this.gCav).connect(this.master);
    }catch(e){}
  },
  resume(){ if(this.ctx&&this.ctx.state==='suspended') this.ctx.resume(); },

  /* 瓶口から空気が入る「ゴボッ」。連続ノイズではなく離散パルスで鳴らす */
  glug(nf){
    const t=this.ctx.currentTime;
    const dur=0.13+Math.random()*0.07;
    const f0=90+Math.random()*45+nf*30;
    const o=this.ctx.createOscillator(), g=this.ctx.createGain();
    o.type='sine';
    o.frequency.setValueAtTime(f0*1.5,t);
    o.frequency.exponentialRampToValueAtTime(f0,t+dur*0.8);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.16+nf*0.10,t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0008,t+dur);
    o.connect(g).connect(this.master); o.start(t); o.stop(t+dur+0.03);
    // ゴボッに混ざる短い破裂ノイズ
    const s=this.ctx.createBufferSource(); s.buffer=this.noiseBuf;
    s.playbackRate.value=0.6+Math.random()*0.5;
    const bf=this.ctx.createBiquadFilter(); bf.type='bandpass'; bf.frequency.value=420; bf.Q.value=1.4;
    const bg=this.ctx.createGain();
    bg.gain.setValueAtTime(0.10,t); bg.gain.exponentialRampToValueAtTime(0.0006,t+0.09);
    s.connect(bf).connect(bg).connect(this.master); s.start(t); s.stop(t+0.12);
  },
  /* 泡の炭酸がはじける音。ビールらしさの決め手。泡量に比例して鳴らす */
  crackle(amount){
    const t=this.ctx.currentTime+Math.random()*0.03;
    const dur=0.006+Math.random()*0.014;
    const s=this.ctx.createBufferSource(); s.buffer=this.noiseBuf;
    s.playbackRate.value=1.4+Math.random()*1.4;
    const f=this.ctx.createBiquadFilter();
    f.type='bandpass'; f.frequency.value=3600+Math.random()*5200; f.Q.value=3+Math.random()*4;
    const g=this.ctx.createGain();
    g.gain.setValueAtTime((0.05+Math.random()*0.10)*amount,t);
    g.gain.exponentialRampToValueAtTime(0.0004,t+dur);
    s.connect(f).connect(g).connect(this.master); s.start(t); s.stop(t+dur+0.02);
  },
  /* 液中を上る気泡: 音程が上がりながら消えるチャープ(液体音の物理モデル) */
  bubble(fill){
    const t=this.ctx.currentTime+Math.random()*0.02;
    const dur=0.025+Math.random()*0.05;
    const f0=(500+Math.random()*Math.random()*2000)*(1+fill*0.3);
    const o=this.ctx.createOscillator(), g=this.ctx.createGain();
    o.type='sine';
    o.frequency.setValueAtTime(f0,t);
    o.frequency.exponentialRampToValueAtTime(f0*1.5,t+dur);
    g.gain.setValueAtTime(0.010+Math.random()*0.022,t);
    g.gain.exponentialRampToValueAtTime(0.0004,t+dur);
    o.connect(g).connect(this.master); o.start(t); o.stop(t+dur+0.02);
  },
  /* 毎フレーム: nf=流量0..1 fill=充填率0..1 foam=泡比率0..1 */
  pour(nf,fill,foam,dt){
    if(!this.ctx) return;
    const t=this.ctx.currentTime;
    this.gStream.gain.setTargetAtTime(nf*0.085,t,0.05);
    this.fStream.frequency.setTargetAtTime(900+nf*1500,t,0.08);
    this.gCav.gain.setTargetAtTime(nf*0.30,t,0.05);
    this.fCav.frequency.setTargetAtTime(170+fill*700,t,0.09);
    if(nf<=0) return;
    // ゴボゴボ: 流量が多いほど間隔が短い
    if(t>this._glugAt){ this.glug(nf); this._glugAt=t+(0.30-nf*0.16)*(0.75+Math.random()*0.5); }
    // 炭酸のはじけ: 泡が多いほど密に
    const crackRate=40+foam*260+nf*60;
    this._crackAt+=dt*crackRate;
    let nc=Math.min(Math.floor(this._crackAt),6); this._crackAt-=nc;
    for(let i=0;i<nc;i++) this.crackle(0.5+foam*0.9);
    // 気泡
    this._bubAt+=dt*(12+nf*40);
    let nb=Math.min(Math.floor(this._bubAt),3); this._bubAt-=nb;
    for(let i=0;i<nb;i++) this.bubble(fill);
  },
  /* 注ぎを止めた後も泡がはじけ続ける余韻 */
  settleFizz(foam,dt){
    if(!this.ctx) return;
    const t=this.ctx.currentTime;
    this.gStream.gain.setTargetAtTime(0,t,0.06);
    this.gCav.gain.setTargetAtTime(0,t,0.08);
    this._crackAt+=dt*(30+foam*150);
    let nc=Math.min(Math.floor(this._crackAt),4); this._crackAt-=nc;
    for(let i=0;i<nc;i++) this.crackle(0.35+foam*0.6);
  },
  silence(){ if(!this.ctx) return;
    const t=this.ctx.currentTime;
    this.gStream.gain.setTargetAtTime(0,t,0.05);
    this.gCav.gain.setTargetAtTime(0,t,0.05);
  },
  blip(f,dur=0.09,type='square',vol=0.12,when=0){ if(!this.ctx) return;
    const t=this.ctx.currentTime+when;
    const o=this.ctx.createOscillator(),g=this.ctx.createGain();
    o.type=type;o.frequency.value=f;g.gain.setValueAtTime(vol,t);
    g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(g).connect(this.master);o.start(t);o.stop(t+dur+0.02);
  },
  call(){ this.blip(620,0.1,'square',0.1); this.blip(830,0.14,'square',0.1,0.11); },
  tele(){ this.blip(1500,0.06,'sine',0.09); this.blip(1500,0.06,'sine',0.07,0.12); },
  tick(){ this.blip(1250,0.05,'sine',0.07); },
  perfect(){ [660,830,990].forEach((f,i)=>this.blip(f,0.16,'sine',0.12,i*0.09)); },
  thud(){ if(!this.ctx) return;
    const t=this.ctx.currentTime;
    const s=this.ctx.createBufferSource(); s.buffer=this.noiseBuf; s.playbackRate.value=0.5;
    const f=this.ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=460;
    const g=this.ctx.createGain();
    g.gain.setValueAtTime(0.4,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.35);
    s.connect(f).connect(g).connect(this.master); s.start(t); s.stop(t+0.4);
  },
  ui(){ this.blip(980,0.05,'sine',0.06); },
};

/* ---------- 音声(端末TTS。日本語voiceを品質順に選択) ---------- */
const Voice = {
  male:null, female:null, any:null,
  /* 端末の日本語音声を性別で振り分ける。名前で判定できない場合はピッチで補う */
  pick(){
    try{
      const vs=speechSynthesis.getVoices().filter(v=>/^ja/i.test(v.lang));
      if(!vs.length) return;
      const F=/kyoko|o-?ren|haruka|ayumi|sayaka|nanami|mizuki|female|女性|女/i;
      const M=/otoya|ichiro|hattori|daichi|keita|male|男性|男/i;
      const quality=v=>{
        let s=0;
        if(/premium|enhanced|neural|拡張|高品質/i.test(v.name)) s+=30;
        if(/google/i.test(v.name)) s+=20;
        if(v.localService) s+=5;
        return s;
      };
      const sorted=[...vs].sort((a,b)=>quality(b)-quality(a));
      this.female=sorted.find(v=>F.test(v.name))||null;
      this.male  =sorted.find(v=>M.test(v.name))||null;
      this.any   =sorted[0]||null;
      // 片方しか無い端末では残りをanyで埋める
      if(!this.female) this.female=this.any;
      if(!this.male)   this.male=this.any;
    }catch(e){}
  },
  speak(text,ch){
    if(!Save.data.voice) return;
    try{
      if(!('speechSynthesis' in window)) return;
      if(!this.any) this.pick();
      const c=ch||CHARS.papa;
      const v=(c.gender==='f')?this.female:this.male;
      const u=new SpeechSynthesisUtterance(text.replace(/…/g,''));
      u.lang='ja-JP'; if(v) u.voice=v;
      // 選ばれた声が希望の性別でない場合はピッチを大きくずらして寄せる
      const nameF=/kyoko|o-?ren|haruka|ayumi|sayaka|nanami|mizuki|female|女/i;
      const gotF=v?nameF.test(v.name):false;
      let pitch=c.pitch;
      if(c.gender==='f'&&!gotF) pitch=Math.min(2.0,c.pitch+0.55);   // 男声しかない→高く
      if(c.gender==='m'&&gotF)  pitch=Math.max(0.1,c.pitch-0.35);   // 女声しかない→低く
      u.pitch=pitch; u.rate=c.rate; u.volume=1;
      speechSynthesis.cancel(); speechSynthesis.speak(u);
    }catch(e){}
  },
};
try{ speechSynthesis.onvoiceschanged=()=>Voice.pick(); }catch(e){}

/* ---------- シミュレーション §7 ---------- */
function newSim(cap){
  return {C:cap, L:0,P:0,W:0,Q:0,target:0, poured:false, zeroT:0, ovf:0, out:null,
          prevF:0, cue95:false, fHist:[]};
}
/* env: {Qmax, foamMult, intake} intake=ストリーム取り込み率(攻略動作で低下) */
function simStep(s,dt,env){
  if(s.target>s.Q){ s.Q=Math.min(s.target, s.Q+(env.Qmax/CFG.RAMP)*dt); }
  else { s.Q=s.target; }
  if(s.Q>0){ s.poured=true; s.zeroT=0; }
  else if(s.poured){ s.zeroT+=dt; }

  if(s.Q>0 && !s.out){
    const dV=s.Q*dt;
    const dIn=dV*env.intake, dMiss=dV-dIn;
    const nf=clamp(s.Q/env.Qmax,0,1);
    const foamRate=clamp(lerp(CFG.FOAM_LO,CFG.FOAM_HI,Math.pow(nf,CFG.FOAM_EXP))*env.foamMult,0,0.6);
    s.L+=dIn*(1-foamRate);
    s.P+=dIn*foamRate*CFG.FOAM_EXPANSION;
    s.W+=dMiss;                                   // 外したぶんはこぼれ §7.4
  }
  const dec=s.P*CFG.FOAM_DECAY*dt;
  s.P-=dec; s.L+=dec*CFG.FOAM_RETURN;

  const tot=s.L+s.P;
  if(tot>s.C && !s.out){
    let ex=tot-s.C;
    const fromP=Math.min(ex,s.P); s.P-=fromP; s.L-=(ex-fromP);
    s.ovf+=ex; s.W+=ex;
    if(s.ovf>CFG.OVF_GRACE*s.C) s.out='OVERFLOW';
  }
  if(!s.out && s.W>=CFG.SPILL_OUT*s.C) s.out='SPILL';

  const F=(s.L+s.P)/s.C;
  s.fHist.push(F); if(s.fHist.length>19) s.fHist.shift();   // 直近0.15秒 §10.5
  if(!s.cue95 && s.prevF<0.95 && F>=0.95){ s.cue95=true; Snd.tick(); vibe(15); }
  s.prevF=F;
}
function effFillRate(s){
  if(s.fHist.length<2) return 0;
  return (s.fHist[s.fHist.length-1]-s.fHist[0])/((s.fHist.length-1)*CFG.TICK);
}
/* ---------- 判定 §8.1 ---------- */
function judge(s,order){
  const o=FOAM_ORDERS[order||'normal'];
  const F=(s.L+s.P)/s.C, R=s.P/Math.max(s.L+s.P,1e-9), Wr=s.W/s.C;
  let v;
  if(s.out==='OVERFLOW') v='OVERFLOW';
  else if(s.out==='SPILL'||Wr>=CFG.SPILL_OUT) v='SPILL';
  else if(F<CFG.MIN_F) v='LOW';
  else if(F>=CFG.PERFECT_F && Wr<CFG.PERFECT_W && R>=o.ideal[0] && R<=o.ideal[1]) v='PERFECT';
  else if(F>=CFG.GREAT_F && R>=o.accept[0] && R<=o.accept[1]) v='GREAT';
  else v='SAFE';
  return {v,F,R,Wr,score:score(v,F,R,Wr,o)};
}
function score(v,F,R,Wr,o){
  if(v==='OVERFLOW'||v==='SPILL'||v==='LOW') return 0;
  const q=100*clamp((F-CFG.MIN_F)/(CFG.PERFECT_F-CFG.MIN_F),0,1);
  let f;
  const [i0,i1]=o.ideal,[a0,a1]=o.accept;
  if(R>=i0&&R<=i1) f=100;
  else if(R<i0) f=100*clamp((R-a0)/(i0-a0),0,1);
  else f=100*clamp((a1-R)/(a1-i1),0,1);
  const sp=100*clamp(1-Wr/CFG.SPILL_OUT,0,1);
  return Math.round(q*0.75+f*0.20+sp*0.05);
}
function foamLabel(R,order){
  const o=FOAM_ORDERS[order||'normal'];
  return R<o.ideal[0]?'少なめ':R>o.ideal[1]?'多め':'ちょうど';
}
const VERDICT = {
  PERFECT:{word:'PERFECT', cls:'top', face:'happy', lineDelay:0.6, dur:2.3, snd:'perfect', ok:true},
  GREAT:  {word:'いい一杯', cls:'',    face:'happy', lineDelay:0.3, dur:1.6, ok:true},
  SAFE:   {word:'セーフ',   cls:'',    face:'meh',   lineDelay:0.3, dur:1.6, ok:true},
  LOW:    {word:'少なっ。', cls:'bad', face:'low',   lineDelay:0.5, dur:1.9, ok:false},
  SPILL:  {word:'こぼした。',cls:'bad', face:'angry', lineDelay:0.7, dur:2.1, snd:'thud', ok:false},
  OVERFLOW:{word:'OUT',     cls:'bad', face:'shock', lineDelay:0.8, dur:2.3, snd:'thud', ok:false},
};
/* 台詞: 直前と同じものを選ばない §12.1 */
const _lastLine={};
function pickLine(chId,verdict){
  const arr=CHARS[chId].lines[verdict]||[''];
  const key=chId+verdict;
  let idx=Math.floor(Math.random()*arr.length);
  if(arr.length>1 && idx===_lastLine[key]) idx=(idx+1)%arr.length;
  _lastLine[key]=idx;
  return arr[idx];
}

/* ---------- 入力 §5 (センサー不可時はスワイプで傾け) ---------- */
const Input = {
  mode:'button', enabled:false, btnHeld:false, holdT:0,
  tilt:{ang:0,base:null,baseBuf:[],dir:0,pouring:false,lastEvt:0,listening:false,everGot:false},
  swipe:{active:false,startX:0,ang:0},
  useSwipe:false,
  flow(Qmax){
    if(!this.enabled) return 0;
    if(this.mode==='button'){
      if(!this.btnHeld) return 0;
      // 押し続けるほど流量が上がる。刻んで押せば弱く、押しっぱなしで強く注げる。
      // これがボタン操作での泡コントロール手段になる(§5.3)
      const x=smoothstep(this.holdT/CFG.HOLD_RAMP);
      return Qmax*lerp(CFG.FLOW_MIN,1,x);
    }
    let a;
    if(this.useSwipe){ a=Math.abs(this.swipe.ang); }
    else {
      const t=this.tilt;
      if(t.base===null) return 0;
      const d=t.ang-t.base;
      if(t.dir===0){ if(Math.abs(d)>CFG.TILT.DIR) t.dir=Math.sign(d); }
      else if(d*t.dir < -CFG.TILT.DIR && !t.pouring) t.dir=Math.sign(d);
      if(t.dir===0) return 0;
      a=d*t.dir;
    }
    const st=this.mode==='tilt'?this.tilt:null;
    if(st){
      if(st.pouring){ if(a<CFG.TILT.STOP) st.pouring=false; }
      else { if(a>=CFG.TILT.START) st.pouring=true; }
      if(!st.pouring) return 0;
    }
    const x=clamp((a-CFG.TILT.START)/(CFG.TILT.MAX-CFG.TILT.START),0,1);
    return Qmax*smoothstep(x);
  },
  resetRound(){
    this.btnHeld=false; this.holdT=0;
    const t=this.tilt; t.base=null; t.baseBuf=[]; t.dir=0; t.pouring=false;
    this.swipe.active=false; this.swipe.ang=0;
    // センサーが後から生きた場合は毎ラウンド傾けへ戻す。
    // 以前は useSwipe が立ちっぱなしで、再読み込みするまで傾けが復活しなかった
    if(this.mode==='tilt' && t.everGot && performance.now()-t.lastEvt<2000) this.useSwipe=false;
  },
  startTiltListener(){
    const t=this.tilt;
    if(t.listening) return;
    window.addEventListener('deviceorientation',e=>{
      if(e.gamma==null) return;
      t.lastEvt=performance.now();
      // 初回は実測値をそのまま入れる。0から寄せると基準を取る間に
      // 収束途中の値が混ざり、注ぐ向きが逆に固定されることがあった
      if(!t.everGot){ t.ang=e.gamma; t.everGot=true; }
      else t.ang += (e.gamma-t.ang)*0.28;
    });
    t.listening=true;
  },
  async requestTilt(){
    try{
      if(typeof DeviceOrientationEvent!=='undefined' &&
         typeof DeviceOrientationEvent.requestPermission==='function'){
        const r=await DeviceOrientationEvent.requestPermission();
        if(r!=='granted') return false;
      }
      this.startTiltListener();
      return true;
    }catch(e){ return false; }
  },
};

/* 攻略動作の更新 §10.5 / 別紙§6 */
/* 安全なグラス揺れ: 見た目と当たり判定を一緒に動かすが、ストリームは常に開口内
   (取り込み率100%を保つ) */
function safeSwayOffset(now){
  const sw=G.lvl.sway;
  if(!sw) return {x:0,rot:0};
  const sc=CW/390, t=now/1000;
  return {
    x: Math.sin(t*Math.PI*2/sw.period)*sw.amp*sc,
    rot: sw.rot ? Math.sin(t*Math.PI*2/(sw.period*1.3))*sw.rot : 0,
  };
}
/* 偽予兆: 予兆マークも出さず、当たり判定も動かさない。肩の動きだけで惑わせる */
function fakeUpdate(dt){
  const fk=G.fake, s=G.sim;
  if(!fk||fk.state==='done') return;
  const F=(s.L+s.P)/s.C;
  if(fk.state==='idle'){
    if(s.Q>0 && F>=fk.at){ fk.state='play'; fk.t=0; setFace('tele'); Snd.blip(900,0.05,'sine',0.05); }
    return;
  }
  fk.t+=dt;
  if(fk.t>=fk.dur){ fk.state='done'; if(G.hz&&G.hz.state==='idle') setFace('watch'); }
}
function hazardUpdate(dt){
  const hz=G.hz, s=G.sim;
  if(!hz||hz.state==='done'||hz.state==='cancelled') { G.curIntake=1; return; }
  const F=(s.L+s.P)/s.C;
  hz.t+=dt;
  switch(hz.state){
    case 'idle':{
      G.curIntake=1;
      if(s.Q<=0) break;                                    // StopGrace中は開始しない
      const pred=F+effFillRate(s)*CFG.RESPONSE_BUDGET;
      const overMax = hz.cfg.maxTrig!=null && F>hz.cfg.maxTrig;  // 例:酔っ払いは90%超で新規開始しない
      const wantStart = overMax ? false : (hz.cfg.safe
        ? F>=hz.trigF                                       // 安全動作は目標充填率のみ
        : (F>=hz.trigF || pred>=CFG.PERFECT_F) && F>=CFG.MIN_F); // 下限クランプ §10.5
      if(wantStart){
        hz.state='tel'; hz.t=0;
        if(hz.cfg.safe){
          (curPhoto?photoEl:curChara).classList.add('tele');          // 体は動くが危険ではない=印は出さない
        } else {
          el.telemark.classList.add('on');
          (curPhoto?photoEl:curChara).classList.add('tele');
          setFace('tele'); Snd.tele();
        }
      }
      break;
    }
    case 'tel':{
      G.curIntake=1;                                        // 予兆中は判定を動かさない
      if(s.Q<=0 && !hz.cfg.safe){                           // 予兆中に止めた→キャンセル
        hz.state='cancelled';
        el.telemark.classList.remove('on');
        (curPhoto?photoEl:curChara).classList.remove('tele');
        setFace('watch');
        break;
      }
      if(hz.t>=hz.cfg.tel){
        hz.state='hazard'; hz.t=0;
        el.telemark.classList.remove('on');
        (curPhoto?photoEl:curChara).classList.remove('tele');
        if(!hz.cfg.safe) setFace('watch');
      }
      break;
    }
    case 'hazard':{
      const MOVE=0.35, HOLD=0.45, BACK=0.30;
      let frac;
      if(hz.t<MOVE) frac=smoothstep(hz.t/MOVE);
      else if(hz.t<MOVE+HOLD) frac=1;
      else if(hz.t<MOVE+HOLD+BACK) frac=1-smoothstep((hz.t-MOVE-HOLD)/BACK);
      else { frac=0; hz.state='done'; setFace('watch'); }
      const m=hz.cfg.mag*frac, sc=CW/390;
      G.glassOff={x:0,y:0,rot:0};
      if(hz.cfg.type==='shift') G.glassOff.x=m*sc;
      else if(hz.cfg.type==='lower') G.glassOff.y=m*sc;
      else if(hz.cfg.type==='rotate') G.glassOff.rot=m;
      else if(hz.cfg.type==='shiftrot'){ G.glassOff.x=m*sc; G.glassOff.rot=(hz.cfg.rot||0)*frac; }
      G.curIntake=lerp(1,hz.cfg.intake,frac);
      break;
    }
    default: G.curIntake=1;
  }
  if(hz.state==='done'||hz.state==='cancelled'){ G.glassOff={x:0,y:0,rot:0}; G.curIntake=1; }
}

function update(dt){
  const s=G.sim, lvl=G.lvl;
  const Qmax=s.C/(lvl.fillSec*CFG.FILL_FACTOR);
  if(noticeT>0){ noticeT-=dt; if(noticeT<=0) el.notice.classList.remove('on'); }

  switch(G.phase){
    case 'intro':{
      if(G.t>=0.8){ el.intro.classList.remove('on'); setPhase('entrance'); }
      break;
    }
    case 'entrance':{
      const dur=G.retry?0.4:0.8;
      if(G.t>=dur){
        setPhase('call');
        const c=CHARS[lvl.ch];
        const call=(lvl.order==='foamy'&&c.callFoamy)?c.callFoamy:c.call;
        bubble(call); setFace('call'); Snd.call(); Voice.speak(call,c);
      }
      break;
    }
    case 'call':{
      if(Input.mode==='tilt'&&!Input.useSwipe){
        const t=Input.tilt; t.baseBuf.push(t.ang);
        if(t.baseBuf.length>36) t.baseBuf.shift();
      }
      if(G.t>=1.1){ bubble(null); setFace('watch'); setPhase('armDelay'); }
      break;
    }
    case 'armDelay':{
      if(G.t>=0.15){
        if(Input.mode==='tilt'&&!Input.useSwipe){
          const b=Input.tilt.baseBuf.slice(-20).sort((x,y)=>x-y);
          Input.tilt.base = b.length ? b[b.length>>1] : Input.tilt.ang;
        }
        Input.enabled=true;
        el.pourBtn.disabled=false;
        if(!Save.data.foamTipSeen){
          Save.data.foamTipSeen=true; Save.save();
          notice(Input.mode==='button'
            ? '強く注ぐと泡が増える。泡が多すぎたら手を離して待てば泡が落ち着き、注ぎ足せる'
            : '深く傾けると泡が増える。泡が多すぎたら戻して待てば泡が落ち着き、注ぎ足せる',4.2);
        } else if(Input.mode==='tilt'&&Input.useSwipe&&!Save.data.swipeTipSeen){
          Save.data.swipeTipSeen=true; Save.save();
          notice('画面を左右にドラッグ。遠くまで動かすほど強く注げる',2.8);
        }
        setPhase('play');
      }
      break;
    }
    case 'play':{
      if(Input.btnHeld) Input.holdT+=dt;
      else Input.holdT=Math.max(0,Input.holdT-dt/CFG.FLOW_DECAY*CFG.HOLD_RAMP);
      if(Input.mode==='tilt'&&!Input.useSwipe){
        const t=Input.tilt;
        const dead=t.everGot?(performance.now()-t.lastEvt>3500):(G.t>2.5);
        if(dead){
          Input.useSwipe=true;
          el.tiltMsg.textContent='画面を左右にドラッグして傾ける';
          notice('傾きセンサーに届かないため、スワイプ操作に切り替えました。画面を左右にドラッグ！',2.8);
        }
      }
      s.target=Input.flow(Qmax);
      fakeUpdate(dt);
      hazardUpdate(dt);
      simStep(s,dt,{Qmax,foamMult:lvl.foamMult,intake:G.curIntake??1});
      const nf=clamp(s.Q/Qmax,0,1), fill=clamp((s.L+s.P)/s.C,0,1);
      const foamR=s.P/Math.max(s.L+s.P,1e-9);
      Snd.pour(nf,fill,foamR,dt);
      updateFoamChip(foamR);
      // 手を止めている間は「まだ注ぎ足せる」ことと残り時間を見せる
      if(s.poured && s.Q<=0){
        el.waitBar.classList.add('on');
        el.waitFill.style.transform='scaleX('+clamp(1-s.zeroT/CFG.GRACE,0,1)+')';
      } else {
        el.waitBar.classList.remove('on');
      }
      if(s.Q>0&&!s._vibed){ s._vibed=true; vibe(20); }
      if(s.out){
        Input.enabled=false; el.pourBtn.disabled=true;
        s.target=0; s.Q=0; Snd.silence(); Snd.thud(); vibe(60);
        setFace('shock');
        el.waitBar.classList.remove('on');
        el.telemark.classList.remove('on'); (curPhoto?photoEl:curChara).classList.remove('tele');
        setPhase('ovfShow');
        break;
      }
      if(s.poured&&s.zeroT>=CFG.GRACE){
        Input.enabled=false; el.pourBtn.disabled=true;
        el.waitBar.classList.remove('on');
        Snd.silence();
        setPhase('settle');
      }
      break;
    }
    case 'settle':{
      hazardUpdate(dt);
      simStep(s,dt,{Qmax,foamMult:lvl.foamMult,intake:1});
      Snd.settleFizz(s.P/Math.max(s.L+s.P,1e-9),dt);
      if(s.zeroT>=CFG.SETTLE) finishJudge();
      break;
    }
    case 'ovfShow':{
      simStep(s,dt,{Qmax,foamMult:lvl.foamMult,intake:1});
      if(G.t>=0.6) finishJudge();
      break;
    }
    case 'reaction':{
      const R=VERDICT[G.res.v];
      if(!G._lineShown&&G.t>=R.lineDelay){
        G._lineShown=true;
        const line=pickLine(lvl.ch,G.res.v);
        bubble(line); Voice.speak(line,CHARS[lvl.ch]);
      }
      G.reactionSkippable=G.t>=0.5;
      if(G.t>=R.dur+R.lineDelay) showResult();
      break;
    }
  }
}

function finishJudge(){
  el.foamChip.classList.remove('on');
  el.waitBar.classList.remove('on');
  const res=judge(G.sim,G.lvl.order);
  G.res=res; G._lineShown=false;
  const R=VERDICT[res.v];
  setFace(R.face);
  if(R.snd==='perfect'){ Snd.perfect(); vibe([25,60,25]); }
  applyRecord(res);
  setPhase('reaction');
}
function applyRecord(res){
  const d=Save.data, ok=VERDICT[res.v].ok, n=G.lvl.lv;
  G._newBest=false;
  if(ok){
    d.totalSuccess++;
    if(res.v==='PERFECT') d.totalPerfect++;
    if(n>d.highestCleared) d.highestCleared=n;             // SAFE以上で解放 §15.1
    const key='L'+n;
    if(!d.bestByLevel[key]||res.score>d.bestByLevel[key]){ d.bestByLevel[key]=res.score; }
    const mode=Input.mode==='button'?'button':'tilt';
    if(res.score>d.best[mode]){ d.best[mode]=res.score; G._newBest=true; }
  }
  Save.save();
}
function showResult(){
  if(G.resultShown) return;
  G.resultShown=true;
  const res=G.res, R=VERDICT[res.v], n=G.lvl.lv;
  el.clearTag.textContent=`LEVEL ${n} CLEAR`;
  el.clearTag.classList.toggle('on',R.ok);
  el.verdict.textContent=R.word;
  el.verdict.className=R.cls;
  el.resMeta.innerHTML=`注いだ量 <b>${(res.F*100).toFixed(1)}%</b>　泡 <b>${foamLabel(res.R,G.lvl.order)}</b>`;
  el.resScore.innerHTML=`スコア <b>${res.score}</b>`;
  el.newBest.classList.toggle('on',!!G._newBest);
  if(R.ok&&n<18){
    el.nextBtn.style.display='';
    el.nextBtn.textContent=`つぎへ　LEVEL ${n+1}`;
    el.retryBtn.classList.add('sub');
  } else if(R.ok&&n>=18){
    el.nextBtn.style.display='none';
    el.retryBtn.classList.add('sub');
    el.clearTag.textContent='通常編クリア！ ここから先はEX「無理杯」(次回実装)';
  } else {
    el.nextBtn.style.display='none';
    el.retryBtn.classList.remove('sub');
  }
  el.result.classList.add('on');
  setPhase('result');
}

/* ---------- 描画 ---------- */
const ctx=el.cv.getContext('2d');
let CW=0,CH=0,DPR=1;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  const r=el.cv.getBoundingClientRect();
  CW=r.width; CH=r.height;
  el.cv.width=Math.round(CW*DPR); el.cv.height=Math.round(CH*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize',resize);

const bubblesFx=[], drips=[];
/* グラス内側の半幅(高さ位置tで補間: t=0が上端,1が底) */
function innerHalfW(g,gw,t){
  const topHW=(gw/2)-gw*0.09;
  return lerp(topHW, topHW*g.taper, t);
}
/* 瓶ビール。注ぎ口をグラスの真上に固定し、流量が増えるほど深く傾ける。
   位置は「注ぎ口ありき」で決めるので、常にグラスへ注いでいる画になる */
function bottleGeom(gcx, rimY, nf){
  const sc=Math.max(0.6, Math.min(1.3, CW/390));
  // 手に持った瓶。胴を長くして握り手ごと画面外へ逃がす。
  // (平面的な指を描くと写真の人物の横で一番安っぽく見えるため、描かない)
  const BW=54*sc, BH=250*sc, NECK=42*sc;
  const R=BH/2+NECK;                                  // 中心→注ぎ口の距離
  const ang=-(1.02 + nf*1.16);                        // 未注ぎ:立て気味 / 全開:注ぎ角
  const dir={x:Math.sin(ang), y:-Math.cos(ang)};      // 注ぎ口の向き
  const spout={x:gcx + 22*sc, y:rimY - 26*sc};        // グラスの縁の少し上(やや右)
  return {sc,BW,BH,NECK,ang,R,dir,spout,
          px:spout.x - R*dir.x, py:spout.y - R*dir.y};
}
function bottleSpout(gcx, rimY, nf){ return bottleGeom(gcx,rimY,nf).spout; }
/* 瓶のシルエットを1本のパスで引く。角丸四角の組み合わせだと
   肩の折れ目が出て、写真の人物の横で作り物に見えるため。 */
function bottlePath(BW,BH,NECK,sc){
  const hw=BW/2, nhw=BW*0.19, top=-BH/2, bot=BH/2;
  const shoulder=top-20*sc, lip=top-NECK;
  ctx.beginPath();
  ctx.moveTo(-hw+9*sc, bot);
  ctx.quadraticCurveTo(-hw, bot, -hw, bot-9*sc);      // 底の角(ヒール)
  ctx.lineTo(-hw, top+18*sc);
  // なで肩: 胴から首へ滑らかに絞る
  ctx.bezierCurveTo(-hw, shoulder+6*sc, -nhw-2*sc, shoulder+2*sc, -nhw, shoulder-8*sc);
  ctx.lineTo(-nhw, lip+7*sc);
  ctx.quadraticCurveTo(-nhw-2.5*sc, lip+3*sc, -nhw-2.5*sc, lip);   // 口の巻き
  ctx.lineTo(nhw+2.5*sc, lip);
  ctx.quadraticCurveTo(nhw+2.5*sc, lip+3*sc, nhw, lip+7*sc);
  ctx.lineTo(nhw, shoulder-8*sc);
  ctx.bezierCurveTo(nhw+2*sc, shoulder+2*sc, hw, shoulder+6*sc, hw, top+18*sc);
  ctx.lineTo(hw, bot-9*sc);
  ctx.quadraticCurveTo(hw, bot, hw-9*sc, bot);
  ctx.closePath();
}
function drawBottle(gcx, rimY, nf, now){
  const g=bottleGeom(gcx,rimY,nf);
  const {sc,BW,BH,NECK}=g;
  const hw=BW/2, top=-BH/2;
  ctx.save();
  ctx.translate(g.px,g.py); ctx.rotate(g.ang);

  // 落ち影: 舞台に接地感を出す
  ctx.save();
  ctx.globalAlpha=.34; ctx.filter='blur(7px)';
  ctx.fillStyle='#000';
  bottlePath(BW*1.04,BH,NECK,sc); ctx.translate(5*sc,7*sc); ctx.fill();
  ctx.restore();

  // 茶色ガラス本体。両端を落として中央に鏡面を置くと丸みが出る
  const body=ctx.createLinearGradient(-hw,0,hw,0);
  body.addColorStop(0,   '#0E0601');
  body.addColorStop(.11, '#2B1507');
  body.addColorStop(.30, '#532E0F');
  body.addColorStop(.43, '#7E4A16');
  body.addColorStop(.52, '#5C350F');
  body.addColorStop(.74, '#311806');
  body.addColorStop(1,   '#0B0501');
  ctx.fillStyle=body; bottlePath(BW,BH,NECK,sc); ctx.fill();

  // 上下の陰影(首側を明るく、底側を沈ませる)
  ctx.save(); bottlePath(BW,BH,NECK,sc); ctx.clip();
  const vert=ctx.createLinearGradient(0,top-NECK,0,BH/2);
  vert.addColorStop(0,'rgba(255,214,150,.16)');
  vert.addColorStop(.35,'rgba(0,0,0,0)');
  vert.addColorStop(1,'rgba(0,0,0,.42)');
  ctx.fillStyle=vert; ctx.fillRect(-hw,top-NECK,BW,BH+NECK);

  // 鏡面ハイライト(太い主反射と細い副反射)
  const spec=ctx.createLinearGradient(-hw,0,hw,0);
  spec.addColorStop(.36,'rgba(255,236,196,0)');
  spec.addColorStop(.43,'rgba(255,243,214,.42)');
  spec.addColorStop(.49,'rgba(255,236,196,0)');
  spec.addColorStop(.80,'rgba(255,226,180,0)');
  spec.addColorStop(.86,'rgba(255,232,190,.20)');
  spec.addColorStop(.92,'rgba(255,226,180,0)');
  ctx.fillStyle=spec; ctx.fillRect(-hw,top-NECK,BW,BH+NECK);
  ctx.restore();

  // 口の巻き(リング)
  const lip=top-NECK, nhw=BW*0.27;
  ctx.fillStyle='rgba(0,0,0,.30)';
  ctx.beginPath(); ctx.roundRect(-nhw-2.5*sc, lip, (nhw+2.5*sc)*2, 7*sc, 2*sc); ctx.fill();
  ctx.fillStyle='rgba(255,235,200,.28)';
  ctx.beginPath(); ctx.roundRect(-nhw*0.5, lip+1*sc, nhw*0.5, 5*sc, 2*sc); ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,.45)'; ctx.lineWidth=1.2*sc;
  ctx.beginPath(); ctx.moveTo(-nhw-2.5*sc, lip+7*sc); ctx.lineTo(nhw+2.5*sc, lip+7*sc); ctx.stroke();

  // ラベル: 瓶の丸みに合わせて端を暗くする
  const LY=-BH*0.42, LH=BH*0.30, lw=BW-5*sc;
  ctx.save();
  ctx.beginPath(); ctx.roundRect(-lw/2, LY, lw, LH, 3*sc); ctx.clip();
  ctx.fillStyle='#EFE7D2'; ctx.fillRect(-lw/2, LY, lw, LH);
  const lg=ctx.createLinearGradient(-lw/2,0,lw/2,0);
  lg.addColorStop(0,'rgba(60,32,10,.55)'); lg.addColorStop(.16,'rgba(60,32,10,.10)');
  lg.addColorStop(.44,'rgba(255,255,255,.30)');
  lg.addColorStop(.80,'rgba(60,32,10,.16)'); lg.addColorStop(1,'rgba(60,32,10,.60)');
  ctx.fillStyle='#A82F26';
  ctx.fillRect(-lw/2, LY, lw, LH*0.15);
  ctx.fillRect(-lw/2, LY+LH*0.85, lw, LH*0.15);
  ctx.save();
  ctx.translate(0, LY+LH*0.52); ctx.rotate(Math.PI/2); // 瓶の長辺に沿って読める向き
  ctx.fillStyle='#2E1B0A';
  ctx.font=`700 ${Math.round(18*sc)}px "Zen Kaku Gothic New",sans-serif`;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('ビール',0,0);
  ctx.restore();
  ctx.fillStyle=lg; ctx.fillRect(-lw/2, LY, lw, LH);   // 紙が瓶に巻かれている陰影
  ctx.restore();
  ctx.strokeStyle='rgba(0,0,0,.30)'; ctx.lineWidth=1*sc;
  ctx.beginPath(); ctx.roundRect(-lw/2, LY, lw, LH, 3*sc); ctx.stroke();

  // 縁の締め: ガラスらしい濃い輪郭
  ctx.strokeStyle='rgba(0,0,0,.55)'; ctx.lineWidth=1.4*sc;
  bottlePath(BW,BH,NECK,sc); ctx.stroke();
  ctx.restore();
}
/* シーンモード描画: Gemini画像のグラスへ直接注ぐ */
/* センサーが生きているか、いま何度かを画面に出す。
   ?tilt=1 を付けると内部の値もそのまま見える(不具合の切り分け用) */
const TILTDBG=/[?&]tilt=1/.test(location.search);
function tiltReadout(a){
  if(Input.useSwipe) return;
  const t=Input.tilt;
  if(TILTDBG){
    const d=t.base===null?0:(t.ang-t.base);
    el.tiltMsg.textContent=
      `got${t.everGot?1:0} sw${Input.useSwipe?1:0} base${t.base===null?'-':t.base.toFixed(0)} `+
      `ang${t.ang.toFixed(0)} d${d.toFixed(0)} dir${t.dir} a${(d*(t.dir||1)).toFixed(0)} p${t.pouring?1:0}`;
    return;
  }
  el.tiltMsg.textContent = t.everGot
    ? `傾き ${a.toFixed(0)}° / ${CFG.TILT.START}°で注ぎ始め`
    : 'センサー待ち…';
}
function renderScene(now){
  const s=G.sim, sc=curScene, img=sceneImgs[G.sceneCh]&&sceneImgs[G.sceneCh][G.sceneFace];
  if(!img||!img.complete||!img.naturalWidth){ return; }
  const iw=img.naturalWidth, ih=img.naturalHeight;
  // 結果の表情はカメラを少し寄せて大きく見せる(オーバーな顔を見せ切る)
  const bigFace=(G.phase==='reaction'||G.phase==='result')&&
                ['happy','shock','angry','drunk','low','meh'].includes(G.sceneFace);
  const zoom = bigFace ? Math.min(1.16, 1+ (G.phase==='reaction'? Math.min(G.t,0.5)*0.32 : 0.16)) : 1;
  const k=Math.max(CW/iw, CH/ih)*zoom;
  const dw=iw*k, dh=ih*k, dx=(CW-dw)/2, dy=(CH-dh)/2;
  const off=G.glassOff, sway=safeSwayOffset(now);
  const mx=off.x+sway.x, my=off.y, mrot=(off.rot+sway.rot)*Math.PI/180;

  // 相手が動く=シーン全体が動く(グラス当たり判定も一緒に動く)
  ctx.save();
  ctx.translate(CW/2+mx, CH*0.7+my); ctx.rotate(mrot); ctx.translate(-CW/2,-CH*0.7);
  ctx.drawImage(img,dx,dy,dw,dh);

  // グラス内側(台形)を画像座標→画面座標へ
  const gl=sc.glass;
  const X=u=>dx+u*dw, Y=v=>dy+v*dh;
  const topY=Y(gl.topY), botY=Y(gl.botY);
  const hwAt=y=>{
    const t=(y-topY)/(botY-topY);
    const L=X(gl.topL)+(X(gl.botL)-X(gl.topL))*t;
    const R=X(gl.topR)+(X(gl.botR)-X(gl.topR))*t;
    return {L,R,C:(L+R)/2};
  };
  const fillL=clamp(s.L/s.C,0,1), fillP=clamp(s.P/s.C,0,1);
  const innerH=botY-topY;
  const yL=botY-innerH*fillL;
  const yP=yL-innerH*fillP;
  const wob=Math.sin(now/140)*(s.Q>0?2:0.5);

  const clipGlass=()=>{ctx.beginPath();
    ctx.moveTo(X(gl.topL),topY);ctx.lineTo(X(gl.topR),topY);
    ctx.lineTo(X(gl.botR),botY);ctx.lineTo(X(gl.botL),botY);ctx.closePath();};

  // ビール(半透明: 指がグラス前面に写っていても透けて馴染む)
  if(fillL>0.004){
    ctx.save(); clipGlass(); ctx.clip();
    const grad=ctx.createLinearGradient(0,yL,0,botY);
    grad.addColorStop(0,'rgba(244,176,66,0.72)'); grad.addColorStop(1,'rgba(178,106,20,0.78)');
    ctx.fillStyle=grad;
    ctx.beginPath();
    const a=hwAt(Math.min(yL+wob,botY)), b=hwAt(botY);
    ctx.moveTo(b.L,botY); ctx.lineTo(a.L,yL+wob);
    ctx.quadraticCurveTo(a.C,yL-wob,a.R,yL+wob);
    ctx.lineTo(b.R,botY); ctx.closePath(); ctx.fill();
    // 上昇する気泡
    ctx.fillStyle='rgba(255,235,190,0.5)';
    for(let i=bubblesFx.length-1;i>=0;i--){
      const bb=bubblesFx[i]; bb.y-=bb.v/60;
      if(bb.y<yL+2){ bubblesFx.splice(i,1); continue; }
      ctx.beginPath();ctx.arc(bb.x,bb.y,bb.r,0,Math.PI*2);ctx.fill();
    }
    if(Math.random()<0.35&&(botY-yL)>12){
      const w0=hwAt(botY);
      bubblesFx.push({x:w0.C+(Math.random()*2-1)*(w0.R-w0.L)*0.4,y:botY-3,r:0.8+Math.random()*1.4,v:12+Math.random()*20});
    }
    ctx.restore();
  }
  // 泡
  if(fillP>0.004){
    ctx.save(); clipGlass(); ctx.clip();
    ctx.fillStyle='rgba(248,241,225,0.95)';
    ctx.beginPath();
    const a=hwAt(yL), c=hwAt(Math.max(yP,topY));
    ctx.moveTo(a.L,yL+1); ctx.lineTo(c.L,Math.max(yP,topY)+2);
    const n=5;
    for(let i=0;i<=n;i++){
      const x=c.L+(c.R-c.L)*i/n;
      ctx.lineTo(x, Math.max(yP,topY)+Math.sin(now/300+i*1.7)*1.4+(i%2?1.5:0));
    }
    ctx.lineTo(a.R,yL+1); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  // 95%の縁きらめき
  const F=(s.L+s.P)/s.C;
  if(F>=0.95&&!s.out){
    ctx.strokeStyle=`rgba(255,200,90,${0.4+0.3*Math.sin(now/120)})`;
    ctx.lineWidth=2.5;
    ctx.beginPath();ctx.moveTo(X(gl.topL),topY);ctx.lineTo(X(gl.topR),topY);ctx.stroke();
  }
  // 溢れ: 縁から外側へ垂れる
  if(s.ovf>0){
    ctx.fillStyle='rgba(248,241,225,0.9)';
    ctx.beginPath();
    ctx.ellipse((X(gl.topL)+X(gl.topR))/2, topY-1, (X(gl.topR)-X(gl.topL))*0.55, 4, 0, 0, Math.PI*2);
    ctx.fill();
    if(G.phase==='ovfShow'&&Math.random()<0.5)
      drips.push({x:Math.random()<0.5?X(gl.topL)+2:X(gl.topR)-2, y:topY, v:0});
  }
  if(drips.length){
    ctx.fillStyle='rgba(244,196,110,0.85)';
    for(let i=drips.length-1;i>=0;i--){
      const d=drips[i]; d.v+=180/60; d.y+=d.v/60;
      if(d.y>botY+40){ drips.splice(i,1); continue; }
      ctx.beginPath();ctx.ellipse(d.x,d.y,2.4,4.5,0,0,Math.PI*2);ctx.fill();
    }
  }
  ctx.restore();   // シーン移動ここまで

  // プレイヤーが持つ瓶ビール。注ぐほど深く傾き、口からストリームが出る
  const Qmax=s.C/(G.lvl.fillSec*CFG.FILL_FACTOR);
  const nf=clamp(s.Q/Qmax,0,1);
  const gl2=sc.glass;
  const gcx=(X(gl2.topL)+X(gl2.topR))/2 + sway.x;   // 揺れのみ追従
  const rimY=topY+my;
  drawBottle(gcx, rimY, nf, now);
  if(nf>0.02){
    const targetY=Math.min(yL-(yL-yP), yL)+my;
    const missing=1-(G.curIntake??1);
    const landY = missing>0.05 ? CH*0.92 : Math.max(targetY, rimY+4);
    const sw=2+nf*7;
    const sp=bottleSpout(gcx, rimY, nf);
    ctx.fillStyle='rgba(240,169,60,0.92)';
    ctx.beginPath();
    ctx.moveTo(sp.x-sw*0.45, sp.y);
    ctx.quadraticCurveTo(gcx-sw/2, (sp.y+landY)*0.5, gcx-sw/2, landY);
    ctx.lineTo(gcx+sw/2, landY);
    ctx.quadraticCurveTo(gcx+sw/2+nf*2, (sp.y+landY)*0.5, sp.x+sw*0.55, sp.y);
    ctx.closePath(); ctx.fill();
    if(missing>0.05&&Math.random()<0.6)
      drips.push({x:gcx+(Math.random()*2-1)*8, y:CH*0.9, v:20});
  }

  if(Input.mode==='tilt'){
    const a=Input.useSwipe?Math.abs(Input.swipe.ang):
      (Input.tilt.base===null?0:Math.abs(Input.tilt.ang-Input.tilt.base));
    el.tiltFill.style.width=(clamp((a-CFG.TILT.START)/(CFG.TILT.MAX-CFG.TILT.START),0,1)*100)+'%';
    tiltReadout(a);
  }
  if(DEBUG){
    el.debug.textContent=`LV ${G.lvl.lv} ${G.lvl.ch} [scene] ph ${G.phase}\nF ${(F*100).toFixed(2)}% intake ${(G.curIntake??1).toFixed(2)}`;
  }
}
function render(now){
  ctx.clearRect(0,0,CW,CH);
  const s=G.sim, lvl=G.lvl, g=GLASSES[lvl.glass];
  if(!el.game.classList.contains('on')||CW===0) return;
  if(curScene){ renderScene(now); return; }

  const bg=el.game.dataset.bg;
  const tableY=CH*0.86;
  ctx.fillStyle=TABLE_COLOR[bg]||'#31251A'; ctx.fillRect(0,tableY,CW,CH-tableY);
  ctx.fillStyle='rgba(255,255,255,0.06)'; ctx.fillRect(0,tableY,CW,4);
  ctx.strokeStyle='rgba(0,0,0,0.22)'; ctx.lineWidth=1;
  for(let i=1;i<=3;i++){
    const y=tableY+(CH-tableY)*i/4;
    ctx.beginPath(); ctx.moveTo(0,y); ctx.quadraticCurveTo(CW/2,y+3,CW,y); ctx.stroke();
  }
  const wl=s.W/s.C;
  if(wl>0.0005){
    const stage=wl>=0.015?3:wl>=0.006?2:1;
    ctx.fillStyle='rgba(20,12,4,0.55)';
    ctx.beginPath();
    ctx.ellipse(CW/2,tableY+10,CW*0.12*stage,7+stage*3,0,0,Math.PI*2);
    ctx.fill();
  }

  const gw=CW*g.wFrac, gh=CH*g.hFrac;
  const homeX=CW/2, off=G.glassOff;
  const gx=homeX-gw/2, gy=tableY-gh;

  const sway=safeSwayOffset(now);
  const sx0=off.x+sway.x, srot=off.rot+sway.rot;
  ctx.save();
  ctx.translate(homeX+sx0, tableY+off.y);
  ctx.rotate(srot*Math.PI/180);
  ctx.translate(-homeX,-tableY);

  if(g.handle){
    ctx.strokeStyle='rgba(214,228,238,0.5)'; ctx.lineWidth=10; ctx.lineJoin='round';
    ctx.beginPath();
    ctx.moveTo(gx+gw-4,gy+gh*0.22);
    ctx.bezierCurveTo(gx+gw+gw*0.34,gy+gh*0.24,gx+gw+gw*0.34,gy+gh*0.62,gx+gw-4,gy+gh*0.66);
    ctx.stroke();
  }
  /* グラス輪郭(台形) */
  const topY=gy, botY=tableY-gh*0.02;
  const hwTop=gw/2, hwBot=gw/2*((g.taper+0.15)/1.15);
  const glassPath=()=>{
    ctx.beginPath();
    ctx.moveTo(homeX-hwTop,topY); ctx.lineTo(homeX-hwBot,botY);
    ctx.lineTo(homeX+hwBot,botY); ctx.lineTo(homeX+hwTop,topY);
    ctx.closePath();
  };
  glassPath(); ctx.fillStyle='rgba(210,226,238,0.11)'; ctx.fill();

  const innerTop=topY+gh*0.03, innerBot=botY-gh*0.02, innerH=innerBot-innerTop;
  const fillL=clamp(s.L/s.C,0,1), fillP=clamp(s.P/s.C,0,1);
  const hL=innerH*fillL, hP=innerH*fillP;
  const yL=innerBot-hL;
  const wob=Math.sin(now/140)*(s.Q>0?2.2:0.6);
  const hwAt=y=>innerHalfW(g,gw,(y-innerTop)/innerH);

  if(hL>0.5){
    const grad=ctx.createLinearGradient(0,yL,0,innerBot);
    grad.addColorStop(0,'#F0A93C'); grad.addColorStop(1,'#B96F14');
    ctx.fillStyle=grad;
    ctx.beginPath();
    ctx.moveTo(homeX-hwAt(innerBot),innerBot);
    ctx.lineTo(homeX-hwAt(yL),yL+wob);
    ctx.quadraticCurveTo(homeX,yL-wob,homeX+hwAt(yL),yL+wob);
    ctx.lineTo(homeX+hwAt(innerBot),innerBot);
    ctx.closePath(); ctx.fill();
    if(Math.random()<0.3&&hL>10)
      bubblesFx.push({x:homeX+(Math.random()*2-1)*hwAt(innerBot)*0.85,y:innerBot-2,r:1+Math.random()*1.6,v:14+Math.random()*22});
  }
  ctx.save();
  glassPath(); ctx.clip();
  ctx.fillStyle='rgba(255,235,190,0.5)';
  for(let i=bubblesFx.length-1;i>=0;i--){
    const b=bubblesFx[i]; b.y-=b.v/60;
    if(b.y<yL+2){ bubblesFx.splice(i,1); continue; }
    ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();

  if(hP>0.5){
    const yP=yL-hP;
    ctx.fillStyle='#F6EEDC';
    ctx.beginPath();
    ctx.moveTo(homeX-hwAt(yL),yL+1);
    ctx.lineTo(homeX-hwAt(yP),yP+3);
    const n=6;
    for(let i=0;i<=n;i++){
      const x=homeX-hwAt(yP)+hwAt(yP)*2*i/n;
      const y=yP+Math.sin(now/300+i*1.7)*1.6+(i%2?2:0);
      ctx.lineTo(x,y);
    }
    ctx.lineTo(homeX+hwAt(yL),yL+1);
    ctx.closePath(); ctx.fill();
  }

  const glassGrad=ctx.createLinearGradient(gx,0,gx+gw,0);
  glassGrad.addColorStop(0,'rgba(226,238,246,0.20)');
  glassGrad.addColorStop(0.12,'rgba(226,238,246,0.03)');
  glassGrad.addColorStop(0.85,'rgba(226,238,246,0.03)');
  glassGrad.addColorStop(1,'rgba(226,238,246,0.22)');
  glassPath(); ctx.fillStyle=glassGrad; ctx.fill();
  if(g.frosted){                                   // 冷気で曇ったグラス
    glassPath(); ctx.fillStyle='rgba(226,238,246,0.30)'; ctx.fill();
    ctx.save(); glassPath(); ctx.clip();
    ctx.fillStyle='rgba(255,255,255,0.16)';
    for(let i=0;i<26;i++){
      const fx=homeX-gw/2+((i*37)%gw), fy=topY+((i*53)%gh);
      ctx.beginPath(); ctx.arc(fx,fy,1.6+((i*7)%3),0,Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }
  glassPath(); ctx.strokeStyle='rgba(226,238,246,0.55)'; ctx.lineWidth=2.5; ctx.stroke();

  const F=(s.L+s.P)/s.C;
  if(F>=0.95&&!s.out){
    ctx.strokeStyle=`rgba(232,161,60,${0.35+0.3*Math.sin(now/120)})`;
    ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(homeX-hwTop,topY);ctx.lineTo(homeX+hwTop,topY);ctx.stroke();
  }
  ctx.restore();   // グラス移動ここまで(ストリームは動かない)

  /* ビール容器+ストリーム(常に元のグラス位置を狙う→動かされると外れる) */
  const Qmax=s.C/(lvl.fillSec*CFG.FILL_FACTOR);
  const nf=clamp(s.Q/Qmax,0,1);
  const px=homeX, py=CH*0.02;
  ctx.save();
  ctx.translate(px+gw*0.55,py+18);
  ctx.rotate(-0.35-nf*0.5);
  ctx.fillStyle='#8A5A28'; ctx.fillRect(-14,-16,52,30);
  ctx.fillStyle='#6E4419'; ctx.fillRect(-30,-9,18,14);
  ctx.restore();
  if(nf>0.02){
    const sw=2+nf*7;
    const sx=px+gw*0.55-30, sy=py+22;
    const missing=1-(G.curIntake??1);
    const aimX=homeX+sway.x;                       // 安全揺れには注ぎ手が追従する
    const targetY=missing>0.05 ? tableY-4 : Math.min(yL-hP,innerBot)-2+off.y;
    ctx.fillStyle='rgba(240,169,60,0.92)';
    ctx.beginPath();
    ctx.moveTo(sx-sw/2,sy);
    ctx.quadraticCurveTo(aimX-sw/2-6,(sy+targetY)/2,aimX-sw/2,targetY);
    ctx.lineTo(aimX+sw/2,targetY);
    ctx.quadraticCurveTo(aimX+sw/2-6+wob*0.5,(sy+targetY)/2,sx+sw/2,sy);
    ctx.closePath(); ctx.fill();
    if(missing>0.05&&Math.random()<0.6)
      drips.push({x:homeX+(Math.random()*2-1)*8,y:tableY-6,v:20});
  }

  if(s.ovf>0&&G.phase==='ovfShow'&&Math.random()<0.5)
    drips.push({x:homeX+(Math.random()<0.5?-gw*0.4:gw*0.4)+off.x,y:tableY-gh+off.y,v:0});
  if(drips.length){
    ctx.fillStyle='#F6EEDC';
    for(let i=drips.length-1;i>=0;i--){
      const d=drips[i]; d.v+=180/60; d.y+=d.v/60;
      if(d.y>tableY+6){ drips.splice(i,1); continue; }
      ctx.beginPath();ctx.ellipse(d.x,d.y,3,5,0,0,Math.PI*2);ctx.fill();
    }
  }

  if(Input.mode==='tilt'){
    const a=Input.useSwipe?Math.abs(Input.swipe.ang):
      (Input.tilt.base===null?0:Math.abs(Input.tilt.ang-Input.tilt.base));
    el.tiltFill.style.width=(clamp((a-CFG.TILT.START)/(CFG.TILT.MAX-CFG.TILT.START),0,1)*100)+'%';
    tiltReadout(a);
  }

  if(DEBUG){
    el.debug.textContent=
`LV ${lvl.lv} ${lvl.ch}  ph ${G.phase}
F  ${(F*100).toFixed(2)}%
L ${(s.L*100).toFixed(1)} P ${(s.P*100).toFixed(1)} W ${(s.W*100).toFixed(2)}
Q ${s.Q.toFixed(3)} R ${(s.P/Math.max(s.L+s.P,1e-9)*100).toFixed(1)}%
hz ${G.hz?G.hz.state+' trig'+(G.hz.trigF*100).toFixed(0):'-'}
intake ${(G.curIntake??1).toFixed(2)} zero ${s.zeroT.toFixed(2)}`;
  }
}

/* ---------- メインループ ---------- */
let last=performance.now(), acc=0;
function frame(now){
  let dt=(now-last)/1000; last=now;
  dt=Math.min(dt,0.25);
  acc+=dt;
  while(acc>=CFG.TICK){ G.t+=CFG.TICK; update(CFG.TICK); acc-=CFG.TICK; }
  render(now);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------- イベント ---------- */
function armAudio(){ Snd.init(); Snd.resume(); }
document.addEventListener('pointerdown',armAudio,{passive:true});

el.pourBtn.addEventListener('pointerdown',e=>{
  e.preventDefault();
  if(el.pourBtn.disabled) return;
  el.pourBtn.setPointerCapture(e.pointerId);
  el.pourBtn.classList.add('down');
  Input.btnHeld=true;
});
const releasePour=()=>{ Input.btnHeld=false; el.pourBtn.classList.remove('down'); };
el.pourBtn.addEventListener('pointerup',releasePour);
el.pourBtn.addEventListener('pointercancel',releasePour);
window.addEventListener('blur',releasePour);
document.addEventListener('visibilitychange',()=>{ if(document.hidden) releasePour(); });
window.addEventListener('keydown',e=>{ if(e.code==='Space'&&!e.repeat&&!el.pourBtn.disabled){Input.btnHeld=true;el.pourBtn.classList.add('down');} });
window.addEventListener('keyup',e=>{ if(e.code==='Space') releasePour(); });

/* ドラッグで傾け(センサーが使えない環境の代替)。画面のどこを掴んでもよい */
el.game.addEventListener('pointerdown',e=>{
  if(Input.mode!=='tilt'||!Input.useSwipe) return;
  if(e.target===el.pourBtn) return;
  Input.swipe.active=true; Input.swipe.startX=e.clientX;
  try{ el.game.setPointerCapture(e.pointerId); }catch(_){}
});
el.game.addEventListener('pointermove',e=>{
  if(!Input.swipe.active) return;
  // 画面幅の約4割ドラッグで最大流量に届く
  const span=Math.max(140, el.game.clientWidth*0.42);
  Input.swipe.ang=clamp((e.clientX-Input.swipe.startX)/span*CFG.TILT.MAX,-CFG.TILT.MAX,CFG.TILT.MAX);
});
const endSwipe=()=>{ Input.swipe.active=false; Input.swipe.ang=0; };
el.game.addEventListener('pointerup',endSwipe);
el.game.addEventListener('pointercancel',endSwipe);
el.game.addEventListener('pointerleave',endSwipe);

el.game.addEventListener('pointerdown',()=>{
  if(G.phase==='reaction'&&G.reactionSkippable) showResult();
});

function setMode(m){
  Input.mode=m;
  el.modeBtnBtn.classList.toggle('on',m==='button');
  el.modeTiltBtn.classList.toggle('on',m==='tilt');
  setTiltLabel();
  Snd.ui();
}
/* 傾けボタンの表示を実際の入力手段に合わせる(嘘の選択肢を見せない) */
function setTiltLabel(){
  el.modeTiltBtn.textContent = Input.useSwipe ? 'ドラッグで注ぐ' : '傾けて注ぐ';
  if(Input.mode==='tilt'&&Input.useSwipe) el.modeHint.textContent='この端末ではセンサーが使えないため、画面を左右にドラッグして注ぎます';
  else if(Input.mode==='tilt') el.modeHint.textContent='スマホを左右に傾けて注ぎます';
  else el.modeHint.textContent='押し続けるほど勢いが増し、泡が多くなります';
}
el.modeBtnBtn.addEventListener('click',()=>setMode('button'));
el.modeTiltBtn.addEventListener('click',async()=>{
  setMode('tilt');
  const ok=await Input.requestTilt();
  if(!ok){ Input.useSwipe=true; setTiltLabel(); return; }
  // 初回イベントが来るまで端末によっては1秒以上かかる。届いた時点で確定させ、
  // 2.5秒待っても来なければドラッグへ落とす
  let waited=0;
  const iv=setInterval(()=>{
    waited+=200;
    if(Input.tilt.everGot){ Input.useSwipe=false; setTiltLabel(); clearInterval(iv); }
    else if(waited>=2500){ Input.useSwipe=true; setTiltLabel(); clearInterval(iv); }
  },200);
});
function syncVoiceBtn(){
  el.voiceBtn.classList.toggle('on',!!Save.data.voice);
  el.voiceBtn.textContent=Save.data.voice?'声 ON':'声 OFF';
  el.voiceBtn.setAttribute('aria-pressed',String(!!Save.data.voice));
}
el.voiceBtn.addEventListener('click',()=>{
  Save.data.voice=!Save.data.voice; Save.save(); syncVoiceBtn(); setTiltLabel();

/* 許可の要らない端末(Android等)では読み込み時点でセンサーを購読しておく。
   ボタンを押してから初回イベントを待つ作りだと、WebViewのように配信が遅い
   環境で「センサーなし」と誤判定され、以後ドラッグ操作に固定されていた。
   先に繋いでおけば、傾けを選ぶ時点で既に値が来ている。 */
if(typeof DeviceOrientationEvent!=='undefined' &&
   typeof DeviceOrientationEvent.requestPermission!=='function'){
  try{ Input.startTiltListener(); }catch(e){}
  setTimeout(setTiltLabel,600);
} Snd.ui();
  if(Save.data.voice) Voice.speak('もう一杯！',CHARS.papa);
});
syncVoiceBtn(); setTiltLabel();

el.startBtn.addEventListener('click',()=>{
  armAudio(); Snd.ui();
  // 開始前に確定させる。ただしセンサーが生きていれば必ず傾けを使う
  if(Input.mode==='tilt'){
    Input.useSwipe = !(Input.tilt.everGot && performance.now()-Input.tilt.lastEvt<2000);
    if(Input.useSwipe && !Input.tilt.listening) Input.requestTilt();   // 許可がまだなら促す
  }
  el.pourBtn.style.display=Input.mode==='button'?'':'none';
  el.tiltGuide.hidden=Input.mode!=='tilt';
  el.tiltMsg.textContent=Input.useSwipe
    ? '画面を左右にドラッグ → 遠いほど強く注ぐ'
    : 'スマホを左右に傾けて注ぐ';
  startLevel(G.selLevel,false);
});
el.nextBtn.addEventListener('click',()=>{ Snd.ui(); G.selLevel=Math.min(G.lvl.lv+1,18); startLevel(G.lvl.lv+1,false); });
el.retryBtn.addEventListener('click',()=>{ Snd.ui(); startLevel(G.lvl.lv,true); });
el.toHome.addEventListener('click',()=>{
  Snd.ui(); el.result.classList.remove('on'); show('home'); setPhase('home');
  G.selLevel=Math.min(Save.data.highestCleared+1,18);
  updateHome();
});

const DEBUG=/[?&]debug=1/.test(location.search);
if(DEBUG) el.debug.classList.add('on');
const mLv=location.search.match(/[?&]level=(\d+)/);
if(mLv) G.selLevel=clamp(+mLv[1],1,18);
else G.selLevel=Math.min(Save.data.highestCleared+1,18);

updateHome();
requestAnimationFrame(()=>{ resize(); });
new ResizeObserver(resize).observe(el.cv);
window.MI={G,Input,CFG,Save,judge,score,LEVELS,startLevel,FOAM_ORDERS,CHAR_ART,buildChara};
</script>
<!-- /APP -->
</body>
