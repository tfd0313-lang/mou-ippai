<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>もう一杯！</title>
<!-- ホーム画面に追加したときにアプリのように開くための指定 -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png" sizes="192x192">
<meta name="theme-color" content="#120C07">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="もう一杯！">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
<!-- APP -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* 『もう一杯！』プロトタイプv0.3 — SPEC v1.3 + 対戦相手・レベル・背景仕様書v1.1
   実装範囲: 通常編LEVEL 1〜9(ママ/パパ/上司)、別紙仕様書P0 */
:root{
  --ink:#17120E; --wood:#31251A; --wood-hi:#41321F;
  --amber:#E8A13C; --amber-deep:#B97416;
  --cream:#F6EEDC; --mut:#9C8B74; --red:#C9503C;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--ink); color:var(--cream);
  font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN",sans-serif;
  overflow:hidden; touch-action:none; user-select:none;-webkit-user-select:none;
}
#stage{
  position:fixed;inset:0;margin:auto;
  width:min(100vw,calc(100dvh * .54)); height:100dvh;
  background:var(--ink);
  display:flex;flex-direction:column;
  box-shadow:0 0 0 1px #000;
  overflow:hidden;
}
.screen{position:absolute;inset:0;display:none;flex-direction:column}
.screen.on{display:flex}

/* ---------- ホーム ---------- */
#home{align-items:center;justify-content:flex-start;gap:12px;
  padding:calc(env(safe-area-inset-top,0px) + 16px) 22px calc(env(safe-area-inset-bottom,0px) + 24px);
  text-align:center;overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:
    radial-gradient(46% 20% at 16% 4%, rgba(232,161,60,.16), transparent 70%),
    radial-gradient(46% 20% at 84% 3%, rgba(232,161,60,.11), transparent 70%),
    var(--ink);
}
/* 縦フレックスの子は既定で縮む。画面が低いと操作方式の帯が2pxまで潰れ、
   overflow:hidden で中のボタンごと刈り取られて押せなくなっていた。
   縮ませずに #home 側をスクロールさせる。 */
#home > *{flex-shrink:0;position:relative;z-index:1}
/* 居酒屋の背景。文字が写真の上に直接乗ると読めないので、
   下半分を暗く落としてから文字を置く */
#homeBg,#homeGlow,#homeScrim{position:absolute;inset:0;z-index:0;pointer-events:none}
#homeBg{background-size:cover;background-position:center center;
  filter:brightness(1.12) saturate(1.08)}
/* 灯りは高架の鉄骨ではなく、店先の提灯のあたりに置く。
   鉄骨の上に暖色をかけると、青い蛍光灯と喧嘩して色が濁る */
#homeGlow{background:radial-gradient(40% 17% at 33% 53%, rgba(255,150,80,.22), transparent 70%);
  animation:homeFlick 5.5s ease-in-out infinite}
@keyframes homeFlick{0%,100%{opacity:.85}45%{opacity:1}70%{opacity:.78}}
#homeScrim{background:
  linear-gradient(0deg, rgba(8,6,4,.94) 0px, rgba(8,6,4,.90) 170px,
    rgba(9,7,5,.78) 300px, rgba(10,8,6,.52) 420px, rgba(10,8,6,.22) 530px,
    rgba(10,8,6,0) 620px),
  /* 上は高架の腹。青を深くして、下の提灯の暖色と分ける */
  linear-gradient(180deg, rgba(12,26,44,.34) 0%, rgba(12,26,44,.14) 22%,
    rgba(12,26,44,0) 40%)}
/* 頭上を電車が通るあいだ、鉄骨の上を光が一度だけ流れる。
   写真そのものは動かさない(画面が揺れたようにしか見えないため) */
#homeTrain{position:absolute;left:0;right:0;top:0;height:46%;z-index:0;pointer-events:none;
  opacity:0;mix-blend-mode:screen;
  background:linear-gradient(100deg, rgba(150,200,255,0) 30%, rgba(160,205,255,.18) 42%,
    rgba(205,230,255,.30) 50%, rgba(160,205,255,.18) 58%, rgba(150,200,255,0) 70%);
  background-size:280% 100%;background-position:-70% 0}
#homeTrain.on{animation:trainPass var(--trainDur,13s) linear 1}
@keyframes trainPass{
  0%{opacity:0;background-position:-70% 0}
  16%{opacity:1}
  84%{opacity:1}
  100%{opacity:0;background-position:170% 0}
}
@media (prefers-reduced-motion:reduce){#homeTrain{display:none}}
#home{justify-content:flex-end}
#home h1{text-shadow:0 2px 14px rgba(0,0,0,.85),0 0 30px rgba(232,161,60,.4)}
#home .sub,#modeHint,#homeBest,#ver{text-shadow:0 1px 3px rgba(0,0,0,.95),0 0 9px rgba(0,0,0,.9),0 0 20px rgba(0,0,0,.75)}
.seg{background:rgba(16,10,6,.86)}
#voiceBtn,#bgmBtn{background:rgba(16,10,6,.86)}
#sndRow{display:flex;gap:8px;justify-content:center;align-items:center}
/* レベル選択: 18個並べると画面を埋めて絵が出せないので1行にまとめる */
#levels[hidden]{display:none}
#lvPick{display:flex;align-items:center;gap:10px;width:100%;max-width:340px;
  margin-top:10px;   /* 上の設定群と区切って「ここからが本編」のリズムを作る */
  background:rgba(16,10,6,.86);border:1px solid rgba(232,161,60,.45);border-radius:14px;padding:9px 11px}
#lvPick button{appearance:none;border:0;background:rgba(232,161,60,.22);color:#F6E7CB;
  width:40px;height:40px;border-radius:10px;font:inherit;font-size:17px;font-weight:700;
  flex:0 0 auto;cursor:pointer;touch-action:manipulation}
#lvPick button:active{background:var(--amber);color:#221503}
#lvPick button:disabled{opacity:.32}
#lvPick .now{flex:1;text-align:center;color:#D9C6A6;font-size:12px;line-height:1.35;letter-spacing:.04em}
#lvPick .now b{display:block;font-size:15px;color:#FFC059;letter-spacing:.06em}
#lvPick .now i{font-style:normal;color:#E8A13C;font-size:11px}
/* 画面の低い端末では詰めて、スクロールせずに「はじめる」まで届かせる */
@media (max-height:800px){
  #home{gap:8px}
  #home h1{font-size:clamp(26px,7.5vw,34px)}
  #levels{gap:4px}
  #home .sub{font-size:12px}
}
#home h1{
  font-family:"Shippori Mincho B1",serif;font-weight:800;
  font-size:clamp(32px,9.5vw,46px);letter-spacing:.06em;line-height:1.1;text-wrap:balance;
}
#home h1 em{font-style:normal;color:var(--amber)}
#home .sub{color:var(--mut);font-size:13px;letter-spacing:.14em}
.seg{display:flex;border:1px solid var(--wood-hi);border-radius:999px;overflow:hidden;background:var(--wood)}
.seg button{appearance:none;border:0;background:transparent;color:var(--mut);
  font:inherit;font-size:13px;font-weight:500;padding:10px 16px;cursor:pointer}
.seg button.on{background:var(--amber);color:#221503;font-weight:700}
/* 押した瞬間に反応を返す。触れてから色が変わるまでの間があると遅く感じる */
button{touch-action:manipulation}
.seg button:active{background:rgba(232,161,60,.34)}
#voiceBtn:active,#bgmBtn:active{transform:scale(.94)}
#levels .lvbtns button:active{transform:scale(.88);background:var(--amber);color:#221503}
#modeHint{color:var(--mut);font-size:12px;line-height:1.6;max-width:300px}
#voiceBtn,#bgmBtn{appearance:none;cursor:pointer;font:inherit;font-size:12px;letter-spacing:.08em;
  color:var(--mut);background:var(--wood);border:1px solid var(--wood-hi);border-radius:999px;padding:8px 16px}
/* ONでも塗りつぶさない。塗りのアンバーは「はじめる」だけにして視線を取り合わない */
#voiceBtn.on{color:var(--amber);background:rgba(232,161,60,.16);border-color:var(--amber);font-weight:700}
#levels{display:flex;flex-direction:column;gap:5px;width:100%;max-width:320px}
.lvrow{display:flex;align-items:center;gap:8px;justify-content:space-between}
.lvname{color:var(--mut);font-size:11px;letter-spacing:.04em;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;flex:1;text-align:left}
.lvbtns{display:flex;gap:5px;flex:0 0 auto}
#levels .lvbtns button{
  appearance:none;cursor:pointer;width:30px;height:30px;border-radius:8px;
  border:1px solid var(--wood-hi);background:var(--wood);color:var(--mut);
  font:inherit;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;
}
#levels .lvbtns button.sel{background:var(--amber);color:#221503;border-color:var(--amber)}
#levels .lvbtns button.clear{border-color:var(--amber-deep);color:var(--amber)}
#levels .lvbtns button:disabled{opacity:.32;cursor:default}
#startBtn{
  appearance:none;border:0;cursor:pointer;
  font-family:"Shippori Mincho B1",serif;font-weight:800;font-size:20px;letter-spacing:.14em;
  color:#221503;background:linear-gradient(180deg,#F1B054,var(--amber-deep));
  padding:16px 44px;border-radius:16px;
  box-shadow:0 6px 0 #7A4A0C,0 10px 24px rgba(0,0,0,.5);
}
#startBtn:active{transform:translateY(4px);box-shadow:0 2px 0 #7A4A0C}
#homeBest{color:var(--mut);font-size:12px;line-height:1.8;font-variant-numeric:tabular-nums}
#homeBest b{color:var(--cream);font-weight:700}
#ver{color:#5d5142;font-size:10px;letter-spacing:.1em;padding-bottom:4px}

/* ---------- ゲーム(背景3種) ---------- */
#game{background:var(--ink)}
#game[data-bg="dining"]{background:
  radial-gradient(60% 26% at 50% 0%, rgba(240,190,110,.22), transparent 70%),
  radial-gradient(42% 17% at 14% 6%, rgba(232,161,60,.13), transparent 70%),
  linear-gradient(180deg,#241A11 0%, #1B140D 60%, #17120E 100%)}
#game[data-bg="living"]{background:
  radial-gradient(50% 30% at 8% 30%, rgba(90,140,200,.16), transparent 70%),
  radial-gradient(50% 22% at 78% 4%, rgba(232,161,60,.15), transparent 70%),
  linear-gradient(180deg,#20180F 0%, #191209 60%, #15100B 100%)}
#game[data-bg="counter"]{background:
  linear-gradient(180deg, rgba(255,170,80,.10) 0 34%, transparent 34%),
  radial-gradient(40% 16% at 26% 2%, rgba(255,180,90,.22), transparent 70%),
  radial-gradient(40% 16% at 74% 2%, rgba(255,180,90,.18), transparent 70%),
  linear-gradient(180deg,#241809 0%, #1A1108 100%)}
#game[data-bg="robata"]{background:
  radial-gradient(26% 12% at 14% 8%, rgba(220,60,40,.34), transparent 70%),
  radial-gradient(26% 12% at 86% 6%, rgba(220,60,40,.26), transparent 70%),
  radial-gradient(50% 20% at 50% 96%, rgba(255,120,30,.22), transparent 70%),
  linear-gradient(180deg,#150F0A 0%, #241509 100%)}
#game[data-bg="oldrobata"]{background:
  radial-gradient(44% 18% at 50% 98%, rgba(255,110,25,.30), transparent 70%),
  repeating-linear-gradient(0deg, rgba(0,0,0,.14) 0 18px, rgba(255,220,170,.02) 18px 20px),
  linear-gradient(180deg,#1B1409 0%, #241A0C 100%)}
#game[data-bg="robata"]::before,#game[data-bg="oldrobata"]::before{
  content:"";position:absolute;left:0;right:0;bottom:0;top:auto;height:26%;pointer-events:none;z-index:0;
  background:radial-gradient(60% 100% at 50% 100%, rgba(255,130,30,.16), transparent 70%);
  animation:ember 3.4s ease-in-out infinite;
}
@keyframes ember{0%,100%{opacity:.55}50%{opacity:1}}
#game[data-bg="izakaya"]{background:
  repeating-linear-gradient(90deg, rgba(0,0,0,.16) 0 22px, rgba(255,225,170,.03) 22px 24px),
  radial-gradient(45% 18% at 22% 3%, rgba(255,150,60,.20), transparent 70%),
  radial-gradient(45% 18% at 78% 3%, rgba(255,150,60,.16), transparent 70%),
  linear-gradient(180deg,#1E140C 0%, #170F08 100%)}
#game[data-bg="living"]::before{
  content:"";position:absolute;left:0;top:22%;width:32%;height:26%;pointer-events:none;
  background:radial-gradient(closest-side, rgba(120,170,235,.10), transparent);
  animation:tvFlicker 2.8s steps(6) infinite;
}
@keyframes tvFlicker{0%,100%{opacity:.5}30%{opacity:.9}55%{opacity:.65}80%{opacity:1}}

/* レベル差分(別紙3.1): 背景を作り直さず、照明と環境演出を重ねて段階を作る */
#game::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:1;
  transition:opacity .3s;opacity:0}
#game[data-stage="2"]::after{opacity:1;background:rgba(6,4,2,.30)}
#game[data-stage="3"]::after{opacity:1;
  background:radial-gradient(120% 60% at 50% 110%, rgba(255,150,40,.16), transparent 60%),
             rgba(6,4,2,.42)}
/* 3段階目だけ、立ちのぼる湯気・煙 */
#smoke{position:absolute;inset:0;pointer-events:none;z-index:2;display:none;opacity:.5}
#game[data-stage="3"] #smoke{display:block}
/* EX: 深夜。照明を落として色を抜く */
#game.ex::after{opacity:1;background:rgba(4,3,8,.42)}
#game.ex .chara, #game.ex #photoChara{filter:saturate(.82) brightness(.9)}
#smoke i{position:absolute;bottom:26%;width:70px;height:70px;border-radius:50%;
  background:radial-gradient(circle, rgba(255,240,220,.30), transparent 65%);
  animation:rise2 7s ease-in infinite}
#smoke i:nth-child(1){left:14%;animation-delay:0s}
#smoke i:nth-child(2){left:46%;animation-delay:2.4s}
#smoke i:nth-child(3){left:74%;animation-delay:4.6s}
@keyframes rise2{0%{transform:translateY(0) scale(.6);opacity:0}
                 25%{opacity:.55}
                 100%{transform:translateY(-190px) scale(1.5);opacity:0}}
/* シーンモード: Gemini画像の人物+グラスがそのまま舞台になる */
#game.scene #charaArea{flex:0 0 0;min-height:0}
#game.scene #bubble{top:calc(env(safe-area-inset-top,0px) + 14px);right:6%}
#game.scene #telemark{top:40vh;bottom:auto;right:14%}
#charaArea{flex:0 0 24%;position:relative;display:flex;align-items:flex-end;justify-content:center}
#charaArea.has-photo{flex:0 0 30%}
/* Gemini生成の人物。表情はbackground-imageの差し替えで切り替える */
.photo-chara{
  position:absolute;left:0;right:0;top:0;bottom:-10%;display:none;
  background-size:auto 100%;background-position:center top;background-repeat:no-repeat;
  -webkit-mask-image:linear-gradient(180deg,#000 0 68%,transparent 100%);
          mask-image:linear-gradient(180deg,#000 0 68%,transparent 100%);
}
.photo-chara.on{display:block}
/* 演出動作: 胴体だけ揺らす。グラス当たり判定は動かさない(SPEC 10.5 DecorativeRoot) */
.chara.decor-sway{animation:decorSway var(--sway-dur,2.6s) ease-in-out infinite alternate}
@keyframes decorSway{from{transform:translateX(calc(var(--sway-amp,10px) * -1)) rotate(-1deg)}
                     to{transform:translateX(var(--sway-amp,10px)) rotate(1deg)}}
.chara{width:min(72%,300px);height:100%;display:none}
.chara.on{display:block}
.chara.tele,.photo-chara.tele{animation:lean .5s ease-in-out infinite alternate}
@keyframes lean{from{transform:translateX(0)}to{transform:translateX(4px)}}
#bubble{
  position:absolute;top:6%;right:3%;max-width:58%;
  background:var(--cream);color:#221503;
  font-weight:700;font-size:clamp(14px,4.2vw,18px);letter-spacing:.03em;line-height:1.4;
  padding:9px 14px;border-radius:15px;border-bottom-left-radius:2px;
  opacity:0;transform:translateY(6px) scale(.92);transform-origin:left bottom;
  transition:opacity .18s ease,transform .18s ease;z-index:3;
}
#bubble.on{opacity:1;transform:none}
#telemark{
  position:absolute;bottom:4%;right:16%;z-index:3;
  font-family:"Shippori Mincho B1",serif;font-weight:800;font-size:30px;color:var(--red);
  text-shadow:0 0 10px rgba(201,80,60,.5);
  opacity:0;transform:scale(.6);transition:opacity .12s,transform .12s;
}
#telemark.on{opacity:1;transform:scale(1)}
/* 泡メーターはグラスの縁に重ならないよう、舞台の外(操作エリア)に置く */
#foamChip{
  flex:0 0 auto;
  display:flex;align-items:center;gap:8px;opacity:0;transition:opacity .18s;
  background:rgba(13,9,5,.82);border:1px solid var(--wood-hi);border-radius:999px;
  padding:6px 14px;font-size:12px;letter-spacing:.08em;color:var(--mut);white-space:nowrap;
}
#foamChip.on{opacity:1}
/* 注ぎを止めている間の「まだ注ぎ足せる」表示 */
#waitBar{
  position:absolute;left:50%;transform:translateX(-50%);
  bottom:calc(26% + 8px);z-index:5;opacity:0;transition:opacity .15s;
  background:rgba(13,9,5,.86);border:1px solid var(--wood-hi);border-radius:999px;
  padding:7px 16px;display:flex;align-items:center;gap:9px;white-space:nowrap;
}
#waitBar.on{opacity:1}
#waitBar span{font-size:12px;letter-spacing:.06em;color:var(--cream)}
#waitBar .track{width:74px;height:5px;border-radius:99px;background:var(--wood);overflow:hidden}
#waitBar .track i{display:block;height:100%;width:100%;background:var(--amber);
  transform-origin:left;transition:transform .06s linear}
#foamChip b{font-weight:700;font-size:13px}
#foamChip.good b{color:var(--amber)}
#foamChip.bad b{color:var(--red)}
#foamBar{width:76px;height:6px;border-radius:99px;background:var(--wood);position:relative}
#foamBar .zone{position:absolute;top:0;bottom:0;background:rgba(232,161,60,.55);border-radius:99px}
#foamBar i{position:absolute;top:-3px;width:4px;height:12px;border-radius:2px;
  background:var(--cream);margin-left:-2px;box-shadow:0 0 4px rgba(0,0,0,.6)}
#hud{
  position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:12px;z-index:3;
  color:var(--mut);font-size:12px;letter-spacing:.08em;font-variant-numeric:tabular-nums;
  text-shadow:0 1px 3px rgba(0,0,0,.9),0 0 10px rgba(0,0,0,.6);
}
#hud b{color:var(--amber);font-weight:700}
#cv{flex:1 1 auto;min-height:0;width:100%;display:block}
#controls{flex:0 0 23%;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;z-index:2;
  gap:8px;padding:8px 18px calc(env(safe-area-inset-bottom,0px) + 14px)}
#pourBtn{
  appearance:none;border:0;cursor:pointer;touch-action:none;
  width:100%;max-width:340px;flex:1 1 auto;max-height:106px;min-height:70px;border-radius:18px;
  font-family:"Shippori Mincho B1",serif;font-weight:800;font-size:25px;letter-spacing:.45em;text-indent:.45em;
  color:#221503;background:linear-gradient(180deg,#F1B054,var(--amber-deep));
  box-shadow:0 7px 0 #7A4A0C,0 12px 26px rgba(0,0,0,.5);
}
#pourBtn:active,#pourBtn.down{transform:translateY(5px);box-shadow:0 2px 0 #7A4A0C}
#pourBtn:disabled{filter:grayscale(.7) brightness(.6);transform:none;box-shadow:0 7px 0 #4a3c26}
#tiltGuide{width:100%;max-width:340px;text-align:center;color:var(--mut);
  font-size:13px;letter-spacing:.08em;line-height:1.7}
#tiltGuide .bar{height:8px;border-radius:99px;background:var(--wood);margin-top:9px;overflow:hidden}
#tiltGuide .bar i{display:block;height:100%;width:0%;background:var(--amber)}

/* 表情切替(全キャラ共通) */
.chara [data-f]{display:none}
.chara[data-face="neutral"] [data-f="neutral"],
.chara[data-face="call"]    [data-f="call"],
.chara[data-face="watch"]   [data-f="watch"],
.chara[data-face="tele"]    [data-f="tele"],
.chara[data-face="happy"]   [data-f="happy"],
.chara[data-face="meh"]     [data-f="meh"],
.chara[data-face="shock"]   [data-f="shock"],
.chara[data-face="angry"]   [data-f="angry"],
.chara[data-face="drunk"]   [data-f="drunk"],
.chara[data-face="low"]     [data-f="low"]{display:inline}

/* ---------- レベル導入 ---------- */
#intro{
  position:absolute;inset:0;z-index:6;display:none;flex-direction:column;
  align-items:center;justify-content:center;gap:8px;
  background:var(--ink);text-align:center;
}
#intro.on{display:flex}
#introLv{color:var(--amber);font-size:14px;letter-spacing:.4em;text-indent:.4em;font-variant-numeric:tabular-nums}
#introName{font-family:"Shippori Mincho B1",serif;font-weight:800;font-size:40px;letter-spacing:.1em}
#introPlace{color:var(--mut);font-size:14px;letter-spacing:.2em}
#introInfo{margin-top:12px;font-size:12px;color:var(--mut);letter-spacing:.12em;line-height:1.9}
#introInfo b{color:var(--cream);font-weight:700}

/* ---------- 結果 ---------- */
#result{
  position:absolute;inset:0;display:none;flex-direction:column;align-items:center;
  justify-content:flex-end;z-index:5;
  background:linear-gradient(180deg,transparent 0%,rgba(10,7,4,.55) 30%,rgba(10,7,4,.93) 62%);
  padding:0 24px calc(env(safe-area-inset-bottom,0px) + 18px);
}
#result.on{display:flex}
#clearTag{color:var(--amber);font-size:13px;letter-spacing:.34em;text-indent:.34em;
  margin-bottom:6px;font-variant-numeric:tabular-nums;display:none}
#clearTag.on{display:block}
#verdict{
  font-family:"Shippori Mincho B1",serif;font-weight:800;
  font-size:clamp(38px,11vw,54px);letter-spacing:.08em;text-align:center;text-wrap:balance;
  animation:stamp .28s cubic-bezier(.2,1.6,.4,1) both;
  position:relative;
}
/* 成功したときだけ、判定の字の後ろに提灯のような光を灯す */
#result.ok #verdict::before{
  content:"";position:absolute;inset:-46px -90px;z-index:-1;border-radius:50%;
  background:radial-gradient(50% 50%,rgba(232,161,60,.26),transparent 70%);
}
@keyframes stamp{from{opacity:0;transform:scale(1.7) rotate(-4deg)}to{opacity:1;transform:none}}
#verdict.bad{color:var(--red)} #verdict.top{color:var(--amber)}
#resMeta{margin-top:8px;color:var(--mut);font-size:14px;letter-spacing:.06em;text-align:center;
  line-height:1.8;font-variant-numeric:tabular-nums}
#resMeta b{color:var(--cream)}
#resScore{margin-top:4px;font-variant-numeric:tabular-nums;font-size:14px;color:var(--mut);text-align:center}
#resScore b{font-size:28px;color:var(--cream);font-family:"Shippori Mincho B1",serif}
#resParts{display:block;font-size:11px;color:var(--mut);margin-top:3px;letter-spacing:.08em}
#newBest{color:var(--amber);font-size:12px;letter-spacing:.2em;margin-top:2px;display:none}
#newBest.on{display:block;animation:bestPulse .55s ease}
@keyframes bestPulse{0%{transform:scale(1)}40%{transform:scale(1.28)}100%{transform:scale(1)}}
#nextBtn,#retryBtn{
  appearance:none;border:0;cursor:pointer;margin-top:16px;
  width:100%;max-width:340px;padding:16px 0;border-radius:16px;
  font-family:"Shippori Mincho B1",serif;font-weight:800;font-size:22px;letter-spacing:.24em;text-indent:.24em;
  color:#221503;background:linear-gradient(180deg,#F1B054,var(--amber-deep));
  box-shadow:0 6px 0 #7A4A0C,0 10px 24px rgba(0,0,0,.5);
}
#nextBtn:active,#retryBtn:active{transform:translateY(4px);box-shadow:0 2px 0 #7A4A0C}
#retryBtn.sub{
  margin-top:12px;padding:11px 0;font-size:16px;color:var(--cream);
  background:var(--wood);box-shadow:none;border:1px solid var(--wood-hi);
}
#toHome{appearance:none;border:0;background:transparent;cursor:pointer;margin-top:6px;
  color:var(--mut);font:inherit;font-size:12px;letter-spacing:.2em;
  padding:12px 20px;   /* 指で押せる高さを確保する */
  text-decoration:underline;text-underline-offset:4px}

#debug{position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);right:8px;display:none;
  background:rgba(0,0,0,.62);border:1px solid var(--wood-hi);border-radius:8px;
  padding:8px 10px;font-size:11px;line-height:1.7;color:#b9e0a2;
  font-family:ui-monospace,monospace;white-space:pre;z-index:9}
#debug.on{display:block}
#notice{position:absolute;left:50%;top:32%;transform:translateX(-50%);
  background:rgba(10,7,4,.92);border:1px solid var(--wood-hi);color:var(--cream);
  font-size:13px;letter-spacing:.04em;padding:10px 16px;border-radius:10px;line-height:1.6;
  opacity:0;pointer-events:none;transition:opacity .2s;max-width:86%;text-align:center;z-index:8}
#notice.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.001s!important}}

const FOAM_ORDERS = {
  normal:{ideal:[0.15,0.25],accept:[0.05,0.40],label:'普通'},
  foamy:{ideal:[0.28,0.40],accept:[0.20,0.48],label:'泡多め'},
  // ママLEVEL 1は「指定なし」(別紙§4.1)。泡で減点せず、注ぐ・止めるだけを教える
  any:  {ideal:[0.05,0.45],accept:[0.02,0.55],label:'指定なし'},
};
/* レベルごとの実効的な泡の注文。foamTight(1未満)を持つレベルは
   「ちょうど」の幅が中心に向かって狭くなる。速さだけだと後半の
   難しさの伸びが感じられないので、泡にも要求を持たせる */
function foamOrder(lvl){
  const o=FOAM_ORDERS[(lvl&&lvl.order)||'normal'];
  const t=(lvl&&lvl.foamTight)||1;
  if(t>=1) return o;
  const c=(o.ideal[0]+o.ideal[1])/2, h=(o.ideal[1]-o.ideal[0])/2*t;
  return {ideal:[c-h,c+h],accept:o.accept,label:o.label};
}

/* 別紙仕様書 §3 レベル進行一覧 (LEVEL 1〜9) */
/* 注ぎをやめてから判定までの猶予。前半はゆっくり泡を待って注ぎ足せるが、
   後半の客はせっかちで、待ってくれない。速さと並ぶ体感の難しさの柱 */
function graceOf(lvl){ if(lvl.ex) return lvl.grace; return clamp(2.3-0.08*lvl.lv, 0.9, 2.2); }
/* 合格ライン。速さや猶予は数字で見せても体感に残らなかったので、
   「同じ注ぎ方でも上のレベルほど点が辛い」を判定そのものに持たせる。
   LV1は78%で合格・90%でいい一杯、LV18は92%・96.5%。満点の98.5%は共通 */
function bandOf(lvl){
  const t=clamp((lvl.lv-1)/17,0,1);
  return {min:lerp(0.78,0.92,t), great:lerp(0.90,0.965,t)};
}
/* 注ぎ止めの遅れ。手を離しても瓶の口から少し垂れる。前半は無く、
   LV4から増えてLV18で0.2秒。上のレベルほど早めに止める必要がある */
function stopLag(lvl){
  if(lvl.lv<=3) return 0;
  return lerp(0.06,0.20,clamp((lvl.lv-4)/14,0,1));
}

/* ---------- EX「無理杯」 LEVEL 19〜 (LEVELS.md §7) ----------
   通常編の18人が強化されて再登場する。終端はないが、表示される各レベルは必ず
   勝てる。同じレベルは同じパターン(動作の位置・向き・偽予兆)で再挑戦できるよう、
   乱数はレベル番号から決める */
const EX_START=19;
const EX_CHARS=['tonari','yopparai','senpai','ojisan','taisho','shacho','tomodachi','toorisugari',
                'boss','okami','shujin','yoitsubure','papa','oji','musuko','mama','obaa','ojiichan'];
function exRng(seed){ let a=(seed*2654435761)>>>0; return ()=>{ a=(a+0x6D2B79F5)>>>0; let t=a; t=Math.imul(t^(t>>>15),t|1); t^=t+Math.imul(t^(t>>>7),t|61); return ((t^(t>>>14))>>>0)/4294967296; }; }
/* EXで解禁する動作。見た目の向きは演出、効くのは取り込み率 */
const EX_MOVES=[
  {type:'shift',    name:'二度引き',       mag:44, intake:0.30},
  {type:'shift',    name:'手を持ち替える', mag:56, intake:0.20},
  {type:'lower',    name:'乾杯フェイント', mag:36, intake:0.30},
  {type:'shift',    name:'テーブル接触',   mag:30, intake:0.35},
  {type:'shiftrot', name:'しゃっくり連発', mag:40, rot:4, intake:0.25},
];
const EX_HINTS={
  A:['予兆(！)が出たら止める。止めれば動作は空振りになる','止めてから0.5秒以内に注ぎ直せば同じ一杯として続く(刻み注ぎ)','前半は押しっぱなし、80%からは短く押す'],
  B:['合図の直後は注がない','グラスが戻ってから注ぐ','待つのも技術。'],
  C:['動作は2回来る。1回目をかわしても油断しない','2回目の予兆は短い。80%を超えたら短く押す','予兆のたびに止めて、動作だけ消費させる'],
  D:['肩だけ動くのは偽物。！が出たときだけ止める','泡が増えやすい。短く押して待つ','速いグラスは最初から短く押す'],
};
const exCache={};
function exLevel(n){
  if(exCache[n]) return exCache[n];
  const rnd=exRng(n);
  const pool=EX_MOVES.slice();
  const pick=arr=>{ if(arr===EX_MOVES){ if(!pool.length) pool.push(...EX_MOVES); return pool.splice(Math.floor(rnd()*pool.length),1)[0]; } return arr[Math.floor(rnd()*arr.length)]; };
  const stage = n===20?'B' : n<=21?'A' : n<=24?'C' : n<=29?'D' : 'E';
  // 30以上は数値を悪化させず、25〜29の帯の組み合わせを変える
  const band = stage==='E' ? 'D' : stage;
  const ch = stage==='B' ? 'yopparai' : EX_CHARS[(n-EX_START)%EX_CHARS.length];
  const base=LEVELS.find(l=>l.ch===ch);
  const mk=(m,tel,trig,extra)=>Object.assign({},m,{tel,trig,trigFixed:trig[0]+rnd()*(trig[1]-trig[0]),
    mag:m.mag*(rnd()<0.5?1:-1)},extra||{});
  let hazards=[], fake=null, fillSec=+(Math.max(3.0,base.fillSec*0.85)).toFixed(1), foamMult=base.foamMult,
      foamTight=0.6, pulse=false, glassNote='', pull=null, exName='まだいける';
  if(band==='A'){
    fillSec=+(Math.max(3.0,base.fillSec*0.9)).toFixed(1);
    hazards=[mk(pick(EX_MOVES), n===19?0.45:0.42, [0.86,0.90])];
  } else if(band==='B'){
    exName='超酔っ払い'; fillSec=4.0;
    pull={at:0.30, dur:0.65};                       // 合図直後にグラスを引く固定イベント
    hazards=[mk(EX_MOVES[4], 0.40, [0.88,0.91])];
  } else if(band==='C'){
    exName='かなり無理';
    const tel2=[0.36,0.34,0.32][Math.min(n-22,2)] || 0.32;
    hazards=[mk(pick(EX_MOVES),0.40,[0.68,0.76]), mk(pick(EX_MOVES),tel2,[0.88,0.92])];
    foamTight=0.55;
  } else { // D / E
    exName = stage==='E' ? '無理杯' : 'ほぼ無理';
    const k = stage==='E' ? (n-30)%5 : n-25;         // 0..4 で組み合わせを回す
    const count = k>=2 ? 3 : 2;
    const tiny = (k%2===0);                          // 極小(速い)グラス と 巨大ジョッキ を交互に
    fillSec = tiny ? +(Math.max(2.2,base.fillSec*0.6)).toFixed(1) : 9.0;
    glassNote = tiny ? '極小グラス' : '巨大ジョッキ';
    foamMult = +(base.foamMult*1.25).toFixed(2);   // 泡急増 +25%
    pulse = k>=3;                                    // 流量脈動 ±10%
    fake={at:[0.55,0.65], atFixed:0.55+rnd()*0.10, dur:0.45};
    const trigs = count===3 ? [[0.60,0.68],[0.78,0.84],[0.89,0.92]] : [[0.72,0.78],[0.88,0.92]];
    hazards = trigs.map((t,i)=>mk(pick(EX_MOVES), i===0?0.38:0.34-0.01*i, t, i===count-1?{maxTrig:0.93}:null));
    foamTight=0.5;
  }
  const lvl={lv:n, ch, glass:base.glass, fillSec, foamMult, order:'normal', foamTight,
    // 揺れは本物(瓶を傾きで追わないと入らない)。19・20は無し、21から段階的に
    sway:{period:2.8}, swayScale: n<=20?0.35 : n===21?0.6 : n<=24?0.8 : 1.0, decorSway:0,
    hazard:hazards[0]||null, hazards, fake, pull, pulse, ex:true, exName, exStage:band,
    grace: band==='A'||band==='B' ? 1.1 : band==='C' ? 1.0 : 0.9,
    glassNote, hints:EX_HINTS[band]};
  exCache[n]=lvl;
  return lvl;
}

};

/* ---------- 音: 気泡共鳴モデルによる液体音合成 ----------
   液体音の主成分は無数の気泡の減衰チャープ(van den Doel の物理モデル)。
   気泡層 + 低域ゴボゴボ + 高域シュワ + 水位で上がる容器共鳴の4層。 */
const Snd = {
  ctx:null, master:null,
  gStream:null, fStream:null,      // ストリームの乱流
  gCav:null, fCav:null,            // 容器の共鳴(水位で上がる)
  _glugAt:0, _crackAt:0, _bubAt:0,
  amb:null,                        // ホーム画面の店の空気(合成。音源ファイルは持たない)
  init(){
    if(this.ctx) return;
    try{
      const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
      this.ctx=new AC();
      this.master=this.ctx.createGain(); this.master.gain.value=1;
      this.master.connect(this.ctx.destination);
      this.noiseBuf=(()=>{
        const len=this.ctx.sampleRate*2;
        const b=this.ctx.createBuffer(1,len,this.ctx.sampleRate);
        const ch=b.getChannelData(0);
        for(let i=0;i<len;i++) ch[i]=Math.random()*2-1;
        return b;
      })();
      const loopNoise=()=>{
        const s=this.ctx.createBufferSource(); s.buffer=this.noiseBuf; s.loop=true; s.start(); return s;
      };
      // 落下するビールが液面を叩く乱流ノイズ
      this.fStream=this.ctx.createBiquadFilter();
      this.fStream.type='bandpass'; this.fStream.frequency.value=1400; this.fStream.Q.value=0.5;
      this.gStream=this.ctx.createGain(); this.gStream.gain.value=0;
      loopNoise().connect(this.fStream).connect(this.gStream).connect(this.master);
      // グラス内の空気柱共鳴。液面が上がるほど高くなる=満杯が耳で分かる
      this.fCav=this.ctx.createBiquadFilter();
      this.fCav.type='bandpass'; this.fCav.frequency.value=200; this.fCav.Q.value=7;
      this.gCav=this.ctx.createGain(); this.gCav.gain.value=0;
      loopNoise().connect(this.fCav).connect(this.gCav).connect(this.master);
    }catch(e){}
  },
  resume(){ if(this.ctx&&this.ctx.state!=='running'){ try{ this.ctx.resume().catch(()=>{}); }catch(e){} } },

  /* 瓶口から空気が入る「ゴボッ」。連続ノイズではなく離散パルスで鳴らす */
  glug(nf){
    const t=this.ctx.currentTime;
    const dur=0.13+Math.random()*0.07;
    const f0=90+Math.random()*45+nf*30;
    const o=this.ctx.createOscillator(), g=this.ctx.createGain();
    o.type='sine';
    o.frequency.setValueAtTime(f0*1.5,t);
    o.frequency.exponentialRampToValueAtTime(f0,t+dur*0.8);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.16+nf*0.10,t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0008,t+dur);
    o.connect(g).connect(this.master); o.start(t); o.stop(t+dur+0.03);
    // ゴボッに混ざる短い破裂ノイズ
    const s=this.ctx.createBufferSource(); s.buffer=this.noiseBuf;
    s.playbackRate.value=0.6+Math.random()*0.5;
    const bf=this.ctx.createBiquadFilter(); bf.type='bandpass'; bf.frequency.value=420; bf.Q.value=1.4;
    const bg=this.ctx.createGain();
    bg.gain.setValueAtTime(0.10,t); bg.gain.exponentialRampToValueAtTime(0.0006,t+0.09);
    s.connect(bf).connect(bg).connect(this.master); s.start(t); s.stop(t+0.12);
  },
  /* 泡の炭酸がはじける音。ビールらしさの決め手。泡量に比例して鳴らす */
  crackle(amount){
    const t=this.ctx.currentTime+Math.random()*0.03;
    const dur=0.006+Math.random()*0.014;
    const s=this.ctx.createBufferSource(); s.buffer=this.noiseBuf;
    s.playbackRate.value=1.4+Math.random()*1.4;
    const f=this.ctx.createBiquadFilter();
    f.type='bandpass'; f.frequency.value=3600+Math.random()*5200; f.Q.value=3+Math.random()*4;
    const g=this.ctx.createGain();
    g.gain.setValueAtTime((0.05+Math.random()*0.10)*amount,t);
    g.gain.exponentialRampToValueAtTime(0.0004,t+dur);
    s.connect(f).connect(g).connect(this.master); s.start(t); s.stop(t+dur+0.02);
  },
  /* 液中を上る気泡: 音程が上がりながら消えるチャープ(液体音の物理モデル) */
  bubble(fill){
    const t=this.ctx.currentTime+Math.random()*0.02;
    const dur=0.025+Math.random()*0.05;
    const f0=(500+Math.random()*Math.random()*2000)*(1+fill*0.3);
    const o=this.ctx.createOscillator(), g=this.ctx.createGain();
    o.type='sine';
    o.frequency.setValueAtTime(f0,t);
    o.frequency.exponentialRampToValueAtTime(f0*1.5,t+dur);
    g.gain.setValueAtTime(0.010+Math.random()*0.022,t);
    g.gain.exponentialRampToValueAtTime(0.0004,t+dur);
    o.connect(g).connect(this.master); o.start(t); o.stop(t+dur+0.02);
  },
  /* 毎フレーム: nf=流量0..1 fill=充填率0..1 foam=泡比率0..1 */
  pour(nf,fill,foam,dt){
    if(!this.ctx) return;
    const t=this.ctx.currentTime;
    this.gStream.gain.setTargetAtTime(nf*0.085,t,0.05);
    this.fStream.frequency.setTargetAtTime(900+nf*1500,t,0.08);
    this.gCav.gain.setTargetAtTime(nf*0.30,t,0.05);
    this.fCav.frequency.setTargetAtTime(170+fill*700,t,0.09);
    if(nf<=0) return;
    // ゴボゴボ: 流量が多いほど間隔が短い
    if(t>this._glugAt){ this.glug(nf); this._glugAt=t+(0.30-nf*0.16)*(0.75+Math.random()*0.5); }
    // 炭酸のはじけ: 泡が多いほど密に
    const crackRate=40+foam*260+nf*60;
    this._crackAt+=dt*crackRate;
    let nc=Math.min(Math.floor(this._crackAt),6); this._crackAt-=nc;
    for(let i=0;i<nc;i++) this.crackle(0.5+foam*0.9);
    // 気泡
    this._bubAt+=dt*(12+nf*40);
    let nb=Math.min(Math.floor(this._bubAt),3); this._bubAt-=nb;
    for(let i=0;i<nb;i++) this.bubble(fill);
  },
  /* 注ぎを止めた後も泡がはじけ続ける余韻 */
  settleFizz(foam,dt){
    if(!this.ctx) return;
    const t=this.ctx.currentTime;
    this.gStream.gain.setTargetAtTime(0,t,0.06);
    this.gCav.gain.setTargetAtTime(0,t,0.08);
    this._crackAt+=dt*(30+foam*150);
    let nc=Math.min(Math.floor(this._crackAt),4); this._crackAt-=nc;
    for(let i=0;i<nc;i++) this.crackle(0.35+foam*0.6);
  },
  silence(){ if(!this.ctx) return;
    const t=this.ctx.currentTime;
    this.gStream.gain.setTargetAtTime(0,t,0.05);
    this.gCav.gain.setTargetAtTime(0,t,0.05);
  },
  blip(f,dur=0.09,type='square',vol=0.12,when=0){ if(!this.ctx) return;
    const t=this.ctx.currentTime+when;
    const o=this.ctx.createOscillator(),g=this.ctx.createGain();
    o.type=type;o.frequency.value=f;g.gain.setValueAtTime(vol,t);
    g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(g).connect(this.master);o.start(t);o.stop(t+dur+0.02);
  },
  call(){ this.blip(620,0.1,'square',0.1); this.blip(830,0.14,'square',0.1,0.11); },
  tele(){ this.blip(1500,0.06,'sine',0.09); this.blip(1500,0.06,'sine',0.07,0.12); },
  tick(){ this.blip(1250,0.05,'sine',0.07); },
  perfect(){ [660,830,990].forEach((f,i)=>this.blip(f,0.16,'sine',0.12,i*0.09)); },
  thud(){ if(!this.ctx) return;
    const t=this.ctx.currentTime;
    const s=this.ctx.createBufferSource(); s.buffer=this.noiseBuf; s.playbackRate.value=0.5;
    const f=this.ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=460;
    const g=this.ctx.createGain();
    g.gain.setValueAtTime(0.4,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.35);
    s.connect(f).connect(g).connect(this.master); s.start(t); s.stop(t+0.4);
  },
  ui(){ this.blip(980,0.05,'sine',0.06); },
};

/* ---------- 音声(端末TTS。日本語voiceを品質順に選択) ---------- */
/* 収録済みの声。tools/make_voice.py が VOICEVOX で作った voice/<キャラ>/<n>.m4a と
   voice/manifest.json を読む。無ければ端末の読み上げ(下のVoice)に落ちる */
const VoiceClips = {
  map:null, loading:false, bufs:{}, cur:null,
  load(){
    if(this.map||this.loading) return; this.loading=true;
    fetch('voice/manifest.json',{cache:'force-cache'}).then(r=>r.ok?r.json():null)
      .then(j=>{ this.map=j||{}; if(j&&j.credits&&j.credits.length){ document.getElementById('ver').textContent+='　声: VOICEVOX '+j.credits.join('・'); } })
      .catch(()=>{ this.map={}; });
  },
  get(chId,text){ const m=this.map&&this.map[chId]; return m ? m[text] : null; },
  /* 音の再生は Snd と同じ AudioContext を使う(最初のタップで起きている)。
     <audio> はiOSで操作外の再生を止められることがある */
  _id:0,
  play(chId,clip,onend,onfail){
    this.stop();
    const id=++this._id;
    const url='voice/'+chId+'/'+clip.f;
    const ctx=Snd.ctx;
    const fail=()=>{ if(id===this._id){ this.cur=null; (onfail||onend)(); } };
    if(!ctx){ const a=new Audio(url); this.cur=a;
      a.onended=()=>{ if(this.cur===a){ this.cur=null; onend(); } }; a.onerror=fail;
      a.play().catch(fail); return; }
    const start=buf=>{ if(id!==this._id) return;             // 止められた後に届いた分は流さない
      const src=ctx.createBufferSource(); src.buffer=buf; src.connect(Snd.master||ctx.destination);
      this.cur=src; src.onended=()=>{ if(this.cur===src){ this.cur=null; onend(); } }; src.start(); };
    if(this.bufs[url]){ start(this.bufs[url]); return; }
    fetch(url).then(r=>{ if(!r.ok) throw 0; return r.arrayBuffer(); }).then(ab=>ctx.decodeAudioData(ab))
      .then(buf=>{ this.bufs[url]=buf; start(buf); }).catch(fail);   // 読めない形式の端末は読み上げへ
  },
  stop(){ const c=this.cur; this.cur=null; if(!c) return; try{ c.stop ? c.stop() : c.pause(); }catch(e){} },
  prefetch(chId){ const m=this.map&&this.map[chId]; if(!m) return; Object.values(m).slice(0,12).forEach(c=>{ const url='voice/'+chId+'/'+c.f; if(!this.bufs[url]&&Snd.ctx) fetch(url).then(r=>r.arrayBuffer()).then(ab=>Snd.ctx.decodeAudioData(ab)).then(b=>{this.bufs[url]=b;}).catch(()=>{}); }); },
};
const Voice = {
  male:null, female:null, any:null,
  /* 端末の日本語音声を性別で振り分ける。名前で判定できない場合はピッチで補う */
  pick(){
    try{
      const vs=speechSynthesis.getVoices().filter(v=>/^ja/i.test(v.lang));
      if(!vs.length) return;
      const F=/kyoko|o-?ren|haruka|ayumi|sayaka|nanami|mizuki|female|女性|女/i;
      const M=/otoya|ichiro|hattori|daichi|keita|male|男性|男/i;
      const quality=v=>{
        let s=0;
        if(/premium|enhanced|neural|拡張|高品質/i.test(v.name)) s+=30;
        if(/google/i.test(v.name)) s+=20;
        if(v.localService) s+=5;
        return s;
      };
      const sorted=[...vs].sort((a,b)=>quality(b)-quality(a));
      this.females=sorted.filter(v=>F.test(v.name));
      this.males  =sorted.filter(v=>M.test(v.name));
      this.female=this.females[0]||null;
      this.male  =this.males[0]||null;
      this.any   =sorted[0]||null;
      // 片方しか無い端末では残りをanyで埋める
      if(!this.female) this.female=this.any;
      if(!this.male)   this.male=this.any;
    }catch(e){}
  },
  /* 字幕を出している間だけ true。端末の読み上げは呼んでから実際に声が出るまで
     間があり、onstart / onend を返さない端末もあるので、時間でも必ず打ち切る */
  _endBy:0, _done:true,
  active(){ return !this._done && performance.now() < this._endBy; },
  _gen:0,
  speak(text,ch){
    this._done=true; this._endBy=0;
    VoiceClips.stop();
    if(!Save.data.voice) return;
    const gen=++this._gen;                          // 古い声の終了通知で新しい字幕を消さない
    const done=()=>{ if(gen===this._gen) this._done=true; };
    // 収録済みの声があればそれを流す
    const chId=(ch||CHARS.papa).id;
    const clip=VoiceClips.get(chId,text);
    if(clip && !this._clipBroken){
      try{ speechSynthesis.cancel(); }catch(e){}
      this._endBy=performance.now()+((clip.d||2.0)*1000+400); this._done=false;
      VoiceClips.play(chId,clip,done,()=>{ if(gen!==this._gen) return; this._clipBroken=true; this._tts(text,ch,gen); });
      return;
    }
    this._tts(text,ch,gen);
  },
  _tts(text,ch,gen){
    const done=()=>{ if(gen===this._gen) this._done=true; };
    try{
      if(!('speechSynthesis' in window)) return;
      if(!this.any) this.pick();
      const c=ch||CHARS.papa;
      // 同じ性別の声が複数ある端末では、人物ごとに違う声を当てる
      const pool=(c.gender==='f')?(this.females||[]):(this.males||[]);
      const idx=Object.keys(CHARS).indexOf(c.id);
      const v=pool.length ? pool[Math.max(0,idx)%pool.length] : ((c.gender==='f')?this.female:this.male);
      const spoken=text.replace(/[（(][^)）]*[)）]/g,'').replace(/…/g,'').replace(/[ｚz]{2,}/g,'').replace(/の分/g,'のぶん').trim();
      if(!spoken){ this._done=true; return; }               // ト書きだけの台詞は声を出さない
      const u=new SpeechSynthesisUtterance(spoken);
      u.lang='ja-JP'; if(v) u.voice=v;
      // 選ばれた声が希望の性別でない場合はピッチを大きくずらして寄せる
      const nameF=/kyoko|o-?ren|haruka|ayumi|sayaka|nanami|mizuki|female|女/i;
      const gotF=v?nameF.test(v.name):false;
      let pitch=c.pitch;
      if(c.gender==='f'&&!gotF) pitch=Math.min(2.0,c.pitch+0.55);   // 男声しかない→高く
      if(c.gender==='m'&&gotF)  pitch=Math.max(0.1,c.pitch-0.35);   // 女声しかない→低く
      u.pitch=pitch; u.rate=c.rate; u.volume=1;
      // だいたいの読み上げ時間。開始待ちのぶんを足して上限にする
      const est = 700 + text.length*170/Math.max(c.rate,0.5);
      this._endBy = performance.now() + 1200 + est;
      this._done = false;
      u.onend = u.onerror = done;
      // 直前の読み上げを止めた直後に speak すると、端末によっては
      // 新しいほうが捨てられる。少し待ってから流す
      const wasSpeaking = speechSynthesis.speaking || speechSynthesis.pending;
      speechSynthesis.cancel();
      if(wasSpeaking) setTimeout(()=>{ try{speechSynthesis.speak(u);}catch(e){} }, 60);
      else speechSynthesis.speak(u);
    }catch(e){ this._done=true; }
  },
};

/* ホーム画面の音。音源ファイルは持たず、その場で合成する(0MB)。
   鳴らすのは頭上を通る電車だけ(オーナー指定)。店のざわめき・笑い声・
   グラス・注ぐ音は入れない。
   新橋の高架下は何本もの線が重なっていて、電車の音はほとんど途切れない。
   なので次の1本までを3〜9秒しか空けず、長さ・重さ・継ぎ目の間隔を毎回
   変えて、別の電車が来たように聞かせる */
Object.assign(Snd, {
  /* 電車に使うノイズ。白のままだと高い方が刺さって「サー」と鳴るので、
     ピンクに寄せた別のバッファを1本だけ作る(注ぎの効果音は白のまま) */
  pink(){
    if(this.pinkBuf) return this.pinkBuf;
    const sr=this.ctx.sampleRate, n=sr*3;
    const b=this.ctx.createBuffer(1,n,sr), d=b.getChannelData(0);
    let b0=0,b1=0,b2=0;
    for(let i=0;i<n;i++){
      const w=Math.random()*2-1;
      b0=0.99765*b0+w*0.0990460; b1=0.96300*b1+w*0.2965164; b2=0.57000*b2+w*1.0526913;
      d[i]=(b0+b1+b2+w*0.1848)*0.22;
    }
    return (this.pinkBuf=b);
  },
  ambStart(){
    if(!this.ctx || this.amb) return;
    const ctx=this.ctx, out=ctx.createGain(); out.gain.value=0;
    out.connect(this.master);
    const a={out, tTimer:null}; this.amb=a;
    out.gain.setTargetAtTime(0.45, ctx.currentTime, 1.2);   // ゆっくり立ち上げる
    const train=()=>{
      if(this.amb!==a) return;
      const dur=this.ambTrain();
      if(this.onAmbTrain) this.onAmbTrain(dur);             // 画面側へ知らせる
      a.tTimer=setTimeout(train, (dur+2+Math.random()*4)*1000);
    };
    a.tTimer=setTimeout(train, 900);
  },
  /* 頭上を通る電車。高架の下で聞くと、桁が鳴って低い轟音になり、
     レールの継ぎ目を越える打撃が「ガタン ゴトン」と乗る。近づいて遠ざかる
     ぶんは、轟音・擦れ・打撃の3つをまとめて同じ山なりで大きさを変えて出す。
     3回に1回は遠い線を通す(小さく、高い方を削る)。同じ音の繰り返しに
     聞こえないようにするため */
  ambTrain(){
    const ctx=this.ctx, out=this.amb?this.amb.out:this.master;
    const far=Math.random()<0.34;
    const t0=ctx.currentTime+0.1;
    const dur=(far?10:12)+Math.random()*4;
    const loud=(far?0.115:0.250)+Math.random()*0.055;
    const joint=1.05+Math.random()*0.45;                    // 継ぎ目の間隔=速さ
    const src=(t,d)=>{ const s=ctx.createBufferSource(); s.buffer=this.pink(); s.loop=true;
                       s.start(t); s.stop(t+d); return s; };
    /* 桁の轟音。低い方だけ通し、95Hz あたりを持ち上げて躯体の鳴りにする */
    const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=far?170:260;
    const pk=ctx.createBiquadFilter(); pk.type='peaking';
    pk.frequency.value=80+Math.random()*30; pk.Q.value=1.2; pk.gain.value=9;
    const g=ctx.createGain();
    g.gain.setValueAtTime(loud*0.02,t0);
    g.gain.exponentialRampToValueAtTime(loud,t0+dur*0.28);
    g.gain.setValueAtTime(loud,t0+dur*0.66);
    g.gain.exponentialRampToValueAtTime(loud*0.015,t0+dur);
    src(t0,dur+0.3).connect(lp).connect(pk).connect(g).connect(out);
    /* 車輪とレールの擦れ。真上に来たときだけ聞こえる */
    const bp=ctx.createBiquadFilter(); bp.type='bandpass';
    bp.frequency.value=1900+Math.random()*700; bp.Q.value=1.1;
    const g2=ctx.createGain();
    g2.gain.setValueAtTime(0.0001,t0);
    g2.gain.exponentialRampToValueAtTime(far?0.008:0.030,t0+dur*0.42);
    g2.gain.exponentialRampToValueAtTime(0.0001,t0+dur*0.95);
    src(t0,dur+0.3).connect(bp).connect(g2).connect(out);
    /* ガタン ゴトン。台車は前後2つあるので、2打1組が少し離れて2回続く */
    const env=x=> x<0.28 ? x/0.28 : x<0.66 ? 1 : Math.max(0,(1-x)/0.34);
    const hit=(far?0.045:0.115);
    for(let t=t0+dur*0.06; t<t0+dur*0.94; t+=joint){
      const v=hit*env((t-t0)/dur);
      if(v<=0.002) continue;
      this.ambClack(t,v); this.ambClack(t+0.085,v*0.75);
      this.ambClack(t+joint*0.49,v*0.9); this.ambClack(t+joint*0.49+0.085,v*0.68);
    }
    return dur;
  },
  /* 継ぎ目を越える一打。低い打撃に金属の当たりを重ねる */
  ambClack(t,v){
    const ctx=this.ctx, out=this.amb?this.amb.out:this.master;
    const src=(tt,d)=>{ const s=ctx.createBufferSource(); s.buffer=this.pink(); s.loop=true;
                        s.start(tt); s.stop(tt+d); return s; };
    const g=ctx.createGain();
    g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.16);
    const bp=ctx.createBiquadFilter(); bp.type='bandpass';
    bp.frequency.value=110+Math.random()*70; bp.Q.value=2.2;
    src(t,0.18).connect(bp).connect(g).connect(out);
    const g2=ctx.createGain();
    g2.gain.setValueAtTime(v*0.45,t); g2.gain.exponentialRampToValueAtTime(0.0001,t+0.05);
    const bp2=ctx.createBiquadFilter(); bp2.type='bandpass';
    bp2.frequency.value=900+Math.random()*800; bp2.Q.value=1.5;
    src(t,0.07).connect(bp2).connect(g2).connect(out);
  },
  ambStop(){
    const a=this.amb; if(!a) return;
    this.amb=null;
    if(a.tTimer) clearTimeout(a.tTimer);
    try{ a.out.gain.setTargetAtTime(0,this.ctx.currentTime,0.25); }catch(e){}
    setTimeout(()=>{ try{ a.out.disconnect(); }catch(e){} },1500);
  },
});

/* ---------- シミュレーション §7 ---------- */
function newSim(cap){
  return {C:cap, L:0,P:0,W:0,Q:0,target:0, poured:false, zeroT:0, ovf:0, out:null,
          prevF:0, cue95:false, fHist:[]};
}
/* env: {Qmax, foamMult, intake} intake=ストリーム取り込み率(攻略動作で低下) */
function simStep(s,dt,env){
  if(s.target>s.Q){ s.Q=Math.min(s.target, s.Q+(env.Qmax/CFG.RAMP)*dt); }
  else if(env.lag>0){ s.Q=Math.max(s.target, s.Q-(env.Qmax/env.lag)*dt); }   // 止めの遅れ
  else { s.Q=s.target; }
  if(s.Q>0){ s.poured=true; s.zeroT=0; }
  else if(s.poured && !env.hold){ s.zeroT+=dt; }    // 予兆・妨害の間は数えない

  if(s.Q>0 && !s.out){
    const dV=s.Q*dt;
    const dIn=dV*env.intake, dMiss=dV-dIn;
    const nf=clamp(s.Q/env.Qmax,0,1);
    const foamRate=clamp(lerp(CFG.FOAM_LO,CFG.FOAM_HI,Math.pow(nf,CFG.FOAM_EXP))*env.foamMult,0,0.6);
    s.L+=dIn*(1-foamRate);
    s.P+=dIn*foamRate*CFG.FOAM_EXPANSION;
    s.W+=dMiss;                                   // 外したぶんはこぼれ §7.4
  }
  const dec=s.P*CFG.FOAM_DECAY*dt;
  s.P-=dec; s.L+=dec*CFG.FOAM_RETURN;

  const tot=s.L+s.P;
  if(tot>s.C && !s.out){
    let ex=tot-s.C;
    const fromP=Math.min(ex,s.P); s.P-=fromP; s.L-=(ex-fromP);
    s.ovf+=ex; s.W+=ex;
    if(s.ovf>CFG.OVF_GRACE*s.C) s.out='OVERFLOW';
  }
  if(!s.out && s.W>=CFG.SPILL_OUT*s.C) s.out='SPILL';

  const F=(s.L+s.P)/s.C;
  s.fHist.push(F); if(s.fHist.length>19) s.fHist.shift();   // 直近0.15秒 §10.5
  if(!s.cue95 && s.prevF<0.95 && F>=0.95){ s.cue95=true; Snd.tick(); vibe(15); }
  s.prevF=F;
}
function effFillRate(s){
  if(s.fHist.length<2) return 0;
  return (s.fHist[s.fHist.length-1]-s.fHist[0])/((s.fHist.length-1)*CFG.TICK);
}
/* ---------- 判定 §8.1 ---------- */
function judge(s,lvl){
  const o=foamOrder(lvl), b=bandOf(lvl);
  const F=(s.L+s.P)/s.C, R=s.P/Math.max(s.L+s.P,1e-9), Wr=s.W/s.C;
  let v;
  if(s.out==='OVERFLOW') v='OVERFLOW';
  else if(s.out==='SPILL'||Wr>=CFG.SPILL_OUT) v='SPILL';
  else if(F<b.min) v='LOW';
  else if(F>=CFG.PERFECT_F && Wr<CFG.PERFECT_W && R>=o.ideal[0] && R<=o.ideal[1]) v='PERFECT';
  else if(F>=b.great && R>=o.accept[0] && R<=o.accept[1]) v='GREAT';
  else v='SAFE';
  const sc=score(v,F,R,Wr,o,b);
  return {v,F,R,Wr,score:sc.total,parts:sc.parts};
}
/* 点の根拠を出せるよう、内訳(量75点/泡20点/こぼし5点)ごとに丸めてから足す */
function score(v,F,R,Wr,o,b){
  if(v==='OVERFLOW'||v==='SPILL'||v==='LOW') return {total:0,parts:null};
  const q=100*clamp((F-b.min)/(CFG.PERFECT_F-b.min),0,1);
  let f;
  const [i0,i1]=o.ideal,[a0,a1]=o.accept;
  if(R>=i0&&R<=i1) f=100;
  else if(R<i0) f=100*clamp((R-a0)/(i0-a0),0,1);
  else f=100*clamp((a1-R)/(a1-i1),0,1);
  const sp=100*clamp(1-Wr/CFG.SPILL_OUT,0,1);
  const parts={q:Math.round(q*0.75), f:Math.round(f*0.20), sp:Math.round(sp*0.05)};
  return {total:parts.q+parts.f+parts.sp, parts};
}
function foamLabel(R,lvl){
  const o=foamOrder(lvl);
  return R<o.ideal[0]?'少なめ':R>o.ideal[1]?'多め':'ちょうど';
}

/* 台詞: 直前と同じものを選ばない §12.1 */
const _lastLine={};
function pickLine(chId,verdict){
  const arr=CHARS[chId].lines[verdict]||[''];
  const key=chId+verdict;
  let idx=Math.floor(Math.random()*arr.length);
  if(arr.length>1 && idx===_lastLine[key]) idx=(idx+1)%arr.length;
  _lastLine[key]=idx;
  return arr[idx];
}

/* ---------- 入力 §5 (センサー不可時はスワイプで傾け) ---------- */
const Input = {
  mode:'button', enabled:false, btnHeld:false, holdT:0,
  tilt:{ang:0,b:0,g:0,gBase:null,base:null,baseBuf:[],dir:0,pouring:false,lastEvt:0,listening:false,everGot:false},
  /* 左右の傾き(-1〜1)。EXで揺れるグラスに瓶を合わせる。センサーが無ければ null */
  side(){
    const t=this.tilt;
    if(!t.everGot || performance.now()-t.lastEvt>3000) return null;
    if(t.gBase==null) t.gBase=t.g;
    return clamp((t.g-t.gBase)/8, -1, 1);          // ±8度で端まで
  },
  swipe:{active:false,startX:0,ang:0},
  useSwipe:false,
  flow(Qmax){
    if(!this.enabled) return 0;
    if(this.mode==='button'){
      if(!this.btnHeld) return 0;
      // 押し続けるほど流量が上がる。刻んで押せば弱く、押しっぱなしで強く注げる。
      // これがボタン操作での泡コントロール手段になる(§5.3)
      const x=smoothstep(this.holdT/CFG.HOLD_RAMP);
      return Qmax*lerp(CFG.FLOW_MIN,1,x);
    }
    let a;
    if(this.useSwipe){ a=Math.abs(this.swipe.ang); }
    else {
      const t=this.tilt;
      if(t.base===null) return 0;
      const d=t.ang-t.base;
      if(t.dir===0){ if(Math.abs(d)>CFG.TILT.DIR) t.dir=Math.sign(d); }
      else if(d*t.dir < -CFG.TILT.DIR && !t.pouring && !t.pouredOnce) t.dir=Math.sign(d);
      if(t.dir===0) return 0;
      a=Math.max(0, d*t.dir);                        // 反対側へ戻し過ぎても注がない
    }
    const st=this.mode==='tilt'?this.tilt:null;
    if(st){
      if(st.pouring){ if(a<CFG.TILT.STOP) st.pouring=false; }
      else { if(a>=CFG.TILT.START){ st.pouring=true; st.pouredOnce=true; } }
      if(!st.pouring) return 0;
    }
    const x=clamp((a-CFG.TILT.START)/(CFG.TILT.MAX-CFG.TILT.START),0,1);
    return Qmax*smoothstep(x);
  },
  resetRound(){
    this.btnHeld=false; this.holdT=0; this.tilt.gBase=null;
    const t=this.tilt; t.base=null; t.baseBuf=[]; t.dir=0; t.pouring=false; t.pouredOnce=false;
    this.swipe.active=false; this.swipe.ang=0;
    // センサーが後から生きた場合は毎ラウンド傾けへ戻す。
    // 以前は useSwipe が立ちっぱなしで、再読み込みするまで傾けが復活しなかった
    if(this.mode==='tilt' && t.everGot && performance.now()-t.lastEvt<2000) this.useSwipe=false;
  },
  startTiltListener(){
    const t=this.tilt;
    if(t.listening) return;
    window.addEventListener('deviceorientation',e=>{
      if(e.beta==null) return;
      t.lastEvt=performance.now();
      const b=e.beta==null?t.b:e.beta;
      const g=e.gamma==null?(t.g||0):e.gamma;
      // 初回は実測値をそのまま入れる。0から寄せると基準を取る間に
      // 収束途中の値が混ざり、注ぐ向きが逆に固定されることがあった
      if(!t.everGot){ t.b=b; t.g=g; t.everGot=true; }
      else { t.b += (b-t.b)*0.28; t.g += (g-t.g)*0.35; }
      t.ang = t.b;
    });
    t.listening=true;
  },
  async requestTilt(){
    try{
      if(typeof DeviceOrientationEvent!=='undefined' &&
         typeof DeviceOrientationEvent.requestPermission==='function'){
        const r=await DeviceOrientationEvent.requestPermission();
        if(r!=='granted') return false;
      }
      this.startTiltListener();
      return true;
    }catch(e){ return false; }
  },
};

/* キャラの画像は1人ぶんで約470KB。全員を1ファイルに抱えると読み込みが
   実用的でなくなるため、遊ぶレベルのぶんだけ art/<id>.json から取りに行く。
   単一ファイル版(Artifact用)は ART.scene に全部入っており、その場合は
   取りに行かずそのまま使う。 */
const sceneData = Object.assign({}, ART.scene||{});
const sceneLoading = {};
const sceneFailed = {};   // 失敗を覚える。覚えないと入るたびに5秒待たされる
function ensureScene(chId){
  if(!SCENE_IDS.includes(chId) || sceneData[chId]) return Promise.resolve();
  if(sceneLoading[chId]) return sceneLoading[chId];
  sceneLoading[chId] = fetch('art/'+chId+'.json')
    .then(r=>r.ok?r.json():null)
    .then(d=>{
      if(!d){ sceneFailed[chId]=true; delete sceneLoading[chId]; return; }
      // 画像の実体化まで待ってから公開する。JSONを読んだ時点で公開すると
      // 導入直後の数フレームが真っ暗になる。壊れた表情は外して素の顔に落とす
      const imgs={};
      return Promise.all(Object.keys(d.imgs).map(k=>new Promise(res=>{
        const im=new Image();
        im.onload=()=>res();
        im.onerror=()=>{ delete d.imgs[k]; delete imgs[k]; res(); };
        im.src=d.imgs[k]; imgs[k]=im;
      }))).then(()=>{ sceneImgs[chId]=imgs; sceneData[chId]=d; sceneFailed[chId]=false; });
    })
    .catch(()=>{ sceneFailed[chId]=true; delete sceneLoading[chId]; });
    // 失敗してもSVGのキャラで遊べる。次にこのキャラへ入ったとき取り直す
  return sceneLoading[chId];
}
/* 次のレベルを先に取っておく。結果表示中に読み終わるので待ち時間が消える */
function prefetchScene(n){ const l=levelOf(n); if(l){ ensureScene(l.ch); VoiceClips.load(); VoiceClips.prefetch(l.ch); } }
function setChara(chId){
  const sc=sceneData[chId];
  curScene = sc || null;
  el.game.classList.toggle('scene', !!sc);
  if(sc && !sceneImgs[chId]){
    sceneImgs[chId]={};
    for(const k in sc.imgs){ const im=new Image(); im.src=sc.imgs[k]; sceneImgs[chId][k]=im; }
  }
  G.sceneCh = sc ? chId : null;
  G.sceneFace = 'neutral';
  const art=ART.chars[chId];
  curPhoto = art || null;
  // 絵があるキャラなのに、まだ読み込めていない状態。ここで仮のSVGキャラを出すと
  // 導入の暗幕ごしに透けて、本物の絵と入れ替わるところが見えてしまう。
  // 読み終わるまで何も出さない
  scenePending = !sc && SCENE_IDS.includes(chId) && !sceneFailed[chId];
  Object.values(charaEls).forEach(s=>s.classList.remove('on'));
  curChara=charaEls[chId];
  if(curScene || scenePending){
    photoEl.classList.remove('on');
    el.charaArea.classList.remove('has-photo');
  } else if(art){                // バスト写真のキャラ
    photoEl.classList.add('on');
    el.charaArea.classList.add('has-photo');
  } else {
    photoEl.classList.remove('on');
    el.charaArea.classList.remove('has-photo');
    curChara.classList.add('on');
  }
}
/* 未生成の表情は意味の近いものへ落とす */
const FACE_FALLBACK={angry:'shock',drunk:'happy',low:'meh',meh:'neutral',
                     shock:'neutral',happy:'neutral',tele:'neutral',watch:'neutral'};
function resolveFace(imgs,f){
  let k=f, guard=0;
  while(!imgs[k] && FACE_FALLBACK[k] && guard++<5) k=FACE_FALLBACK[k];
  return imgs[k]?k:'neutral';
}
function setFace(f){
  if(curScene){ G.sceneFace = resolveFace(curScene.imgs, f); return; }
  if(curPhoto){

}

/* 泡の注文があるレベルだけ、注いでいる間の泡量を見せる(§11.2 泡のルールを教える) */
function setupFoamChip(){
  const o=foamOrder(G.lvl);
  el.foamChip.classList.add('on');   // 泡の仕組みを学べるよう全レベルで表示
  const zone=el.foamBar.querySelector('.zone');
  // 目盛りは0起点。許容の下限を左端にすると、注ぎはじめは泡が下限に
  // 届いていないので針が左端に張りついたままになり、壊れて見える
  const a1=o.accept[1];
  const pos=r=>clamp(r/a1,0,1)*100;
  zone.style.left=pos(o.ideal[0])+'%';
  zone.style.width=(pos(o.ideal[1])-pos(o.ideal[0]))+'%';
  el.foamBar.querySelector('i').style.left='0%';
  G._needle=null;
  el.foamWord.textContent='—';
  el.foamChip.classList.remove('good','bad');
}
function updateFoamChip(R,trend,fill){
  if(!el.foamChip.classList.contains('on')) return;
  const o=foamOrder(G.lvl);
  // 注ぎはじめは中身がほとんど無く、比率がはねて意味を持たない。
  // ある程度たまるまでは針を左端に置き、言葉も出さない
  const ready = fill>=0.06;
  // 泡の比率はフレームごとに細かく上下する。針をそのまま追わせると
  // 小刻みに震えて読めないので、表示だけ追従を鈍らせる
  const target = ready ? clamp(R/o.accept[1],0,1) : 0;
  G._needle = (G._needle==null) ? target : G._needle + (target-G._needle)*0.12;
  el.foamBar.querySelector('i').style.left=(G._needle*100)+'%';
  if(!ready){
    el.foamWord.textContent='—';
    el.foamChip.classList.remove('good','bad');
    return;
  }
  const w=foamLabel(R,G.lvl);
  el.foamWord.textContent=w+(trend>0?'↑':trend<0?'↓':'');
  el.foamChip.classList.toggle('good',w==='ちょうど');
  el.foamChip.classList.toggle('bad',w!=='ちょうど');
}

const G = {

/* 偽予兆(酔っ払いLV15): 肩だけ動く。グラス当たり判定は動かさない */
function newFakeState(lvl){
  if(!lvl.fake) return null;
  const [a,b]=lvl.fake.at;
  return {at:lvl.fake.atFixed!=null?lvl.fake.atFixed:a+Math.random()*(b-a), dur:lvl.fake.dur, state:'idle', t:0};
}
function hazardStateFrom(h){
  return {cfg:h, state:'idle', t:0,
    trigF: h.trigFixed!=null ? h.trigFixed : h.trig[0]+Math.random()*(h.trig[1]-h.trig[0])};   // ラウンド開始時に確定 §10.4
}
function newHazardState(lvl){
  if(!lvl.hazard) return null;
  return hazardStateFrom(lvl.hazard);
}
/* EXの2回目以降の動作。1つ目が済んで(空振り含む)から順に控える */
function newHazardQueue(lvl){
  if(!lvl.hazards || lvl.hazards.length<2) return [];
  return lvl.hazards.slice(1).map(hazardStateFrom);
}
/* LV20 超酔っ払い: 合図の直後にグラスを引く固定イベント。予兆なし。
   一度も注いでいなければ何も起きない。引きが戻ってから注ぐのが攻略法 */
function newPullState(lvl){
  if(!lvl.pull) return null;
  return {at:lvl.pull.at, dur:lvl.pull.dur, state:'idle', t:0, pouredBefore:false, waited:false};
}
function pullUpdate(dt){
  const pl=G.pull, s=G.sim;
  if(!pl||pl.state==='done') return;
  if(pl.state==='idle'){
    if(G.t>=pl.at){
      pl.state='on'; pl.t=0; pl.pouredBefore=s.poured;
      setFace('tele'); Snd.blip(700,0.06,'sine',0.06);
    }
    return;
  }
  pl.t+=dt;
  const MOVE=0.18, BACK=0.20;
  let frac;
  if(pl.t<MOVE) frac=smoothstep(pl.t/MOVE);
  else if(pl.t<pl.dur-BACK) frac=1;
  else if(pl.t<pl.dur) frac=1-smoothstep((pl.t-(pl.dur-BACK))/BACK);
  else { frac=0; pl.state='done'; pl.waited=!pl.pouredBefore; setFace('watch'); return; }
  const sc=CW/390;
  G.glassOff.x=64*frac*sc;
  G.curIntake=Math.min(G.curIntake??1, 1-frac);   // 引かれている間はほぼ入らない
}
/* 同じ場所の何レベル目かを返す(別紙3.1のレベル差分に使う) */
function stageOf(lvl){
  const bg=BGS[lvl.ch];
  const same=LEVELS.filter(l=>BGS[l.ch]===bg).map(l=>l.lv).sort((a,b)=>a-b);
  return same.indexOf(lvl.lv)+1;   // 1,2,3
}
/* 絵が無いときだけ写真背景を敷く。絵が後から届いたときにも呼んで消す */

function startLevel(n, retry){

  el.game.classList.toggle('ex',!!lvl.ex);

  if(!retry){
    el.introLv.textContent=(lvl.ex?'EX ':'')+'LEVEL '+lvl.lv;
    el.introName.textContent=CHARS[lvl.ch].name+(lvl.ex?'(強化)':'');
    const st=stageOf(lvl);

    el.introPlace.textContent='★'.repeat(CHARS[lvl.ch].stars)+'　'+CHARS[lvl.ch].place+'　—　'+stName;
    // 何が難しくなったのかを言葉で見せる。速さと泡の要求は画面から読み取れない
    const io_=foamOrder(lvl);

    el.introInfo.innerHTML=

      `止まるまで <b>${stopLag(lvl)>0?stopLag(lvl).toFixed(2).replace(/0$/,'')+'秒':'すぐ'}</b>　`+
      `泡 <b>${io_.label==='指定なし'?'自由':Math.round(io_.ideal[0]*100)+'〜'+Math.round(io_.ideal[1]*100)+'%'}</b>　`+
      (hzNames?`邪魔 <b>${hzNames}</b>`:'邪魔 <b>なし</b>')+
      (lvl.fake?'　<b>偽予兆あり</b>':'')+(lvl.pulse?'　<b>流量が揺れる</b>':'')+
      (lvl.ex&&lvl.sway&&lvl.swayScale?'<br><b>グラスが揺れ、手も震える</b>: 携帯を左右に傾けて瓶を合わせる<br><span style="font-size:11px">iPhoneは「動作と方向のアクセス」の許可が要る(断ると瓶は自動で追う)</span>':'')+
      (lvl.pull?'<br><b>固定パターン</b>(同じ動きを繰り返す)':'');
    el.intro.classList.add('on');

  } else {
