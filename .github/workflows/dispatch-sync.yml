# 配信元(このリポジトリ)が更新されたら、新URL側(mou-ippai/mou-ippai.github.io)の
# sync ワークフローをその場で起動する。予定実行(30分ごと)は当てにならず、
# 2026-09-12 14:16 を最後に 37時間以上一度も走らなかった。
#
# 起動には新URL側に対する権限が要る。secrets.SYNC_TOKEN に、
# mou-ippai/mou-ippai.github.io の Actions: Read and write を持つ
# 細かい権限のトークン(fine-grained PAT)を入れておく。無ければ何もしない。
#
# このファイルは main にだけ置く。deploy ブランチには .github を入れない。
# 入れると受け取り側の GITHUB_TOKEN がワークフローの変更を拒否して同期が止まる。
name: dispatch-sync
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  dispatch:
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.SYNC_TOKEN }}
    steps:
      - name: kick sync on mou-ippai/mou-ippai.github.io
        if: env.TOKEN != ''
        run: |
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/mou-ippai/mou-ippai.github.io/actions/workflows/sync.yml/dispatches \
            -d '{"ref":"main"}'
      - name: no token
        if: env.TOKEN == ''
        run: echo "SYNC_TOKEN が未設定。新URLの同期は手押しになる"
