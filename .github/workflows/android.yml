# 『もう一杯！』Android アプリ(Play に出す AAB)を GitHub のビルド用マシンで作る。
# 配信用リポジトリの .github/workflows/android.yml に置く(元は shiteru の docs/mou-ippai/android/ci/)。
# 手元に Android の開発環境は要らない。出来た AAB は、この実行結果ページの Artifacts からダウンロードする。
#
# 設定(リポジトリの Settings > Secrets and variables > Actions):
#   Secrets   ANDROID_KEYSTORE_BASE64   アップロード鍵(.jks)を base64 にした文字列
#             ANDROID_KEYSTORE_PASSWORD 鍵のパスワード
#             ANDROID_KEY_ALIAS         鍵の別名(既定 upload)
#   Variables APP_ID                    パッケージ名(Play に一度出したら変えられない)
#             START_URL                 ゲームの URL(https://<ID>.github.io/mou-ippai/)
#             ADMOB_APP_ID              AdMob のアプリ ID(ca-app-pub-…~…)
#             ADMOB_INTERSTITIAL_ID     AdMob の全画面広告ユニット ID(ca-app-pub-…/…)
# 未設定のものは、署名なし・テスト広告で作る(動作確認用。Play には出せない/収益は出ない)。
# versionCode は実行番号(run_number)。このファイルの名前を変えると番号が 1 に戻るので変えない。
name: Android build

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Android SDK の部品(API 36)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: 署名鍵(Secrets に入れてあるときだけ)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "署名あり"
          else
            echo "::warning::署名鍵が未設定です。署名なしの AAB になり、Play には出せません"
          fi

      - name: ビルド
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          APP_ID: ${{ vars.APP_ID }}
          START_URL: ${{ vars.START_URL }}
          ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
          ADMOB_INTERSTITIAL_ID: ${{ vars.ADMOB_INTERSTITIAL_ID }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          if [ -z "$ADMOB_APP_ID" ] || [ -z "$ADMOB_INTERSTITIAL_ID" ]; then
            echo "::warning::AdMob の本番 ID が未設定です。テスト広告で作ります(収益は出ません)"
          fi
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace bundleRelease assembleDebug
          echo "versionCode=$VERSION_CODE"

      - uses: actions/upload-artifact@v4
        with:
          name: mou-ippai-aab-${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: mou-ippai-debug-apk-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
