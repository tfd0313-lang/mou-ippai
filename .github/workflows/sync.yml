# 開発用リポジトリの deploy ブランチを、このサイトの main へ写す。
# 30分ごと＋手動実行(Actionsタブ→sync→Run workflow)
name: sync
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git fetch https://github.com/tfd0313-lang/mou-ippai deploy
          git push --force origin FETCH_HEAD:refs/heads/main
